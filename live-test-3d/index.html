const DATA={"PLATINUM":{"accent":"#9c7cff","games":[["Torino","Parma Calcio 1913",[]],["TSV 1860 München","Dynamo Dresden",[]],["Atalanta BC","AEK Athens",[]],["FK Partizan","Palermo FC",[]],["AS Reggina 1914","Académica de Coimbra",[]]]},"GOLD":{"accent":"#d5aa4f","games":[["Fenerbahçe SK","Eintracht Frankfurt",[]],["1. FC Kaiserslautern","Palmeiras",[]],["Sampdoria","Boca Juniors",[]],["Bologna FC","Feyenoord",[]],["Genoa CFC","Sunderland",[]]]},"SILVER":{"accent":"#c8d0da","games":[["Atlético Madrid","Tottenham Hotspur",[]],["FC Schalke 04","Celtic",[]],["Shakhtar Donetsk","Guangzhou FC",[]],["Olympique Marseille","São Paulo FC",[]],["SSC Napoli","Valencia CF",[]]]},"BRONZE":{"accent":"#bd7445","games":[["Dynamo Kyiv","Campobasso Calcio",[]],["CR Flamengo","AS Roma",[]],["River Plate","SS Lazio",[]],["Borussia Dortmund","Club América",[]],["Legia Warszawa","Hertha BSC",[]]]}};
let div="PLATINUM",goalQueue=[],popupBusy=false;const state={};Object.keys(DATA).forEach(d=>state[d]={minute:0,running:false,timer:null,shown:new Set()});
function img(n,c="logo"){return LOGOS[n]?`<img class="${c}" src="${LOGOS[n]}" alt="">`:""}function scoresAt(d,m){return DATA[d].games.map(g=>{let h=0,a=0;g[2].forEach(e=>{if(+e[0]<=m){if(e[1]===g[0])h++;else a++}});return[h,a]})}function baseOrder(d){return Object.keys(BASE[d])}function liveTable(d,m){let rows={};Object.entries(BASE[d]).forEach(([c,s])=>rows[c]={pts:s[0],gf:s[1],ga:s[2]});if(m===0)return baseOrder(d).map(c=>[c,rows[c].pts]);let sc=scoresAt(d,m);DATA[d].games.forEach((g,i)=>{let[h,a]=sc[i];rows[g[0]].gf+=h;rows[g[0]].ga+=a;rows[g[1]].gf+=a;rows[g[1]].ga+=h;if(h>a)rows[g[0]].pts+=3;else if(a>h)rows[g[1]].pts+=3;else{rows[g[0]].pts++;rows[g[1]].pts++}});return Object.entries(rows).sort((a,b)=>b[1].pts-a[1].pts||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||(b[1].gf-a[1].gf)).map(([c,s])=>[c,s.pts])}function phase(m){if(m===0)return"PRE MATCH";if(m<45)return"PRIMO TEMPO";if(m===45)return"HALF TIME";if(m<90)return"SECONDO TEMPO";return"FULL TIME"}function pulse(d,m){let all=[];DATA[d].games.forEach(g=>g[2].forEach(e=>{if(+e[0]<=m)all.push({m:+e[0],p:e[2],t:e[1]})}));all.sort((a,b)=>b.m-a.m);let sc=scoresAt(d,m);return{goals:all.length,close:sc.filter(x=>Math.abs(x[0]-x[1])<=1).length,draws:sc.filter(x=>x[0]===x[1]).length,last:all[0]||null}}
function render(){let D=DATA[div],S=state[div],sc=scoresAt(div,S.minute),total=sc.reduce((n,x)=>n+x[0]+x[1],0),lt=liveTable(div,S.minute),bo=baseOrder(div),p=pulse(div,S.minute);document.documentElement.style.setProperty("--a",D.accent);document.getElementById("tabs").innerHTML=Object.keys(DATA).map(k=>`<button class="tab ${k===div?'on':''}" onclick="setDiv('${k}')">${k}</button>`).join("");document.getElementById("app").innerHTML=`<section class="center"><div class="control"><span class="phase">${phase(S.minute)}</span><span class="clock">${S.minute}'</span><span class="goals">${total} GOL</span></div><div class="buttons"><button class="btn primary" onclick="toggle()">${S.running?'Ⅱ PAUSA':'▶ AVVIA'}</button><button class="btn" onclick="step()">+1 MINUTO</button><button class="btn" onclick="resetDiv()">↺ RESET</button></div>${D.games.map((g,i)=>{let[h,a]=sc[i],ev=g[2].filter(e=>+e[0]<=S.minute);return`<div class="game"><div class="score"><div class="team">${img(g[0])}<span>${g[0]}</span></div><div class="num">${h}–${a}</div><div class="team away"><span>${g[1]}</span>${img(g[1])}</div></div><div class="events">${ev.length?ev.map(e=>`<span class="event"><b>${e[0]}'</b> ${e[2]}</span>`).join(""):`<span class="waiting">${S.minute===0?'IN ATTESA DEL CALCIO D’INIZIO':'NESSUN GOL FINORA'}</span>`}</div></div>`}).join("")}</section><section class="pulse"><div class="pulseTitle">MATCHDAY PULSE · ${div}</div><div class="pulseGrid"><div class="pulseBox"><div class="pulseNum">${p.goals}</div><div class="pulseLab">GOL</div></div><div class="pulseBox"><div class="pulseNum">${p.close}</div><div class="pulseLab">MATCH ENTRO 1 GOL</div></div><div class="pulseBox"><div class="pulseNum">${p.draws}</div><div class="pulseLab">PAREGGI LIVE</div></div></div><div class="pulseLast">${p.last?`ULTIMO GOL · ${p.last.m}' ${p.last.p} · ${p.last.t}`:'IN ATTESA DEL PRIMO GOL'}</div></section><section class="section"><h2>${S.minute>=90?'CLASSIFICA AGGIORNATA':'CLASSIFICA LIVE'}</h2><div class="tab function step(){let S=state[div];if(popupBusy||goalQueue.length||S.minute>=90)return;S.minute++;let found=collect();render();if(found){pauseTicker();processQueue();return}if(S.minute===45)special("HALF TIME");if(S.minute===90){S.running=false;clearInterval(S.timer);S.timer=null;special("FULL TIME")}}function toggle(){let S=state[div];if(S.running){S.running=false;if(S.timer)clearInterval(S.timer);S.timer=null}else{if(S.minute>=90)resetDiv();S=state[div];S.running=true;if(!popupBusy)S.timer=setInterval(step,1000)}render()}function resetDiv(){let S=state[div];if(S.timer)clearInterval(S.timer);state[div]={minute:0,running:false,timer:null,shown:new Set()};goalQueue=[];popupBusy=false;hide();render()}function setDiv(d){let S=state[div];if(S.timer)clearInterval(S.timer);S.running=false;S.timer=null;goalQueue=[];popupBusy=false;div=d;hide();render()}function collect(){let S=state[div],D=DATA[div],before=liveTable(div,Math.max(0,S.minute-1)),found=false;D.games.forEach((g,i)=>g[2].forEach((e,j)=>{let k=i+"-"+j;if(+e[0]===S.minute&&!S.shown.has(k)){S.shown.add(k);found=true;let sc=scoresAt(div,S.minute)[i],after=liveTable(div,S.minute),oldPos=before.findIndex(r=>r[0]===e[1])+1,newPos=after.findIndex(r=>r[0]===e[1])+1;goalQueue.push({e,g,sc,oldPos,newPos})}}));return found}function pauseTicker(){let S=state[div];if(S.timer)clearInterval(S.timer);S.timer=null}function processQueue(){if(popupBusy)return;if(!goalQueue.length){popupBusy=false;let S=state[div];if(S.running&&S.minute<90&&!S.timer)S.timer=setInterval(step,1000);return}popupBusy=true;let x=goalQueue.shift();showGoal(x,()=>{popupBusy=false;processQueue()})}
function showGoal(x,done){let[eTeam,eMin,ePlayer]=[x.e[1],x.e[0],x.e[2]],o=document.getElementById("overlay"),changed=x.oldPos&&x.newPos&&x.oldPos!==x.newPos;o.innerHTML=`<div class="premiumGlow"></div><div class="premiumPanel"><div id="goalPhase">${img(eTeam,"ovlogo")}<div class="ovsmall">${eMin}' · GOL</div><div class="ovbig">GOAL</div><div class="ovtext">${ePlayer}</div><div class="ovmatch">${x.g[0]} ${x.sc[0]}–${x.sc[1]} ${x.g[1]}</div><div class="stamp">IMC · ROAD TO HISTORY</div></div><div id="tablePhase" class="tablePhase"></div></div>`;o.classList.add("show");document.querySelector(".center")?.classList.add("shake");setTimeout(()=>document.querySelector(".center")?.classList.remove("shake"),360);if(changed)setTimeout(()=>{let gp=document.getElementById("goalPhase"),tp=document.getElementById("tablePhase");if(!gp||!tp)return;gp.classList.add("fade");setTimeout(()=>{gp.style.display="none";let h=x.newPos===1?"⚡ NUOVA CAPOLISTA":x.newPos<x.oldPos?"▲ SALE IN CLASSIFICA":"▼ SCENDE IN CLASSIFICA";tp.innerHTML=`<div class="tableKicker">CLASSIFICA LIVE</div><div class="tableHeadline">${h}</div><div class="tableClub">${eTeam}</div><div class="tableMove">${x.oldPos}° → ${x.newPos}°</div><div class="stamp">IMC · ROAD TO HISTORY</div>`;tp.classList.add("show")},180)},2750);setTimeout(()=>{hide();done()},6400)}function special(t){let o=document.getElementById("overlay");o.innerHTML=`<div class="premiumPanel"><div class="ovbig">${t}</div></div>`;o.classList.add("show");setTimeout(hide,1100)}function hide(){document.getElementById("overlay").classList.remove("show")}render();
