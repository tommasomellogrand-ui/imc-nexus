":22},"Club América":{"pts":5,"gf":11,"ga":31}}};const DATA={"PLATINUM":{"accent":"#9c7cff","games":[["Torino","Parma Calcio 1913",[["1","Torino","Güler"],["26","Torino","Martínez"],["27","Parma Calcio 1913","Fernandes"],["34","Torino","González"],["52","Torino","Doku"],["76","Torino","González"],["77","Parma Calcio 1913","Son"]]],["TSV 1860 München","Dynamo Dresden",[["16","TSV 1860 München","Chiesa"],["30","Dynamo Dresden","Neto"],["40","TSV 1860 München","Hofmann"],["55","TSV 1860 München","Costa"],["87","Dynamo Dresden","Guimarães (rig.)"]]],["Atalanta BC","AEK Athens",[["14","Atalanta BC","Kane"],["16","Atalanta BC","Kane"],["39","AEK Athens","Neres"]]],["FK Partizan","Palermo FC",[["31","FK Partizan","Messi"],["38","Palermo FC","Éderson"],["84","Palermo FC","Pulisic"]]],["AS Reggina 1914","Académica de Coimbra",[["25","Académica de Coimbra","Haaland"]]]]},"GOLD":{"accent":"#d5aa4f","games":[["Fenerbahçe SK","Eintracht Frankfurt",[["5","Eintracht Frankfurt","Lookman"],["19","Eintracht Frankfurt","Trossard"],["81","Fenerbahçe SK","Olmo"]]],["1. FC Kaiserslautern","Palmeiras",[["44","1. FC Kaiserslautern","Mbaye"],["65","1. FC Kaiserslautern","Karl"],["85","1. FC Kaiserslautern","Cubarsí"]]],["Sampdoria","Boca Juniors",[["19","Sampdoria","Vitinha"],["34","Boca Juniors","Oyarzabal"],["85","Sampdoria","Hakimi"]]],["Bologna FC","Feyenoord",[["8","Feyenoord","Hadj Moussa"],["40","Bologna FC","Choupo-Moting"],["76","Feyenoord","Hadj Moussa"]]],["Genoa CFC","Sunderland",[["6","Genoa CFC","Vlahović (rig.)"],["88","Sunderland","Kean"]]]]},"SILVER":{"accent":"#c8d0da","games":[["Atlético Madrid","Tottenham Hotspur",[["21","Atlético Madrid","Sancet"],["57","Atlético Madrid","Bowen"],["68","Atlético Madrid","Koke"],["81","Atlético Madrid","Sancet"]]],["FC Schalke 04","Celtic",[["3","Celtic","Suárez"],["30","Celtic","Musiala"],["32","Celtic","Suárez (rig.)"],["79","Celtic","Ødegaard"]]],["Shakhtar Donetsk","Guangzhou FC",[["12","Shakhtar Donetsk","Zaïre-Emery"],["30","Guangzhou FC","Óskarsson (rig.)"],["31","Shakhtar Donetsk","Fernandes"]]],["Olympique Marseille","São Paulo FC",[["14","Olympique Marseille","Osimhen"],["52","São Paulo FC","Thwaites"]]],["SSC Napoli","Valencia CF",[["36","Valencia CF","Yamal"],["76","Valencia CF","Bernardeau"]]]]},"BRONZE":{"accent":"#bd7445","games":[["Dynamo Kyiv","Campobasso Calcio",[["30","Dynamo Kyiv","Hajdari"],["37","Campobasso Calcio","Sesko"],["49","Campobasso Calcio","Díaz"],["58","Dynamo Kyiv","Trincão"],["65","Dynamo Kyiv","Conceição"],["80","Dynamo Kyiv","Conceição"]]],["CR Flamengo","AS Roma",[["19","AS Roma","Konstantelias"],["38","AS Roma","Touré"]]],["River Plate","SS Lazio",[["28","SS Lazio","Mbappé"],["41","SS Lazio","Savinho"],["46","SS Lazio","Bakayoko"],["63","SS Lazio","Mbappé"]]],["Borussia Dortmund","Club América",[["38","Club América","Williams"]]],["Legia Warszawa","Hertha BSC",[["20","Hertha BSC","Zieliński (rig.)"],["59","Hertha BSC","Inácio"]]]]}};let div='PLATINUM',q=[],busy=false;let S={};Object.keys(DATA).forEach(d=>S[d]={m:0,run:false,t:null,seen:new Set()});function sc(d,m){return DATA[d].games.map(g=>{let h=0,a=0;g[2].forEach(e=>{if(+e[0]<=m){if(e[1]===g[0])h++;else a++}});return[h,a]})}function table(d,m){let r={};Object.entries(BASE[d]).forEach(([c,x])=>r[c]={...x});if(!m)return Object.entries(r).sort((a,b)=>b[1].pts-a[1].pts||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||(b[1].gf-a[1].gf)).map(([c,x])=>[c,x.pts]);let z=sc(d,m);DATA[d].games.forEach((g,i)=>{let[h,a]=z[i],A=r[g[0]],B=r[g[1]];A.gf+=h;A.ga+=a;B.gf+=a;B.ga+=h;if(h>a)A.pts+=3;else if(a>h)B.pts+=3;else{A.pts++;B.pts++}});return Object.entries(r).sort((a,b)=>b[1].pts-a[1].pts||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||(b[1].gf-a[1].gf)).map(([c,x])=>[c,x.pts])}function pos(d,m,c){return table(d,m).findIndex(x=>x[0]===c)+1}function logo(c){return `<img src="${LOGOS[c]||''}">`}function render(){let D=DATA[div],x=S[div],z=sc(div,x.m),lt=table(div,x.m),bp=table(div,0).map(x=>x[0]);document.documentElement.style.setProper
