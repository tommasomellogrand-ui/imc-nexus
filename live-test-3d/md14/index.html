val(S[d].t);S[d]={m:0,run:false,t:null,seen:new Set()}});q=[];busy=false;ov.classList.remove('show');render()}function seed(){test=true;const mins=[7,14,22,31,39,48,57,66,74,83],k=['GOL','GOL','GOL','RIGORE','PUNIZIONE','AUTOGOL'];Object.values(D).forEach((x,di)=>x.g.forEach((g,gi)=>{g[2]=[];let n=1+((di+gi)%4);for(let j=0;j<n;j++){let kind=k[(di*5+gi+j)%k.length],team=((j+gi)%2===0)?g[0]:g[1];g[2].push([mins[(di*3+gi*2+j)%mins.length],team,'Marcatore Test',kind==='GOL'?'Assist Test':null,kind])}g[2].sort((a,b)=>a[0]-b[0])}));reset();test=true;render()}function setD(d){if(S[div].t)clearInterval(S[div].t);S[div].run=false;S[div].t=null;q=[];busy=false;div=d;render()}render();</script></body></html>
