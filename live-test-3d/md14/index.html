>a)H.pts+=3;else if(a>h)A.pts+=3;else{H.pts++;A.pts++}});return Object.entries(r).sort((a,b)=>b[1].pts-a[1].pts||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||b[1].gf-a[1].gf)}function ranks(d,min){let x={};table(d,min).forEach((r,i)=>x[r[0]]={pos:i+1,pts:r[1].pts});return x}function ctx(g,e){let i=G[div].indexOf(g),bef=score(div,Math.max(0,m-1))[i],aft=score(div,m)[i],home=e[1]===g[0],b=home?bef:[bef[1],bef[0]],a=home?aft:[aft[1],aft[0]],type=b[0]<b[1]&&a[0]===a[1]?'PAREGGIO':b[0]===b[1]?'VANTAGGIO':b[0]<b[1]&&a[0]>a[1]?'SORPASSO':'ALLUNGO';return{type,aft}}function events(){let out=[],pre=ranks(div,Math.max(0,m-1)),post=ranks(div,m);G[div].forEach(g=>g[2].forEach(e=>{if(e[0]===m){let c=ctx(g,e),moved=Object.keys(post).filter(c=>pre[c]&&pre[c].pos!==post[c].pos).map(c=>({team:c,old:pre[c].pos,now:post[c].pos,pts:post[c].pts})).sort((a,b)=>a.now-b.now);out.push({g,e,c,moved})}}));return out}function phrase(x){let a=FL[x.c.type];return a[(x.e[0]+x.e[1].length)%a.length]}function render(){let z=score(div,m),tb=table(div,m);tabs.innerHTML=Object.keys(G).map(d=>`<button class="${d===div?'on':''}" onclick="setD('${d}')">${d}</button>`).join('');app.innerHTML=`<section class="hero"><div class="ey">RTH · LIVE CENTER · NEXUS TEST</div><h1>MATCHDAY <span>14</span></h1><p>SIMULAZIONE COMPLETA · GIOCATORI REALI · STORY ENGINE</p></section><div class="status"><div class="pill test">TEST STORY ENGINE</div><div class="pill">${z.reduce((s,x)=>s+x[0]+x[1],0)} GOL</div></div><section class="box"><div class="ctrl"><div>${run?'LIVE SIMULATION':'READY'}</div><div class="clock">${m}'</div><div class="right">${div}</div></div><div class="buttons"><button class="p" onclick="toggle()">${run?'PAUSA':'PLAY'}</button><button onclick="jump()">+5 MIN</button><button onclick="restart()">RESTART</button><button onclick="finish()">90'</button></div>${G[div].map((g,i)=>`<div class="g"><div class="score"><div class="t">${logo(g[0])}<span>${g[0]}</span></div><div class="n">${z[i][0]}–${z[i][1]}</div><div class="t away"><span>${g[1]}</span>${logo(g[1])}</div></div><div class="ev">${g[2].filter(e=>e[0]<=m).map(e=>`<span class="e"><b>${e[0]}'</b> ${e[2]}${e[3]?` · A ${e[3]}`:''}</span>`).join('')||'<span class="e">In attesa</span>'}</div></div>`).join('')}</section><section class="sec"><h2>CLASSIFICA LIVE</h2><div class="table">${tb.map((r,i)=>`<div class="r"><b>${i+1}</b>${logo(r[0])}<span class="club">${r[0]}</span><b class="pts">${r[1].pts} PT</b></div>`).join('')}</div></section>`}function step(){if(busy||m>=90)return;m++;events().forEach(x=>{let k=x.e[0]+'|'+x.e[1]+'|'+x.e[2];if(!seen.has(k)){seen.add(k);queue.push(x)}});render();if(queue.length){busy=true;clearInterval(timer);timer=null;show(queue.shift())}else if(m>=90){run=false;clearInterval(timer);timer=null}}function show(x){let team=x.e[1],home=team===x.g[0],colors=['#071a33','#0d3260','#f1cb70'];if(team==='Torino')colors=['#651022','#28040b','#f3c76d'];if(team==='Palermo FC')colors=['#411425','#a8466f','#ffc1d6'];if(team==='AEK Athens'||team==='Borussia Dortmund')colors=['#171717','#5b4a00','#ffd84a'];ov.style.setProperty('--c1',colors[0]);ov.style.setProperty('--c2',colors[1]);ov.style.setProperty('--lite',colors[2]);let movement=x.moved.slice(0,4).map(y=>`<div class="move"><div class="pos">${y.now}°</div>${logo(y.team)}<b>${y.team}</b><b>${y.pts} PT</b><div class="delta ${y.now<y.old?'up':'dn'}">${y.now<y.old?'↑':'↓'}${Math.abs(y.old-y.now)}</div></div>`).join('');let homeVoice=team==='Borussia Dortmund'&&home?'IL MURO GIALLO ESPLODE!':team==='Boca Juniors'&&home?'LA BOMBONERA TREMA!':VOICE[team]||`${team.toUpperCase()} COLPISCE!`;let mgr=(MGR[team]&&((x.e[0]+team.length)%3===0))?`<div class="manager">${MGR[team]}</div>`:'';ov.classList.add('show');ov.innerHTML=`<div class="panel"><img class="wm" src="${U(team)}"><div id="story" class="story"><img class="crest" src="${U(team)}"><div class="kicker">${x.e[0]}' · ${x.c.type} ${team.toUpperCase()}</div><div class="headline">${phrase(x)}</div><div class="voice">${homeVoice}</div><div class="scorer">${x.e[2]}</div><div class="assist">Assist: <b>${x.e[3]}</b></div>${mgr}<div class="match">${x.g[0]} ${x.c.aft[0]}–${x.c.aft[1]} ${x.g[1]}</div></div><div id="movement" class="movement"><img class="crest" src="${U(team)}"><h3>CLASSIFICA LIVE · EFFETTO DEL GOL</h3>${movement||'<div class="headline" style="font-size:27px">POSIZIONI INVARIATE</div>'}</div></div>`;if(x.moved.length)setTimeout(()=>{story.style.display='none';movement.style.display='block'},3300);setTimeout(()=>{ov.classList.remove('show');busy=false;if(queue.length){busy=true;show(queue.shift())}else if(run)timer=setInterval(step,700)},6500)}function toggle(){run=!run;if(run&&!busy&&!timer)timer=setInterval(step,700);else if(!run&&timer){clearInterval(timer);timer=null}render()}function jump(){for(let i=0;i<5;i++)if(!busy)step()}function restart(){clearInterval(timer);timer=null;run=false;m=0;queue=[];busy=false;seen=new Set();ov.classList.remove('show');render()}function finish(){m=90;run=false;clearInterval(timer);timer=null;render()}function setD(d){clearInterval(timer);timer=null;run=false;m=0;queue=[];busy=false;seen=new Set();ov.classList.remove('show');div=d;render()}render();</script></body></html>
