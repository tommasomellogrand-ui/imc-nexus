const R=RTH14,T=R.T,D=R.D,F=R.F,N=R.NAMES;const app=document.getElementById('app');const qs=new URLSearchParams(location.search);const view=qs.get('view')||'home';const d=Number(qs.get('d')||1);const mi=Number(qs.get('m')||0);const base='index.html';
function header(dark=true){return `<div class="wrap"><div class="top"><a class="brand" href="${base}"><img src="/nexus/assets/imc-logo.png" alt="IMC"><div><b>ROAD TO HISTORY</b><small>SEASON 1 · GW001</small></div></a><div class="date"><b>27 AUG 2026</b><small>MATCHDAY 14 · 20:00</small></div></div></div>`}
function formScore(s){return [...s].reduce((a,x)=>a+(x==='W'?3:x==='D'?1:0),0)}function pills(s){return `<div class="form-pills">${[...s].map(x=>`<span class="${x}">${x}</span>`).join('')}</div>`}function divLink(x){return `${base}?view=division&d=${x}`}function matchLink(x,i){return `${base}?view=match&d=${x}&m=${i}`}function fpair(x,i){return F[x][i]}function name(id){return T[id][1]}function logo(id){return T[id][2]}function leader(x){return D[x][0]}function big(x){return R.BIG[x]}
function hero(){return `<section class="hero">${header()}<div class="wrap hero-inner"><div class="ey">IMC · ROAD TO HISTORY · SEASON 1</div><h1>MATCHDAY<br><span>14</span></h1><div class="hero-lead">20 MATCHES. 40 CLUBS. ONE NIGHT TO MOVE THE STORY FORWARD.</div><div class="hero-meta"><span class="pill">27 AUG 2026</span><span class="pill">KICK-OFF · 20:00</span><span class="pill">POWERED BY NEXUS DATA</span></div></div><div class="scroll">SCROLL · MATCHDAY CENTRE ↓</div></section>`}
function mainEvent(){let [x,i]=R.MAIN,[a,b,,why]=F[x][i],A=T[a],B=T[b];return `<section class="section white"><div class="wrap"><div class="section-head"><div><div class="ey">TONIGHT'S MAIN EVENT</div><h2>ONE MATCH.<br>EXTRA WEIGHT.</h2></div><p class="section-copy">Classifica, forma e dati Nexus convergono su uno degli incroci più pesanti della serata.</p></div><div class="main-event"><div class="event-copy"><div class="ey">${N[x]} · MATCHDAY 14</div><h3>${why}</h3><p>#${A[4]} ${A[1]} · ${A[5]} PT &nbsp; vs &nbsp; #${B[4]} ${B[1]} · ${B[5]} PT</p><a class="btn" href="${matchLink(x,i)}">ENTER MATCH CENTRE →</a></div><div class="event-duel"><div class="club"><img src="${A[2]}"><b>${A[1]}</b><small>${A[3]}</small></div><div class="vs">20:00<br>VS</div><div class="club"><img src="${B[2]}"><b>${B[1]}</b><small>${B[3]}</small></div></div></div></div></section>`}
function divisions(){return `<section class="section ice"><div class="wrap"><div class="section-head"><div><div class="ey">CHOOSE YOUR DIVISION</div><h2>FOUR ROADS.<br>ONE HISTORY.</h2></div><p class="section-copy">Ogni divisione ha le sue cinque partite, la classifica aggiornata e un Big Match selezionato per la serata.</p></div><div class="div-grid">${[1,2,3,4].map(x=>{let L=T[leader(x)];return `<a class="div-card" href="${divLink(x)}"><img class="leader-logo" src="${L[2]}"><div class="ey">DIVISION ${x}</div><h3>${N[x]}</h3><div class="lead">Leader · ${L[1]}<br><b>${L[5]} POINTS</b> · 5 MATCHES TONIGHT</div><span class="go">→</span></a>`}).join('')}</div></div></section>`}
function atGlance(){return `<section class="section white"><div class="wrap"><div class="section-head"><div><div class="ey">TONIGHT AT A GLANCE</div><h2>20 FIXTURES.<br>ONE SCREEN.</h2></div><p class="section-copy">Il turno completo, divisione per divisione. Tocca una partita per entrare direttamente nel suo Match Centre.</p></div><div class="fixture-columns">${[1,2,3,4].map(x=>`<div class="fixture-col"><h3>${N[x]}</h3>${F[x].map((f,i)=>`<a class="mini-fixture" href="${matchLink(x,i)}"><img src="${logo(f[0])}"><span>${name(f[0])}</span><span class="dash">VS</span><span>${name(f[1])}</span><img src="${logo(f[1])}"></a>`).join('')}</div>`).join('')}</div></div></section>`}
function stories(){return `<section class="section dark"><div class="wrap"><div class="section-head"><div><div class="ey">4 DIVISIONS · 4 STORIES</div><h2>THE MATCHES<br>TO WATCH.</h2></div><p class="section-copy" style="color:#94a6ba">Una storia per divisione. Quattro porte d’ingresso al Matchday.</p></div><div class="story-grid">${[1,2,3,4].map(x=>{let i=big(x),f=F[x][i];return `<a class="story" href="${matchLink(x,i)}"><div class="story-logos"><img src="${logo(f[0])}"><img src="${logo(f[1])}"></div><div class="ey">${N[x]}</div><h3>${f[3]}</h3><p>${name(f[0])} vs ${name(f[1])} · 20:00</p></a>`}).join('')}</div></div></section>`}
function before(){let all=Object.values(T),attack=[...all].sort((a,b)=>b[6]-a[6])[0],def=[...all].sort((a,b)=>a[7]-b[7])[0],hot=[...all].sort((a,b)=>formScore(b[11])-formScore(a[11])||b[6]-a[6])[0],top=[...all].sort((a,b)=>b[13]-a[13])[0];return `<section class="section ice"><div class="wrap"><div class="section-head"><div><div class="ey">BEFORE THE WHISTLE</div><h2>THE NIGHT<br>IN NUMBERS.</h2></div></div><div class="number-grid"><div class="number"><strong>36</strong><b>TOP ATTACK</b><small>${attack[1]} · ${attack[6]} goals</small></div><div class="number"><strong>${def[7]}</strong><b>BEST DEFENCE</b><small>${def[1]} · goals conceded</small></div><div class="number"><strong>${formScore(hot[11])}/15</strong><b>HOTTEST FORM</b><small>${hot[1]} · ${hot[11]}</small></div><div class="number"><strong>${top[13]}</strong><b>TOP AVG RATING</b><small>${top[12]} · ${top[1]}</small></div></div></div></section>`}
function players(){return `<section class="section white"><div class="wrap"><div class="section-head"><div><div class="ey">PLAYERS ON FIRE</div><h2>FOUR MEN.<br>FOUR DIVISIONS.</h2></div><p class="section-copy">Il miglior rating medio disponibile per ogni divisione dai Match Report Nexus.</p></div><div class="players-grid">${[1,2,3,4].map(x=>{let s=D[x].map(id=>T[id]).sort((a,b)=>b[13]-a[13])[0],id=D[x].find(id=>T[id]===s),idx=F[x].findIndex(f=>f[0]===id||f[1]===id);return `<a class="star" href="${matchLink(x,idx)}"><div class="star-photo"><img src="${s[18]}"></div><div class="star-info"><small>${N[x]} · PLAYER TO WATCH</small><h3>${s[12]}</h3><div class="star-stat"><span><b>${s[13]}</b> AVG</span><span><b>${s[14]}</b> G</span><span><b>${s[15]}</b> A</span><span><b>${s[16]}</b> MVP</span></div></div></a>`}).join('')}</div></div></section>`}
function home(){app.innerHTML=hero()+mainEvent()+divisions()+atGlance()+stories()+before()+players()+`<section class="closing"><div class="wrap"><h2>20 MATCHES.<br><span>ONE NIGHT.</span><br>ROAD TO HISTORY.</h2></div></section>`}
function division(x){let bigi=big(x);app.innerHTML=`<section class="subhero">${header()}<div class="wrap subhero-inner"><div class="crumb"><a href="${base}">MATCHDAY 14</a> / DIVISION ${x}</div><div class="ey">ROAD TO HISTORY</div><h1>${N[x]}</h1><p style="color:#a8b8ca;max-width:540px;font-size:12px">Five matches. One table. Every point changes the shape of the night.</p></div></section><section class="section ice"><div class="wrap"><div class="section-head"><div><div class="ey">TONIGHT'S FIXTURES</div><h2>FIVE MATCHES.<br>FIVE STORIES.</h2></div></div><div class="fixture-list">${F[x].map((f,i)=>{let A=T[f[0]],B=T[f[1]];return `<a class="fixture-card ${i===bigi?'big':''}" href="${matchLink(x,i)}"><div class="fteam"><img src="${A[2]}"><div><b>${A[1]}</b><small>#${A[4]} · ${A[5]} PT · ${A[11]}</small></div></div><div class="center">20:00<br>VS</div><div class="fteam right"><div><b>${B[1]}</b><small>#${B[4]} · ${B[5]} PT · ${B[11]}</small></div><img src="${B[2]}"></div><span class="open">→</span></a>`}).join('')}</div><div class="section-head" style="margin-top:55px"><div><div class="ey">AFTER MATCHDAY 13</div><h2>THE TABLE.</h2></div></div><div class="table-card">${D[x].map((id,i)=>{let z=T[id];return `<div class="tr"><b>${i+1}</b><img src="${z[2]}"><span class="tn">${z[1]}</span><span class="num">${z[6]} GF</span><span class="num">${z[7]} GA</span><span class="num">${z[6]-z[7]>=0?'+':''}${z[6]-z[7]}</span><span class="points">${z[5]}</span></div>`}).join('')}</div></div></section>`}
function metric(label,A,B,ai,bi){let av=A[ai],bv=B[bi],max=Math.max(Number(av),Number(bv),1),wa=Math.max(4,Number(av)/max*50),wb=Math.max(4,Number(bv)/max*50);return `<div class="metric"><div class="metric-top"><span>${label}</span><span>MATCH REPORT AVG</span></div><div class="metric-values"><img src="${A[2]}"><b>${av}</b><div class="bar"><i style="width:${wa}%"></i><em style="width:${wb}%"></em></div><b>${bv}</b><img src="${B[2]}"></div></div>`}
function playerCard(z){return `<div class="player-card"><div class="pic"><img src="${z[18]}"></div><div class="pcopy"><div class="ey">PLAYER TO WATCH · ${z[1]}</div><h3>${z[12]}</h3><div class="player-numbers"><div><b>${z[13]}</b><small>AVG</small></div><div><b>${z[14]}</b><small>GOALS</small></div><div><b>${z[15]}</b><small>ASSISTS</small></div><div><b>${z[16]}</b><small>MVP</small></div></div></div></div>`}
function match(x,i){let f=F[x][i],A=T[f[0]],B=T[f[1]],prev=i>0?matchLink(x,i-1):divLink(x),next=i<4?matchLink(x,i+1):divLink(x);app.innerHTML=`<section class="match-hero">${header()}<div class="wrap match-hero-content"><div class="match-meta">${N[x]} · MATCHDAY 14 · MATCH ${i+1}/5 · KICK-OFF 20:00</div><div class="duel"><div class="duel-team"><img src="${A[2]}"><h1>${A[1]}</h1><small>#${A[4]} · ${A[5]} POINTS</small></div><div class="duel-vs">VS</div><div class="duel-team"><img src="${B[2]}"><h1>${B[1]}</h1><small>#${B[4]} · ${B[5]} POINTS</small></div></div></div></section><div class="headline-strip"><div class="wrap"><div class="headline-box"><div class="ey">WHY THIS MATCH MATTERS</div><h2>${f[3]}</h2><div style="font-size:9px;color:var(--muted)">${A[3]} vs ${B[3]} · ${N[x]}</div></div></div></div><section class="section ice"><div class="wrap"><div class="match-grid"><div class="panel"><div class="ey">MOMENTUM</div><h3>LAST FIVE</h3><div class="form-duel"><div class="formteam"><b>${A[1]}</b>${pills(A[11])}</div><div class="formteam"><b>${B[1]}</b>${pills(B[11])}</div></div></div><div class="panel darkpanel"><div class="ey" style="color:#76aaff">THE DUGOUT</div><h3>MANAGER DUEL</h3><div class="dugout"><div class="boss"><b>${A[3]}</b><small>${A[1]}</small></div><div class="vs">VS</div><div class="boss"><b>${B[3]}</b><small>${B[1]}</small></div></div></div></div><div class="section-head" style="margin-top:55px"><div><div class="ey">MATCH INTELLIGENCE</div><h2>NUMBERS<br>BEFORE NOISE.</h2></div><p class="section-copy">Medie elaborate sui Match Report di campionato disponibili fino al Matchday 13.</p></div><div class="metrics">${metric('POSSESSION %',A,B,8,8)}${metric('SHOTS / MATCH',A,B,9,9)}${metric('SHOTS ON TARGET',A,B,10,10)}${metric('GOALS SCORED',A,B,6,6)}${metric('GOALS CONCEDED',A,B,7,7)}</div><div class="section-head" style="margin-top:55px"><div><div class="ey">STAR POWER</div><h2>PLAYERS<br>TO WATCH.</h2></div></div><div class="player-duel">${playerCard(A)}${playerCard(B)}</div></div></section><section class="section white"><div class="wrap"><div class="question"><div class="ey">THE DATA QUESTION</div><h2>${f[4]}</h2></div><div class="h2h" style="margin-top:22px"><div class="prior"><div class="ey">HEAD TO HEAD</div><h3 style="font-size:24px;margin:8px 0">THE FIRST LEG</h3><strong>${f[2]}</strong><p style="font-size:9px;color:var(--muted);line-height:1.5">The return fixture arrives with a month of new form, new pressure and new data behind it.</p></div><div class="prior"><div class="ey">TABLE PRESSURE</div><h3 style="font-size:24px;margin:8px 0">${Math.abs(A[5]-B[5])} POINTS APART</h3><strong>#${A[4]} vs #${B[4]}</strong><p style="font-size:9px;color:var(--muted);line-height:1.5">${A[6]}–${A[7]} goals for/against · ${B[6]}–${B[7]} goals for/against</p></div></div><div class="nav-match"><a class="btn dark" href="${prev}">← ${i>0?'PREVIOUS MATCH':'DIVISION'}</a><span class="counter">MATCH ${i+1} / 5</span><a class="btn" href="${next}">${i<4?'NEXT MATCH →':'BACK TO DIVISION →'}</a></div></div></section>`}
if(view==='division'&&D[d])division(d);else if(view==='match'&&F[d]&&F[d][mi])match(d,mi);else home();
</script></body></html>
