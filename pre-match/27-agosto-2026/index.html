</style></head><body><div id="app"></div><script src="data-loader.js"></script><script>
const T=RTH14.T,D=RTH14.D,F=RTH14.F,N=RTH14.NAMES;const app=document.getElementById('app');const qs=new URLSearchParams(location.search),view=qs.get('view')||'home',d=+qs.get('d')||1,mi=+qs.get('m')||0;const base='index.html';
const ST={81:"Atleti Azzurri d'Italia",82:'Oreste Granillo',83:'Agia Sophia Stadium',84:'Stadion Dresden',85:'Grünwalder Stadion',86:'Renzo Barbera',87:'Estádio Cidade de Coimbra',88:'Stadio Olimpico di Torino',89:'Ennio Tardini',90:'Stadion FK Partizan',91:'Şükrü Saracoğlu Stadium',101:'Mestalla',111:'Signal Iduna Park',121:'Luigi Ferraris',122:"Renato Dall'Ara",123:'Deutsche Bank Park',124:'De Kuip',125:'Fritz-Walter-Stadion',126:'Luigi Ferraris',127:'La Bombonera',128:'Stadium of Light',129:'Allianz Parque',130:'Veltins Arena',131:'Stadio Diego Armando Maradona',132:'Olimpiysky NSC',133:'Wanda Metropolitano',134:'Tottenham Hotspur Stadium',135:'Celtic Park',136:'Tianhe Stadium',137:'Morumbi',138:'Vélodrome',139:'Stadion Wojska Polskiego',142:'Olimpiysky NSC',143:'Stadio Nuovo Romagnol',144:'Estadio Monumental',145:'Maracanã',146:'Estadio Azteca',148:'Stadio Olimpico',149:'Stadio Olimpico',150:'Olympiastadion'};
const REC={81:[13,8,1,4],82:[13,6,0,7],83:[13,7,3,3],84:[13,7,3,3],85:[13,5,5,3],86:[13,5,3,5],87:[13,4,1,8],88:[13,6,4,3],89:[13,2,4,7],90:[13,2,2,9],91:[13,6,5,2],101:[13,9,1,3],111:[13,9,2,2],121:[13,9,2,2],122:[13,6,5,2],123:[13,6,4,3],124:[13,4,2,7],125:[13,3,6,4],126:[13,4,3,6],127:[13,5,3,5],128:[13,1,6,6],129:[13,2,2,9],130:[13,4,2,7],131:[13,5,5,3],132:[13,6,2,5],133:[13,6,4,3],134:[13,5,2,6],135:[13,5,6,2],136:[13,2,5,6],137:[13,2,4,7],138:[13,4,3,6],139:[13,7,2,4],142:[13,6,5,2],143:[13,2,3,8],144:[13,3,1,9],145:[13,1,4,8],146:[0,0,0,0],148:[13,6,5,2],149:[13,9,1,3],150:[13,6,1,6]};
function head(){return `<div class="wrap top"><div class="brand"><img src="https://www.italianmastersclub.it/assets/imc-logo.png" onerror="this.style.display='none'"><div><b>ROAD TO HISTORY</b><small>SEASON 1 · GW001</small></div></div><div class="date">27 AUG 2026<small>MATCHDAY 14 · 20:00</small></div></div>`}
function linkDiv(x){return `${base}?view=division&d=${x}`}function linkMatch(x,i){return `${base}?view=match&d=${x}&m=${i}`}
function pills(s){return `<div class="form">${[...s].map(c=>`<span class="${c}">${c}</span>`).join('')}</div>`}
function big(x){let best=0,score=-1;F[x].forEach((f,i)=>{let a=T[f[0]],b=T[f[1]],s=30-Math.abs(a[4]-b[4])*3-Math.abs(a[5]-b[5]);if(s>score){score=s;best=i}});return best}
function home(){let leaders=[1,2,3,4].map(x=>T[D[x][0]]);app.innerHTML=`<section class="landing">${head()}<div class="wrap landing-in"><div class="ey" style="color:#82b5ff">RTH · PRE MATCH</div><h1>MATCHDAY<br><span>14.</span></h1><p>20 matches. 40 clubs. Four divisions. Tonight the numbers stop being history and start becoming pressure.</p></div></section><section class="section ice"><div class="wrap"><div class="ey">CHOOSE YOUR SHOW</div><h2>FOUR DIVISIONS.<br>FOUR STORIES.</h2><div class="div-grid">${leaders.map((z,i)=>`<a class="div-card" href="${linkDiv(i+1)}"><img src="${z[2]}"><h3>${N[i+1]}</h3><p>Leader: ${z[1]} · ${z[5]} PT</p></a>`).join('')}</div></div></section>`}
function division(x){app.innerHTML=`<section class="section dark">${head()}<div class="wrap"><div class="ey" style="color:#82b5ff">DIVISION ${x}</div><h2>${N[x]}</h2><p class="copy">Five matches. One table. Every point changes the geometry of the night.</p></div></section><section class="section ice"><div class="wrap"><div class="ey">TONIGHT'S FIXTURES</div><h2>FIVE MATCHES.<br>FIVE STORIES.</h2><div class="fixture-list">${F[x].map((f,i)=>{let A=T[f[0]],B=T[f[1]];return `<a class="fixture" href="${linkMatch(x,i)}"><div class="ft"><img src="${A[2]}"><div><b>${A[1]}</b><small>#${A[4]} · ${A[5]} PT</small></div></div><div class="vs">VS</div><div class="ft r"><div><b>${B[1]}</b><small>#${B[4]} · ${B[5]} PT</small></div><img src="${B[2]}"></div><span class="go">→</span></a>`}).join('')}</div><div class="table">${D[x].map((id,i)=>{let z=T[id];return `<div class="tr"><b>${i+1}</b><img src="${z[2]}"><b>${z[1]}</b><span class="mut">${z[6]} GF</span><span class="mut">${z[7]} GA</span><span class="pts">${z[5]}</span></div>`}).join('')}</div></div></section>`}
function metric(label,A,B,idx){let av=+A[idx],bv=+B[idx],mx=Math.max(av,bv,1);return `<div class="metric"><div class="metric-label"><span>${label}</span><span>${label}</span></div><div class="metric-row"><b>${av}</b><div class="rail"><i style="width:${av/mx*50}%"></i><em style="width:${bv/mx*50}%"></em></div><b>${bv}</b></div></div>`}
function star(z){return `<div class="star"><div class="photo"><img src="${z[18]}"></div><div class="txt"><div class="ey">PLAYER TO WATCH</div><h3>${z[12]}</h3><div class="starline"><div><b>${z[13]}</b><small>AVG</small></div><div><b>${z[14]}</b><small>G</small></div><div><b>${z[15]}</b><small>A</small></div><div><b>${z[16]}</b><small>MVP</small></div></div></div></div>`}
function mgrBox(id,z){let r=REC[id]||[0,0,0,0],wr=r[0]?Math.round(r[1]/r[0]*100):0;let fresh=id===146;return `<div class="boss"><small>${z[1]}</small><strong>${z[3]}</strong>${fresh?`<div class="record">NEW</div><div class="wr">APPOINTED 25 AUG</div>`:`<div class="record">${r[1]}-${r[2]}-${r[3]}</div><div class="wr">${r[0]} PG · ${wr}% WIN RATE</div>`}</div>`}
function storyText(A,B){let gap=Math.abs(A[5]-B[5]),lead=A[5]>B[5]?A:B,chase=A[5]>B[5]?B:A,def=A[7]<B[7]?A:B,attack=A[6]>B[6]?A:B;return `${lead[1]} arrive ${gap?`with a ${gap}-point edge`:'level on points'}, but the shape of the game is more complicated than the table. ${attack[1]} have produced the stronger scoring output, while ${def[1]} own the tighter defensive record. This is where form, control and pressure finally collide.`}
function mgrStory(A,B,aid,bid){let ra=REC[aid],rb=REC[bid];if(aid===146||bid===146)return `<b>NEW DUGOUT ENERGY.</b> One bench has changed hands only days before kickoff. That makes the tactical read less predictable and the historical numbers less reliable.`;let wa=Math.round(ra[1]/ra[0]*100),wb=Math.round(rb[1]/rb[0]*100);let better=wa>=wb?A:B,worse=wa>=wb?B:A;return `<b>${better[3].toUpperCase()} HOLDS THE NUMBERS.</b> A ${Math.max(wa,wb)}% league win rate gives the statistical edge, but ${worse[3]} enters with a different route to the result. The first leg already proved that this matchup can ignore the table.`}
function verdict(A,B){let aScore=A[5]+A[6]-A[7]+A[13],bScore=B[5]+B[6]-B[7]+B[13],edge=aScore>=bScore?A:B,warn=aScore>=bScore?B:A;return `<div class="verdict"><div><b>THE EDGE</b><span>${edge[1]} · stronger combined table + output profile.</span></div><div><b>THE WARNING</b><span>${warn[1]} · enough quality to flip the script.</span></div></div>`}
function match(x,i){let f=F[x][i],aid=f[0],bid=f[1],A=T[aid],B=T[bid],prev=i?linkMatch(x,i-1):linkDiv(x),next=i<4?linkMatch(x,i+1):linkDiv(x);app.innerHTML=`<section class="match-hero">${head()}<div class="wrap match-in"><div class="match-meta">${N[x]} · MATCH ${i+1}/5 · KICK-OFF 20:00</div><div class="stadium">${ST[aid]||'ROAD TO HISTORY ARENA'}</div><div class="duel"><div class="team"><img src="${A[2]}"><h1>${A[1]}</h1><small>#${A[4]} · ${A[5]} POINTS</small></div><div class="duel-vs">VS</div><div class="team"><img src="${B[2]}"><h1>${B[1]}</h1><small>#${B[4]} · ${B[5]} POINTS</small></div></div></div></section><div class="story-wrap"><div class="wrap"><div class="story"><div class="ey">MATCH STORY</div><h2>${f[3]}</h2><p>${storyText(A,B)}</p><div class="story-kpis"><div><b>${Math.abs(A[5]-B[5])}</b><small>POINT GAP</small></div><div><b>${A[6]+B[6]}</b><small>COMBINED GF</small></div><div><b>${A[7]+B[7]}</b><small>COMBINED GA</small></div></div></div></div></div><section class="section ice"><div class="wrap"><div class="ey">MOMENTUM</div><h2>THE LAST FIVE.</h2><div class="momentum"><div class="moment"><div class="moment-top"><img src="${A[2]}"><b>${A[1]}</b></div>${pills(A[11])}</div><div class="moment"><div class="moment-top"><img src="${B[2]}"><b>${B[1]}</b></div>${pills(B[11])}</div></div></div></section><section class="section dark"><div class="wrap"><div class="battle"><div class="ey" style="color:#80b2ff">3D MATCH INTELLIGENCE</div><h2>THE BATTLE MAP.</h2><div class="battle-head"><img src="${A[2]}"><div class="orb"><b>WHO<br>OWNS<br>THE NIGHT?</b></div><img src="${B[2]}"></div>${metric('POSSESSION %',A,B,8)}${metric('SHOTS / MATCH',A,B,9)}${metric('SHOTS ON TARGET',A,B,10)}${metric('GOALS SCORED',A,B,6)}${metric('GOALS CONCEDED',B,A,7)}</div></div></section><section class="section ice"><div class="wrap"><div class="ey">STAR POWER</div><h2>PLAYERS WHO CAN<br>BREAK THE SCRIPT.</h2><div class="stars">${star(A)}${star(B)}</div></div></section><section class="section dark"><div class="wrap"><div class="dugout"><div class="ey" style="color:#80b2ff">THE DUGOUT</div><h2>THE MEN BEHIND<br>THE NUMBERS.</h2><div class="bosses">${mgrBox(aid,A)}<div class="duel-vs" style="align-self:center">VS</div>${mgrBox(bid,B)}</div><div class="mgr-story">${mgrStory(A,B,aid,bid)}</div></div></div></section><section class="section white"><div class="wrap"><div class="duo"><div class="card"><div class="ey">LAST TIME OUT</div><h3>THE FIRST LEG.</h3><div class="first-leg">${f[2]}</div><p class="copy">The return fixture arrives with thirteen league matches of evidence behind it. Same clubs, very different pressure.</p></div><div class="card"><div class="ey">TABLE PRESSURE</div><h3>${Math.abs(A[5]-B[5])} POINTS APART.</h3><p class="copy">#${A[4]} ${A[1]} · #${B[4]} ${B[1]}. One result can redraw the hierarchy.</p></div></div></div></section><section class="section ice"><div class="wrap"><div class="question"><div class="ey" style="color:#80b2ff">THE DATA QUESTION</div><h2>${f[4]}</h2><p>Possession, volume, finishing and momentum do not point in exactly the same direction. That is what makes this one worth watching.</p>${verdict(A,B)}</div><div class="nav"><a class="btn dark" href="${prev}">← ${i?'PREVIOUS MATCH':'DIVISION'}</a><a class="btn" href="${next}">${i<4?'NEXT MATCH →':'BACK TO DIVISION →'}</a></div><div class="credit">Stadium atmosphere image: Zaki / Unsplash · Match data: IMC Nexus</div></div></section>`}
if(view==='division'&&D[d])division(d);else if(view==='match'&&F[d]&&F[d][mi])match(d,mi);else home();
</script></body></html>
