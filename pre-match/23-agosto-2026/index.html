<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RTH Pre Match · MD13</title><style>:root{--g:#d6ad52;--bg:#05080d;--c:#0b1119;--l:#202a37;--m:#8994a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid #202733;position:sticky;top:0;background:#05080df2;z-index:5}header img{width:48px;height:48px;object-fit:contain}.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:11px;letter-spacing:.14em}.brand small,.date small{display:block;color:var(--m);font-size:8px}.date{text-align:right;font-size:10px}main{max-width:520px;margin:auto}.page{min-height:calc(100vh - 70px);padding:20px 16px 32px}.cover{display:flex;flex-direction:column;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 22%,#d6ad5222,transparent 38%)}.cover h1{font-size:52px;line-height:.86;margin:12px 0;letter-spacing:-.06em}.gold,.ey{color:var(--g)}.ey{font-size:9px;letter-spacing:.2em;font-weight:900}.new{margin:20px 0;border:1px solid #d6ad5266;border-radius:22px;padding:18px;background:linear-gradient(135deg,#d6ad521c,#0b1119)}.new h2{margin:4px 0 12px;font-size:27px}.chips,.metrics,.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip,.metric,.player{padding:10px;border:1px solid #ffffff12;border-radius:13px;background:#ffffff06}.chip{font-size:9px;text-align:left}.chip b{display:block;color:var(--g);font-size:13px;margin-top:3px}.cta,.navbtn,.backbtn{border:0;border-radius:999px;padding:13px 18px;background:var(--g);font-weight:900;color:#07101a}.section h2{font-size:34px;margin:6px 0}.divs,.matches{display:grid;gap:10px;margin-top:15px}.divbtn{display:block;width:100%;border:1px solid var(--l);background:var(--c);color:#f7f8fb;border-radius:18px;padding:15px;text-align:left;-webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer}.divbtn:active{transform:scale(.99);border-color:var(--g)}.divbtn h3{margin:4px 0;font-size:21px}.muted{color:var(--m);font-size:9px}.fixture{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;text-align:center;gap:7px}.team img{width:62px;height:62px;object-fit:contain}.team b{display:block;font-size:10px;margin-top:5px}.vs{font-weight:900}.rank{font-size:8px;color:var(--m)}.metrics{grid-template-columns:repeat(3,1fr);margin-top:13px}.metric{text-align:center}.metric small,.player small{font-size:7px;color:var(--m);display:block}.metric b{font-size:13px}.players{margin-top:12px}.player b{display:block;font-size:11px}.nav{display:flex;justify-content:space-between;margin-top:16px}.nav button{font-size:9px}.table{margin-top:12px}.row{display:grid;grid-template-columns:24px 1fr 35px 35px 38px;gap:4px;padding:8px;border-bottom:1px solid #ffffff0d;align-items:center;font-size:9px}.row:first-child{background:#d6ad5212}.row b:last-child{text-align:right}</style></head><body><header><div class="brand"><img src="/nexus/assets/imc-logo.png"><div><b>ROAD TO HISTORY</b><small>PRE MATCH · MATCHDAY 13</small></div></div><div class="date"><b>23 AUG 2026</b><small>KICK-OFF 20:00</small></div></header><main id="app"></main><script>window.RTH={T:{},D:{},F:{}};</script><script src="d1.js?v=3"></script><script src="d2.js?v=3"></script><script src="d3.js?v=3"></script><script src="d4.js?v=3"></script><script>const{T,D,F}=RTH,A=document.getElementById('app');let s={p:'cover'};function go(x){s=x;render();window.scrollTo(0,0)}function rk(d,id){return D[d].indexOf(id)+1}function cover(){return `<section class="page cover"><div class="ey">RTH · MATCHDAY 13</div><h1>PRE MATCH<br><span class="gold">DATA ERA</span></h1><div class="new"><div class="ey">NEW · POWERED BY NEXUS MATCH REPORTS</div><h2>NON SOLO CLASSIFICA.<br>ORA LEGGIAMO LA PARTITA.</h2><div class="chips"><div class="chip">CONTROL<b>POSSESSO</b></div><div class="chip">THREAT<b>TIRI + SOT</b></div><div class="chip">FORM<b>ULTIME 5</b></div><div class="chip">STAR POWER<b>VOTI · GOL · MVP</b></div></div></div><p class="muted">20 PARTITE · 40 SQUADRE · DUE PAGINE PER OGNI MATCH</p><button class="cta" data-action="divs">ENTRA NEL PRE MATCH →</button></section>`}function divs(){return `<section class="page section"><div class="ey">CHOOSE YOUR SHOW</div><h2>4 DIVISIONS.<br>40 STORIES.</h2><div class="divs">${[1,2,3,4].map(d=>`<button type="button" class="divbtn" data-action="table" data-d="${d}"><span class="muted">DIVISION ${d}</span><h3>${['','PLATINUM','GOLD','SILVER','BRONZE'][d]}</h3><b>${T[D[d][0]][0]} · ${T[D[d][0]][1]} PT</b></button>`).join('')}</div></section>`}function table(d){return `<section class="page section"><button class="backbtn" data-action="divs">←</button><div class="ey">DIVISION ${d}</div><h2>THE TABLE</h2><p class="muted">DOPO MATCHDAY 12</p><div class="table">${D[d].map((id,i)=>{let t=T[id];return `<div class="row"><b>${i+1}</b><span>${t[0]}</span><span>${t[2]} GF</span><span>${t[3]} GS</span><b>${t[1]}</b></div>`}).join('')}</div><div class="nav"><button class="navbtn" data-action="divs">DIVISIONI</button><button class="navbtn" data-action="match" data-d="${d}" data-i="0" data-room="0">MATCH 1 →</button></div></section>`}function match(d,i,room){let[a,b]=F[d][i],x=T[a],y=T[b];if(!room)return `<section class="page section"><div class="ey">DIVISION ${d} · MATCH ${i+1}/5 · THE MATCH</div><div class="fixture" style="margin-top:28px"><div class="team"><img src="${x[8]}"><b>${x[0]}</b><span class="rank">#${rk(d,a)} · ${x[1]} PT</span></div><div class="vs">VS</div><div class="team"><img src="${y[8]}"><b>${y[0]}</b><span class="rank">#${rk(d,b)} · ${y[1]} PT</span></div></div><div class="new"><div class="ey">WHY THIS MATCH MATTERS</div><h2>${Math.abs(x[1]-y[1])<=3?'POINTS ARE CLOSE. THE MARGINS ARE NOT.':'ONE NIGHT CAN CHANGE THE TABLE.'}</h2><p class="muted">FORMA: ${x[4]} · ${y[4]}</p></div><div class="nav"><button class="navbtn" data-action="table" data-d="${d}">CLASSIFICA</button><button class="navbtn" data-action="match" data-d="${d}" data-i="${i}" data-room="1">DATA ROOM →</button></div></section>`;return `<section class="page section"><div class="ey">DIVISION ${d} · MATCH ${i+1}/5 · DATA ROOM</div><h2>${x[0]}<br><span class="gold">vs</span> ${y[0]}</h2><div class="metrics"><div class="metric"><small>POSSESSO MEDIO</small><b>${x[5]}% · ${y[5]}%</b></div><div class="metric"><small>TIRI / MATCH</small><b>${x[6]} · ${y[6]}</b></div><div class="metric"><small>IN PORTA / MATCH</small><b>${x[7]} · ${y[7]}</b></div><div class="metric"><small>GOL FATTI</small><b>${x[2]} · ${y[2]}</b></div><div class="metric"><small>GOL SUBITI</small><b>${x[3]} · ${y[3]}</b></div><div class="metric"><small>POINTS GAP</small><b>${Math.abs(x[1]-y[1])}</b></div></div><div class="players"><div class="player"><small>PLAYER TO WATCH</small><b>${x[9]}</b><span class="muted">${x[0]}</span></div><div class="player"><small>PLAYER TO WATCH</small><b>${y[9]}</b><span class="muted">${y[0]}</span></div></div><div class="new"><div class="ey">THE DATA QUESTION</div><h2>${x[6]>y[6]?x[0]:y[0]} PRODUCE PIÙ VOLUME. BASTERÀ?</h2></div><div class="nav"><button class="navbtn" data-action="match" data-d="${d}" data-i="${i}" data-room="0">← THE MATCH</button><button class="navbtn" data-action="${i<4?'match':'divs'}" ${i<4?`data-d="${d}" data-i="${i+1}" data-room="0"`:''}>${i<4?'NEXT MATCH →':'DIVISIONI →'}</button></div></section>`}A.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const a=b.dataset.action;if(a==='divs')return go({p:'divs'});if(a==='table')return go({p:'table',d:Number(b.dataset.d)});if(a==='match')return go({p:'match',d:Number(b.dataset.d),i:Number(b.dataset.i),room:Number(b.dataset.room)});});function render(){A.innerHTML=s.p==='cover'?cover():s.p==='divs'?divs():s.p==='table'?table(s.d):match(s.d,s.i,s.room)}render();</script></body></html>
