<style>
:root{--navy:#082b63;--blue:#1762ad;--gold:#d7ad48;--ink:#0b1b3f;--muted:#718096;--line:#dfe5ed;--bg:#f6f8fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}[hidden]{display:none!important}.screen{min-height:100svh}.login{display:grid;place-items:center;padding:28px}.login-wrap{width:min(100%,420px)}.brand{text-align:center}.brand img{width:72px}.brand h1{color:var(--navy)}.card{padding:22px;border:1px solid var(--line);border-radius:22px;background:#fff}.field{display:grid;gap:7px;margin-bottom:14px}.field input{height:52px;border:1px solid var(--line);border-radius:13px;padding:0 14px}.primary{width:100%;height:52px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:900}.status{min-height:18px}.accountbar{display:flex;justify-content:flex-end;gap:12px;padding:8px 14px;background:#fff}.user{text-align:right}.user strong,.user span{display:block}.logout{border:0;background:transparent;color:var(--blue);font-weight:900}.main{max-width:860px;margin:auto;padding:16px 14px 40px}
#nexusSplash{position:fixed;z-index:99999;inset:0;min-height:100svh;overflow:hidden;background:#fbfdff;color:#082b63;display:flex;align-items:center;justify-content:center;padding:max(44px,env(safe-area-inset-top)) 24px max(34px,env(safe-area-inset-bottom));transition:opacity .45s ease,visibility .45s ease}#nexusSplash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(50,112,190,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(50,112,190,.055) 1px,transparent 1px);background-size:48px 48px}.splash-ring{position:absolute;width:min(118vw,660px);aspect-ratio:1;border-radius:50%;border:68px solid rgba(52,117,205,.055);box-shadow:0 0 0 58px rgba(52,117,205,.035),inset 0 0 70px rgba(52,117,205,.035)}.splash-content{position:relative;width:min(100%,430px);text-align:center;display:flex;flex-direction:column;align-items:center}.splash-title{margin:0;font-size:clamp(48px,14vw,66px);line-height:.95;letter-spacing:-3px;font-weight:900;color:#082b63}.splash-tag{margin:22px 0 0;font-size:12px;font-weight:800;letter-spacing:2.5px;color:#5f7089;white-space:nowrap}.splash-powered{margin-top:82px;font-size:13px;font-weight:900;letter-spacing:4px}.splash-logo{width:70px;height:auto;margin-top:22px;filter:drop-shadow(0 8px 10px rgba(8,43,99,.15))}.splash-progress{width:100%;height:10px;margin-top:100px;border:1px solid #cbd8e8;border-radius:999px;background:rgba(255,255,255,.82);padding:2px;overflow:hidden}.splash-progress>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#0c3471,#208cff,#55c8ff);animation:nexusLoad 1.8s ease-out forwards}.splash-status{margin-top:24px;font-size:13px;font-weight:900;letter-spacing:4px;color:#62748d}.splash-version{position:absolute;bottom:max(6px,env(safe-area-inset-bottom));font-size:10px;letter-spacing:3px;font-weight:800;color:#75859b}@keyframes nexusLoad{0%{width:0}70%{width:72%}100%{width:100%}}@media(max-width:390px){.splash-tag{font-size:10px;letter-spacing:1.8px}.splash-powered{margin-top:68px}.splash-progress{margin-top:80px}}
</style>
</head>
<body>
<section id="nexusSplash" aria-label="Nexus loading"><div class="splash-grid"></div><div class="splash-ring"></div><div class="splash-content"><h1 class="splash-title">NEXUS</h1><p class="splash-tag">EVERY WORLD · EVERY MATCH · EVERY MANAGER</p><div class="splash-powered">POWERED BY</div><img class="splash-logo" src="assets/imc-logo.png" alt="IMC"><div class="splash-progress"><i></i></div><div class="splash-status">CONNECTING TO NEXUS</div></div><div class="splash-version">BUILD 1.0</div></section>
<section id="loginView" class="screen login"><div class="login-wrap"><div class="brand"><img src="assets/imc-logo.png" alt="IMC"><h1>NEXUS</h1><p>BUILD 1.0</p></div><form id="loginForm" class="card"><div class="field"><label>USERNAME</label><input id="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" required></div><button class="primary">ACCEDI</button><div id="status" class="status"></div></form></div></section>
<section id="appView" class="screen" hidden><div id="navigationHost"></div><div class="accountbar"><div class="user"><strong id="userName"></strong><span id="managerId"></span></div><button id="logout" class="logout">ESCI</button></div><main class="main"><div id="moduleHost"></div><div id="worldArea" hidden></div></main></section>
<script>window.addEventListener('load',()=>setTimeout(()=>document.getElementById('nexusSplash')?.classList.add('hide'),1900));</script>
