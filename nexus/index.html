<style>:root{--navy:#082b63;--blue:#1762ad;--gold:#d7ad48;--ink:#0b1b3f;--muted:#718096;--line:#dfe5ed;--bg:#f6f8fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}[hidden]{display:none!important}.screen{min-height:100svh}.login{display:grid;place-items:center;padding:28px}.login-wrap{width:min(100%,420px)}.brand{text-align:center}.brand img{width:72px}.brand h1{color:var(--navy)}.card{padding:22px;border:1px solid var(--line);border-radius:22px;background:#fff}.field{display:grid;gap:7px;margin-bottom:14px}.field input{height:52px;border:1px solid var(--line);border-radius:13px;padding:0 14px}.primary{width:100%;height:52px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:900}.status{min-height:18px}.accountbar{display:flex;justify-content:flex-end;gap:12px;padding:8px 14px;background:#fff}.user{text-align:right}.user strong,.user span{display:block}.logout{border:0;background:transparent;color:var(--blue);font-weight:900}.main{max-width:860px;margin:auto;padding:16px 14px 40px}</style>
