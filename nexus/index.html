<style>
:root{--navy:#082b63;--blue:#1762ad;--gold:#d7ad48;--ink:#0b1b3f;--muted:#718096;--line:#dfe5ed;--bg:#f6f8fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}[hidden]{display:none!important}.screen{min-height:100svh}.accountbar{display:flex;justify-content:flex-end;gap:12px;padding:8px 14px;background:#fff}.user{text-align:right}.user strong,.user span{display:block}.logout{border:0;background:transparent;color:var(--blue);font-weight:900}.main{max-width:860px;margin:auto;padding:16px 14px 40px}
#nexusSplash{position:fixed;z-index:99999;inset:0;width:100vw;height:100svh;overflow:hidden;background:#fbfdff;color:#082b63;transition:opacity .45s ease,visibility .45s ease}#nexusSplash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-grid,.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(50,112,190,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(50,112,190,.05) 1px,transparent 1px);background-size:49px 49px}.splash-ring,.login-ring{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:104vw;aspect-ratio:1;border-radius:50%;border:44px solid rgba(52,117,205,.045);box-shadow:0 0 0 48px rgba(52,117,205,.028),inset 0 0 62px rgba(52,117,205,.025)}.splash-content{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:calc(100vw - 44px);max-width:410px;text-align:center;display:flex;flex-direction:column;align-items:center}.splash-title,.login-title{margin:0;font-size:58px;line-height:.96;letter-spacing:-2.8px;font-weight:900;color:#082b63}.splash-tag,.login-tag{width:100%;margin:22px 0 0;font-size:10px;line-height:1.35;font-weight:800;letter-spacing:1.85px;color:#5f7089;white-space:normal;text-align:center}.splash-powered,.login-powered{margin-top:72px;font-size:12px;font-weight:900;letter-spacing:4px}.splash-logo,.login-logo{width:62px;height:auto;margin-top:21px;filter:drop-shadow(0 7px 9px rgba(8,43,99,.14))}.splash-progress{width:100%;height:9px;margin-top:90px;border:1px solid #cbd8e8;border-radius:999px;background:rgba(255,255,255,.88);padding:2px;overflow:hidden}.splash-progress>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#0c3471,#208cff,#55c8ff);animation:nexusLoad 1.8s ease-out forwards}.splash-status{margin-top:24px;font-size:12px;font-weight:900;letter-spacing:3.5px;color:#62748d;white-space:nowrap}.splash-version,.login-version{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);font-size:10px;letter-spacing:3px;font-weight:800;color:#75859b;white-space:nowrap}@keyframes nexusLoad{0%{width:0}70%{width:72%}100%{width:100%}}
.login{position:relative;width:100vw;height:100svh;overflow:hidden;background:#fbfdff;padding:0}.login-ring{top:47%;width:106vw}.login-wrap{position:absolute;z-index:2;left:50%;top:48%;transform:translate(-50%,-50%);width:calc(100vw - 44px);max-width:410px;text-align:center}.login-title{font-size:52px}.login-tag{margin-top:15px}.login-powered{margin-top:34px}.login-logo{width:52px;margin-top:16px}.login-form{margin-top:44px;padding:0;background:transparent;border:0}.field{margin-bottom:14px;text-align:left}.field label{display:block;margin:0 0 8px 4px;font-size:11px;font-weight:900;letter-spacing:1.8px;color:#5e718b}.field input{width:100%;height:58px;border:1px solid #cad7e7;border-radius:18px;padding:0 18px;background:rgba(255,255,255,.8);color:#0b1b3f;outline:none;box-shadow:0 8px 28px rgba(8,43,99,.035);font-size:16px}.field input:focus{border-color:#1f73cf;box-shadow:0 0 0 3px rgba(31,115,207,.08)}.remember{display:flex;align-items:center;gap:10px;margin:4px 2px 18px;color:#40536e;font-size:12px;font-weight:800;letter-spacing:.5px;text-align:left}.remember input{width:18px;height:18px;accent-color:var(--navy)}.primary{width:100%;height:58px;border:0;border-radius:18px;background:#082b63;color:#fff;font-weight:900;letter-spacing:1.8px;box-shadow:0 12px 28px rgba(8,43,99,.16)}.status{min-height:20px;margin-top:12px;font-size:12px;font-weight:700;color:#5e718b}.status.error{color:#b23b3b}
@media (max-width:430px) and (min-height:800px){.splash-content{top:48.5%;width:calc(100vw - 48px)}.splash-title{font-size:56px}.splash-tag{font-size:9.6px;letter-spacing:1.6px}.splash-powered{margin-top:66px}.splash-progress{margin-top:84px}.splash-status{font-size:11.5px;letter-spacing:3.1px}.login-wrap{top:47.5%;width:calc(100vw - 48px)}.login-title{font-size:50px}.login-powered{margin-top:30px}.login-logo{width:50px}.login-form{margin-top:38px}.field input,.primary{height:56px}}
</style>

<body>
<section id="nexusSplash" aria-label="Nexus loading"><div class="splash-grid"></div><div class="splash-ring"></div><div class="splash-content"><h1 class="splash-title">NEXUS</h1><p class="splash-tag">EVERY WORLD · EVERY MATCH · EVERY MANAGER</p><div class="splash-powered">POWERED BY</div><img class="splash-logo" src="assets/imc-logo.png" alt="IMC"><div class="splash-progress"><i></i></div><div class="splash-status">CONNECTING TO NEXUS</div></div><div class="splash-version">BUILD 1.0</div></section>
<section id="loginView" class="screen login"><div class="login-grid"></div><div class="login-ring"></div><div class="login-wrap"><h1 class="login-title">NEXUS</h1><p class="login-tag">EVERY WORLD · EVERY MATCH · EVERY MANAGER</p><div class="login-powered">POWERED BY</div><img class="login-logo" src="assets/imc-logo.png" alt="IMC"><form id="loginForm" class="login-form"><div class="field"><label>USERNAME</label><input id="username" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><label class="remember"><input id="rememberAccess" type="checkbox" checked><span>RICORDA ACCESSO</span></label><button class="primary">ACCEDI</button><div id="status" class="status"></div></form></div><div class="login-version">BUILD 1.0</div></section>
<section id="appView" class="screen" hidden><div id="navigationHost"></div><div class="accountbar"><div class="user"><strong id="userName"></strong><span id="managerId"></span></div><button id="logout" class="logout">ESCI</button></div><main class="main"><div id="moduleHost"></div><div id="worldArea" hidden></div></main></section>
