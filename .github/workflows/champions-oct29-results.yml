name: Import champions October 29 results and next fixtures
on:
  push:
    branches: [main]
    paths: ['.github/workflows/champions-oct29-results.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import results and verify standings
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          token=secrets.token_hex(32)
          name='imc-db-inspect-'+secrets.token_hex(16)+'.php'
          php="<?php if(time()>EXPIRES||!hash_equals('TOKENHASH',hash('sha256',$_SERVER['HTTP_X_IMC_INSPECT']??''))){http_response_code(404);exit;} @unlink(__FILE__);require __DIR__.'/core/bootstrap.php';\ntry{$c=nexus_config();$p=nexus_db($c,nexus_target($c,'GW001'));$p->beginTransaction();$key='GW001_IMC_CHAMPIONS_LEAGUE';\n$teams=[];foreach(nexus_rows($p,'SELECT * FROM GW001_IMC_Schedule WHERE competition_key=? AND imc_season=2',[$key]) as $r)foreach(['home','away'] as $side)$teams[$r[$side.'_name']]=$r[$side.'_sm_team_id'];\n$teams['FC Porto']=null;$teams['Newcastle United']=null;\n$results=[['FC Porto','Atlético Madrid',0,3],['Valencia CF','Celtic',0,0],['Borussia Dortmund','Torino',4,1],['Bologna FC','Sampdoria',2,0],['SS Lazio','Newcastle United',3,0],['Legia Warszawa','Dynamo Dresden',0,1]];\nforeach($results as [$h,$a,$hs,$as]){\n$args=['GW001',2,$key,'2026-10-29',$h,$a];$where='game_world_id=? AND imc_season=? AND competition_key=? AND match_date=? AND home_name=? AND away_name=?';\n$existing=nexus_rows($p,'SELECT * FROM GW001_IMC_Results WHERE '.$where.' FOR UPDATE',$args);if(count($existing)>1)throw new RuntimeException('duplicate_result');\nif($existing){if((int)$existing[0]['home_score']!==$hs||(int)$existing[0]['away_score']!==$as)throw new RuntimeException('existing_score_conflict');continue;}\n$s=nexus_rows($p,'SELECT * FROM GW001_IMC_Schedule WHERE '.$where,$args);if(count($s)!==1)throw new RuntimeException('missing_or_duplicate_schedule');$s=$s[0];\n$q=$p->prepare(\"INSERT INTO GW001_IMC_Results (game_world_id,imc_season,competition_key,sm_fixture_id,sm_action,competition_group,competition_round,match_date,home_sm_club_id,home_name,away_sm_club_id,away_name,home_score,away_score,result_status,fingerprint,imported_at) VALUES ('GW001',2,?,?,'imc_custom','IMC','2','2026-10-29',?,?,?,?,?,?,?,?,NOW())\");\n$q->execute([$key,$s['sm_fixture_id'],$teams[$h],$h,$teams[$a],$a,$hs,$as,(in_array($h,['FC Porto','Newcastle United'],true)||in_array($a,['FC Porto','Newcastle United'],true))?'AWARDED':'FINISHED',hash('sha256',implode('|',$args))]);\n}\n$pairs=[['Valencia CF','FC Porto'],['Borussia Dortmund','Atlético Madrid'],['Bologna FC','Celtic'],['SS Lazio','Torino'],['Legia Warszawa','Sampdoria'],['Newcastle United','Dynamo Dresden']];\nforeach($pairs as [$h,$a]){\n$args=['GW001',2,$key,'2026-10-30',$h,$a];$where='game_world_id=? AND imc_season=? AND competition_key=? AND match_date=? AND home_name=? AND away_name=?';\n$rows=nexus_rows($p,'SELECT * FROM GW001_IMC_Schedule WHERE '.$where.' FOR UPDATE',$args);if(count($rows)>1)throw new RuntimeException('duplicate_schedule');\nif(!$rows){$q=$p->prepare(\"INSERT INTO GW001_IMC_Schedule (sm_fixture_id,game_world_id,imc_season,competition_key,sm_action,competition_group,competition_round,match_date,match_time,home_sm_team_id,home_name,away_sm_team_id,away_name,fingerprint) VALUES (?,'GW001',2,?,'imc_custom','IMC','3','2026-10-30','20:00',?,?,?,?,?)\");$q->execute([900000000000000+hexdec(substr(hash('sha256',implode('|',$args)),0,12)),$key,$teams[$h],$h,$teams[$a],$a,hash('sha256',implode('|',$args))]);}\n}$p->commit();nexus_out(['ok'=>true]);}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();nexus_out(['ok'=>false,'error'=>$e->getMessage()]);}"
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok'),result
              print(json.dumps(result,indent=2))
          finally:
              try: f.delete(name)
              except error_perm: pass
              assert name not in [x.rsplit('/',1)[-1] for x in f.nlst()], 'Temporary diagnostic cleanup failed'
              print('TEMPORARY_DIAGNOSTIC_REMOVED')
              f.quit()
          
          base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_CHAMPIONS_LEAGUE'
          def get(mode):return json.load(urllib.request.urlopen(base+'&mode='+mode,timeout=30))
          r=get('results')['rows'];s=get('schedule')['rows'];t=get('standings')['rows']
          assert len(r)==12 and len({x['sm_fixture_id'] for x in r})==12
          assert len(s)==6 and all(x['match_date']=='2026-10-30' and x['home_score'] is None for x in s)
          assert len(t)==12 and all(x['played']==2 for x in t)
          assert sum(x['points'] for x in t)==33
          for name in ['FC Porto','Newcastle United']:
              team=next(x for x in t if x['team_name']==name)
              assert team['points']==0 and team['ga']==6
          assert len([x for x in r if x['awarded']])==4
          expected=[["FC Porto","Atlético Madrid",0,3],["Valencia CF","Celtic",0,0],["Borussia Dortmund","Torino",4,1],["Bologna FC","Sampdoria",2,0],["SS Lazio","Newcastle United",3,0],["Legia Warszawa","Dynamo Dresden",0,1]]
          for h,a,hs,aws in expected:
              matches=[x for x in r if x['match_date']=='2026-10-29' and x['home_name']==h and x['away_name']==a]
              assert len(matches)==1 and matches[0]['home_score']==hs and matches[0]['away_score']==aws,(h,a)
          print('PASS Champions: 12 unique results, six future fixtures, standings and guest forfeits verified')
          PY
