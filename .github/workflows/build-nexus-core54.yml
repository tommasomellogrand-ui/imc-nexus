name: Build Nexus Core 54

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-nexus-core54.yml'

permissions:
  contents: write

concurrency:
  group: nexus-core54-builder
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[core54-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Generate repository-only Core 54
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          core53_path = Path('nexus/js/app-core-53.js')
          core54_path = Path('nexus/js/app-core-54.js')
          app_path = Path('nexus/js/app.js')
          index_path = Path('nexus/index.html')

          core = core53_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing marker: {label}')
              return text.replace(old, new, 1)

          def remove_between(text, start, end, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'Missing start marker: {label}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'Missing end marker: {label}')
              return text[:a] + text[b:]

          core = replace_once(core, 'const NEXUS_BUILD = "53";', 'const NEXUS_BUILD = "54";', 'core build label')

          client_pattern = re.compile(
              r'state\.client=window\.supabase\.createClient\(\s*state\.config\.url,\s*state\.config\.key\s*\);'
          )
          core, client_count = client_pattern.subn(
              'state.client=window.supabase.createClient(\n        state.config.url,\n        state.config.key\n      );\n      window.__IMC_NEXUS_CLIENT__=state.client;',
              core,
              count=1,
          )
          if client_count != 1:
              raise SystemExit('Unable to expose Nexus authenticated client')

          core = core.replace('${isGlobalAdmin ? matchdayControlShell() : ""}', '')
          core = core.replace('    bindMatchdayControl();\n', '')
          core = remove_between(
              core,
              '  // BUILD 42 · Admin Import Center · Matchday Control deterministico e verificabile.',
              '  function configuredSeasonOptions(worldId){',
              'Matchday Control block',
          )
          core = core.replace('if(state.adminMode&&state.adminPage==="import"&&document.getElementById("matchdayControl")){loadMatchdayControl();}', '')

          division_anchor = '''  async function loadDivisionData(){\n    if(!state.selectedDivision) return;\n\n    const target=document.getElementById("divisionContent");\n    if(!target||!state.client)return;\n'''
          division_replacement = division_anchor + '''    if(state.divisionTab==="results"||state.divisionTab==="schedule"){\n      target.innerHTML='<div class="nx-loading">Caricamento dati…</div>';\n      return;\n    }\n'''
          core = replace_once(core, division_anchor, division_replacement, 'division repository gate')

          competition_anchor = '''  async function loadCompetitionData(){\n    if(!state.selectedCompetition)return;\n\n    const target=document.getElementById("competitionContent");\n    if(!target||!state.client)return;\n'''
          competition_replacement = competition_anchor + '''    if(state.competitionTab==="results"||state.competitionTab==="schedule"){\n      target.innerHTML='<div class="nx-loading">Caricamento dati…</div>';\n      return;\n    }\n'''
          core = replace_once(core, competition_anchor, competition_replacement, 'competition repository gate')

          core = remove_between(
              core,
              '  // Build 32 · Global registry rendering for every league division with official matchdays.',
              '  function renderStandings(matches,divisionRules){',
              'legacy division Results/Schedule renderers',
          )

          registry_start = '      // Build 32 · Global matchday registry. The official calendar skeleton comes'
          registry_end = '    }catch(error){'
          core = remove_between(core, registry_start, registry_end, 'loadDivisionData matchday registry')

          forbidden = [
              'gw_season_matchdays',
              'renderMatchdayRegistryResults',
              'renderMatchdayRegistrySchedule',
              'matchdayControlShell',
              'loadMatchdayControl',
              'function renderResults(matches)',
              'function renderSchedule(matches)',
          ]
          for token in forbidden:
              if token in core:
                  raise SystemExit(f'Forbidden legacy token remains in Core 54: {token}')
          if 'const NEXUS_BUILD = "54";' not in core:
              raise SystemExit('Core 54 build label missing')
          if 'window.__IMC_NEXUS_CLIENT__=state.client;' not in core:
              raise SystemExit('Core 54 Nexus client export missing')

          core54_path.write_text(core, encoding='utf-8')

          app = app_path.read_text(encoding='utf-8')
          app = app.replace('js/app-core-53.js?v=53.0-core', 'js/app-core-54.js?v=54.0-core')
          app = re.sub(r'^\s*(?:writeScript|appendScript)\("js/imc-no-matchdays\.js\?v=[^"]+"[^\n]*\n', '', app, flags=re.MULTILINE)
          app = app.replace('js/imc-repository-results-schedule.js?v=1.0.0', 'js/imc-repository-results-schedule.js?v=1.0.1')
          if 'app-core-53.js' in app or 'imc-no-matchdays.js' in app:
              raise SystemExit('Legacy Core 53 / Matchday shim still referenced by app.js')
          if 'app-core-54.js?v=54.0-core' not in app:
              raise SystemExit('Core 54 bootstrap missing')
          app_path.write_text(app, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'js/app\.js\?v=54\.[^"<]+', 'js/app.js?v=54.1', index)
          index_path.write_text(index, encoding='utf-8')
          PY

          node --check nexus/js/app-core-54.js
          node --check nexus/js/app.js
          grep -Fq 'const NEXUS_BUILD = "54";' nexus/js/app-core-54.js
          grep -Fq 'window.__IMC_NEXUS_CLIENT__=state.client;' nexus/js/app-core-54.js
          ! grep -Fq 'gw_season_matchdays' nexus/js/app-core-54.js
          ! grep -Fq 'renderMatchdayRegistry' nexus/js/app-core-54.js
          ! grep -Fq 'matchdayControlShell' nexus/js/app-core-54.js
          grep -Fq 'js/app-core-54.js?v=54.0-core' nexus/js/app.js
          ! grep -Fq 'js/app-core-53.js' nexus/js/app.js
          ! grep -Fq 'imc-no-matchdays.js' nexus/js/app.js
          grep -Fq 'js/app.js?v=54.1' nexus/index.html

      - name: Persist Core 54
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nexus/js/app-core-54.js nexus/js/app.js nexus/index.html
          if git diff --cached --quiet; then
            echo 'CORE54_ALREADY_GENERATED=YES'
            exit 0
          fi
          git commit -m '[core54-generated] build: generate repository-only Nexus Core 54'
          git push origin HEAD:main
