name: Deploy Pre Match to Aruba

on:
  push:
    branches:
      - main
    paths:
      - 'pre-match/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-match-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Deploy Pre Match with verified FTPS
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm

          host = os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user = os.environ['ARUBA_FTP_USERNAME']
          password = os.environ['ARUBA_FTP_PASSWORD']
          raw = os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain = host[4:] if host.startswith('ftp.') else host

          if raw.endswith('/nexus'):
              target_raw = raw[:-len('/nexus')] + '/pre-match'
          else:
              raise SystemExit(f'ARUBA_FTP_REMOTE_DIR must end in /nexus, got: {raw}')

          remote_root = target_raw if target_raw.startswith('/www.') else f'/www.{domain}{target_raw}'
          local_root = Path('pre-match')
          files = [p for p in local_root.rglob('*') if p.is_file()]
          if not files:
              raise SystemExit('No pre-match files to deploy')

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ftp = FTP_TLS(context=ctx)
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)
          ftp.prot_p()

          def ensure_dir(path):
              parts = [x for x in path.split('/') if x]
              ftp.cwd('/')
              current = ''
              for part in parts:
                  current += '/' + part
                  try:
                      ftp.cwd(current)
                  except error_perm:
                      ftp.mkd(current)
                      ftp.cwd(current)

          for local in files:
              rel = local.relative_to(local_root).as_posix()
              parent = str(Path(rel).parent).replace('\\','/')
              remote_dir = remote_root if parent == '.' else remote_root + '/' + parent
              ensure_dir(remote_dir)
              data = local.read_bytes()
              with local.open('rb') as fh:
                  ftp.storbinary(f'STOR {local.name}', fh, blocksize=65536)
              buf = io.BytesIO()
              ftp.retrbinary(f'RETR {local.name}', buf.write, blocksize=65536)
              if buf.getvalue() != data:
                  raise SystemExit(f'FTPS read-back mismatch for {rel}')
              print(f'UPLOAD_MATCH=YES {rel} {len(data)} bytes')

          ftp.quit()
          PY

      - name: Public smoke test Matchday 14
        run: |
          set -euo pipefail
          test -s pre-match/27-agosto-2026/index.html
          test -s pre-match/27-agosto-2026/data.js
          test -s pre-match/27-agosto-2026/tsv-1860.svg
          BASE="https://www.italianmastersclub.it/pre-match/27-agosto-2026"
          TOKEN="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' "$BASE/index.html?deploy_verify=$TOKEN" -o /tmp/pre-match-public.html
          grep -Fq 'MATCHDAY 14' /tmp/pre-match-public.html
          grep -Fq '20 MATCHES. 40 CLUBS.' /tmp/pre-match-public.html
          grep -Fq '27 AUG 2026' /tmp/pre-match-public.html
          grep -Fq 'POWERED BY NEXUS DATA' /tmp/pre-match-public.html

          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' "$BASE/tsv-1860.svg?deploy_verify=$TOKEN" -o /tmp/1860.svg
          grep -Fq 'viewBox="0 0 512 512"' /tmp/1860.svg

          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' "$BASE/data.js?v=1&deploy_verify=$TOKEN" -o /tmp/data-loader.js
          grep -Fq "tsv-1860.svg" /tmp/data-loader.js
          echo 'PRE_MATCH_MD14_PUBLIC_SMOKE=YES'

      - name: Write verified deploy receipt
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          cat > deploy-status/pre-match.json <<EOF
          {
            "status": "verified",
            "source_sha": "${GITHUB_SHA}",
            "url": "https://www.italianmastersclub.it/pre-match/27-agosto-2026/index.html",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status/pre-match.json
          git commit -m "Record verified Pre Match Aruba deploy ${GITHUB_SHA}" || exit 0
          git push
