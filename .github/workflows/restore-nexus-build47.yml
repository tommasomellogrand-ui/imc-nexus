name: Restore Nexus Build 47
on:
  push:
    paths: ['.github/workflows/restore-nexus-build47.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last working Nexus snapshot
        run: |
          set -euo pipefail
          git show 30904cc56d8adc8e615fcbc94a0faa28b2379811:nexus/js/app.js > nexus/js/app.js
          git show 30904cc56d8adc8e615fcbc94a0faa28b2379811:nexus/index.html > nexus/index.html
          node --check nexus/js/app.js
          git diff --check
      - name: Commit restore
        run: |
          git config user.name "IMC Nexus Builder"
          git config user.email "actions@users.noreply.github.com"
          git add nexus/js/app.js nexus/index.html
          git commit -m "hotfix: restore Nexus Build 47"
          git push origin HEAD:main
