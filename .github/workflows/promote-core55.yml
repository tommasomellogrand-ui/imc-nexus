name: Promote Nexus Core 55

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-core55.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Promote core 55
        run: |
          set -euo pipefail
          cp nexus/js/app-core-54.js nexus/js/app-core-55.js
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('nexus/js/app-core-55.js')
          core = core_path.read_text(encoding='utf-8')
          old = 'const NEXUS_BUILD = "54";'
          if core.count(old) != 1:
              raise SystemExit(f'Unexpected core build marker count: {core.count(old)}')
          core_path.write_text(core.replace(old, 'const NEXUS_BUILD = "55";', 1), encoding='utf-8')

          app_path = Path('nexus/js/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_ref = 'js/app-core-54.js?v=54.0-core'
          if app.count(old_ref) != 2:
              raise SystemExit(f'Unexpected app core ref count: {app.count(old_ref)}')
          app_path.write_text(app.replace(old_ref, 'js/app-core-55.js?v=55.0-core'), encoding='utf-8')
          PY

          node --check nexus/js/app-core-55.js
          node --check nexus/js/app.js
          grep -Fq 'const NEXUS_BUILD = "55";' nexus/js/app-core-55.js
          grep -Fq 'js/app-core-55.js?v=55.0-core' nexus/js/app.js

      - name: Commit core 55
        run: |
          set -euo pipefail
          git config user.name 'tommasomellogrand-ui'
          git config user.email 'tommaso.mello.grand@gmail.com'
          git add nexus/js/app-core-55.js nexus/js/app.js
          git commit -m 'Nexus Build 55: activate core 55'
          git push origin HEAD:main
