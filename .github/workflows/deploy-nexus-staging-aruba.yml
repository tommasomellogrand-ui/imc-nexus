# staging workflow registered on main; deploys staging only
name: Deploy Nexus Staging to Aruba

on:
  push:
    branches: [staging]
    paths:
      - 'nexus/**'
      - '.github/workflows/deploy-nexus-staging-aruba.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Build isolated staging snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexus-test
          cp -a nexus /tmp/nexus-test
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/nexus-test')
          exts={'.html','.js','.css','.json','.txt','.md','.svg'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts: continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              old=s
              s=s.replace('/nexus/','/nexus-test/').replace('/nexus"','/nexus-test"').replace("/nexus'","/nexus-test'")
              if p.name=='index.html':
                  s=s.replace('<title>IMC Nexus ·','<title>IMC Nexus TEST ·',1)
                  badge='''<style id="nexusStagingBadgeStyle">body::before{content:"NEXUS TEST";position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2147483647;padding:6px 12px;border-radius:999px;background:#b42318;color:#fff;font:900 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;box-shadow:0 4px 14px rgba(0,0,0,.22);pointer-events:none}</style>'''
                  s=s.replace('</head>',badge+'</head>',1)
              if s!=old: p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '<base href="/nexus-test/">' /tmp/nexus-test/index.html
          grep -Fq 'content:"NEXUS TEST"' /tmp/nexus-test/index.html
          grep -Fq 'const NEXUS_ROUTE_BASE = "/nexus-test";' /tmp/nexus-test/js/app-core-53.js
          node --check /tmp/nexus-test/js/app.js
          node --check /tmp/nexus-test/js/app-core-53.js
          touch /tmp/staging-build-ok

      - name: Install FTPS client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          touch /tmp/staging-ftps-ok

      - name: Deploy only to Aruba nexus-test
        shell: bash
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          HOST="${ARUBA_FTP_HOST#ftp://}"; HOST="${HOST#ftps://}"; DOMAIN="${HOST#ftp.}"; PROD="${ARUBA_FTP_REMOTE_DIR%/}"
          [[ "$PROD" == /www.* ]] || PROD="/www.$DOMAIN$PROD"
          if [[ "$PROD" == */nexus ]]; then TEST="${PROD%/nexus}/nexus-test"; else TEST="${PROD}-test"; fi
          lftp -c "set cmd:fail-exit yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname no; open -u \"$ARUBA_FTP_USERNAME\",\"$ARUBA_FTP_PASSWORD\" ftp://$HOST; mirror -R --delete --parallel=4 --no-perms /tmp/nexus-test \"$TEST\"; bye;"
          touch /tmp/staging-deploy-ok

      - name: Verify public staging
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.italianmastersclub.it/nexus-test'; T="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/index.html?v=$T" -o /tmp/test-index.html; touch /tmp/v-index
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/js/app.js?v=$T" -o /tmp/test-app.js; touch /tmp/v-app
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/js/app-core-53.js?v=$T" -o /tmp/test-core.js; touch /tmp/v-core
          grep -Fq '<base href="/nexus-test/">' /tmp/test-index.html; touch /tmp/v-base
          grep -Fq 'content:"NEXUS TEST"' /tmp/test-index.html; touch /tmp/v-badge
          grep -Fq 'const NEXUS_ROUTE_BASE = "/nexus-test";' /tmp/test-core.js; touch /tmp/v-route
          node --check /tmp/test-app.js; touch /tmp/v-appjs
          node --check /tmp/test-core.js; touch /tmp/v-corejs
          touch /tmp/staging-verify-ok

      - name: Publish staging status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          yn(){ [ -f "$1" ] && printf YES || printf NO; }
          printf 'NEXUS_STAGING_STATUS\nSTATUS=%s\nBUILD=%s\nFTPS=%s\nDEPLOY=%s\nVERIFY=%s\nINDEX_HTTP=%s\nAPP_HTTP=%s\nCORE_HTTP=%s\nBASE=%s\nBADGE=%s\nROUTE=%s\nAPP_JS=%s\nCORE_JS=%s\nURL=https://www.italianmastersclub.it/nexus-test/\nRUN_SHA=%s\nUPDATED_AT=%s\n' "${{ job.status }}" "$(yn /tmp/staging-build-ok)" "$(yn /tmp/staging-ftps-ok)" "$(yn /tmp/staging-deploy-ok)" "$(yn /tmp/staging-verify-ok)" "$(yn /tmp/v-index)" "$(yn /tmp/v-app)" "$(yn /tmp/v-core)" "$(yn /tmp/v-base)" "$(yn /tmp/v-badge)" "$(yn /tmp/v-route)" "$(yn /tmp/v-appjs)" "$(yn /tmp/v-corejs)" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > nexus-staging-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-staging-status.txt
          git commit -m '[staging] Nexus test diagnostics ${{ job.status }}' || exit 0
          git push origin HEAD:staging
