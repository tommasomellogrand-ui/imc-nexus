name: Normalize four RTH competitions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-four-rth-competitions.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Count database objects without changing data
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          import pathlib,subprocess
          src="<?php\ndeclare(strict_types=1);\nrequire dirname(__DIR__).'/core/bootstrap.php';\nrequire __DIR__.'/custom-cups.php';\ntry{\n  $c=nexus_config();$gw=nexus_world($_GET['world']??'');$season=nexus_season($_GET['season']??null);$core=nexus_db($c,'core');\n  $seasons=nexus_rows($core,'SELECT imc_season,imc_season_start_date,imc_season_end_date FROM `IMC Game World Season` WHERE game_world_id=? ORDER BY imc_season',[$gw]);\n  if($season===null){\n    $today=(new DateTimeImmutable('now',new DateTimeZone('Europe/Rome')))->format('Y-m-d');$latest=null;\n    foreach($seasons as $s){if($s['imc_season_start_date']&&$s['imc_season_start_date']<=$today){$latest=(int)$s['imc_season'];if(!$s['imc_season_end_date']||$s['imc_season_end_date']>=$today)$season=(int)$s['imc_season'];}}\n    $season=$season??$latest;\n  }\n  if($season===null||!in_array($season,array_map(fn($s)=>(int)$s['imc_season'],$seasons),true))throw new InvalidArgumentException('invalid_world_season');\n  $db=nexus_db($c,nexus_target($c,$gw));$rt=nexus_table($gw,'Results');$st=nexus_table($gw,'Schedule');\n  $columns='competition_key,sm_action,sm_country,sm_division,competition_group';\n  $sql='SELECT competition_key,MAX(sm_action) sm_action,MAX(sm_country) sm_country,MAX(sm_division) sm_division,MAX(competition_group) competition_group,SUM(result_count) result_count,SUM(schedule_count) schedule_count FROM ('\n    .'SELECT '.$columns.',1 result_count,0 schedule_count FROM `'.$rt.'` WHERE game_world_id=? AND imc_season=? UNION ALL '\n    .'SELECT '.$columns.',0 result_count,1 schedule_count FROM `'.$st.'` WHERE game_world_id=? AND imc_season=?'\n    .') matches_by_season GROUP BY competition_key';\n  $rows=nexus_rows($db,$sql,[$gw,$season,$gw,$season]);\n  $labels=[];foreach(nexus_rows($core,'SELECT competition_key,nexus_view FROM `IMC Competition Nexus Mapping` WHERE game_world_id=?',[$gw]) as $m)$labels[(string)$m['competition_key']]=$m['nexus_view'];\n  $names=['charityshield'=>'Charity Shield','leaguecup'=>'National Cup','nationalcup'=>'National Cup','leagueshield'=>'League Cup','smfacup'=>'SMFA Champions','smfashield'=>'SMFA Shield','supercup'=>'SMFA Super Cup','interqualifier'=>'World Cup Qualifiers','worldcup'=>'World Cup'];\n  $order=['league'=>0,'playoff'=>1,'charityshield'=>2,'leaguecup'=>3,'nationalcup'=>3,'leagueshield'=>4,'smfacup'=>5,'smfashield'=>6,'supercup'=>7,'interqualifier'=>8,'worldcup'=>9];\n  foreach($rows as &$r){\n    $key=(string)$r['competition_key'];$parts=explode('|',$key);$groupIndex=null;foreach($parts as $i=>$part)if(in_array($part,['DOMESTIC','INTERNATIONAL','NATIONS'],true)){$groupIndex=$i;break;}\n    $action=strtolower(trim((string)$r['sm_action']));$group=$groupIndex!==null?$parts[$groupIndex]:strtoupper((string)$r['competition_group']);\n    $country=$groupIndex===2?$parts[1]:null;$division=in_array($action,['league','playoff'],true)?($groupIndex!==null?($parts[$groupIndex+2]??$r['sm_division']):$r['sm_division']):null;\n    $fallback=in_array($action,['league','playoff'],true)?'Div '.$division.($action==='playoff'?' Playoff':''):($names[$action]??$action);\n    $r['game_world_id']=$gw;$r['imc_season']=$season;$r['world_type']=$country?'MULTI':'SINGLE';$r['sm_country']=$country;$r['sm_action']=$action;$r['competition_group']=$group;$r['sm_division']=$division;\n    $r['nexus_view']=$labels[$key]??(($country?$country.' ':'').$fallback);$r['result_count']=(int)$r['result_count'];$r['schedule_count']=(int)$r['schedule_count'];\n  }unset($r);\n  foreach(nexus_custom_cups($gw,$season) as $cup){\n    $found=false;\n    foreach($rows as &$r)if($r['competition_key']===$cup['competition_key']){\n      $r=array_merge($r,array_diff_key($cup,['groups'=>true]));$found=true;break;\n    }unset($r);\n    if(!$found)$rows[]=array_merge(array_diff_key($cup,['groups'=>true]),['result_count'=>0,'schedule_count'=>0]);\n  }\n  if($gw==='GW001'&&$season===2){\n    $namesIMC=['GW001_IMC_CHAMPIONS_LEAGUE'=>'RTH Champions League','GW001_IMC_EUROPA_LEAGUE'=>'RTH Europa League','GW001_IMC_CONFERENCE_LEAGUE'=>'RTH Conference League','GW001_IMC_CLUB_WORLD_CUP'=>'RTH Club World Cup'];\n    $native=[];foreach($rows as $r)if(isset($namesIMC[$r['competition_key']]))$native[$r['competition_key']]=$r;\n    $rows=array_values(array_filter($rows,fn($r)=>strtoupper((string)$r['competition_group'])!=='IMC'&&!str_starts_with((string)$r['competition_key'],'GW001_IMC_')));\n    $i=0;foreach($namesIMC as $key=>$label){\n      $r=$native[$key]??['result_count'=>0,'schedule_count'=>0];\n      $rows[]=array_merge($r,['competition_key'=>$key,'nexus_view'=>$label,'sm_action'=>'imc_custom','competition_group'=>'IMC','game_world_id'=>$gw,'imc_season'=>$season,'world_type'=>'SINGLE','sm_country'=>null,'sm_division'=>null,'imc_order'=>$i++]);\n    }\n  }\n  usort($rows,fn($a,$b)=>[($order[$a['sm_action']]??99),$a['sm_country']??'',(int)$a['sm_division'],$a['competition_key']]<=>[($order[$b['sm_action']]??99),$b['sm_country']??'',(int)$b['sm_division'],$b['competition_key']]);\n  nexus_out(['ok'=>true,'game_world_id'=>$gw,'season'=>$season,'rows'=>$rows]);\n}catch(InvalidArgumentException $e){nexus_out(['ok'=>false,'error'=>$e->getMessage()],422);}catch(Throwable $e){nexus_out(['ok'=>false,'error'=>'competition_catalog_error'],500);}\n\n"
          b=io.BytesIO();f.retrbinary('RETR competitions/catalog.php',b.write);before=b.getvalue()
          assert before.decode()=="<?php\ndeclare(strict_types=1);\nrequire dirname(__DIR__).'/core/bootstrap.php';\nrequire __DIR__.'/custom-cups.php';\ntry{\n  $c=nexus_config();$gw=nexus_world($_GET['world']??'');$season=nexus_season($_GET['season']??null);$core=nexus_db($c,'core');\n  $seasons=nexus_rows($core,'SELECT imc_season,imc_season_start_date,imc_season_end_date FROM `IMC Game World Season` WHERE game_world_id=? ORDER BY imc_season',[$gw]);\n  if($season===null){\n    $today=(new DateTimeImmutable('now',new DateTimeZone('Europe/Rome')))->format('Y-m-d');$latest=null;\n    foreach($seasons as $s){if($s['imc_season_start_date']&&$s['imc_season_start_date']<=$today){$latest=(int)$s['imc_season'];if(!$s['imc_season_end_date']||$s['imc_season_end_date']>=$today)$season=(int)$s['imc_season'];}}\n    $season=$season??$latest;\n  }\n  if($season===null||!in_array($season,array_map(fn($s)=>(int)$s['imc_season'],$seasons),true))throw new InvalidArgumentException('invalid_world_season');\n  $db=nexus_db($c,nexus_target($c,$gw));$rt=nexus_table($gw,'Results');$st=nexus_table($gw,'Schedule');\n  $columns='competition_key,sm_action,sm_country,sm_division,competition_group';\n  $sql='SELECT competition_key,MAX(sm_action) sm_action,MAX(sm_country) sm_country,MAX(sm_division) sm_division,MAX(competition_group) competition_group,SUM(result_count) result_count,SUM(schedule_count) schedule_count FROM ('\n    .'SELECT '.$columns.',1 result_count,0 schedule_count FROM `'.$rt.'` WHERE game_world_id=? AND imc_season=? UNION ALL '\n    .'SELECT '.$columns.',0 result_count,1 schedule_count FROM `'.$st.'` WHERE game_world_id=? AND imc_season=?'\n    .') matches_by_season GROUP BY competition_key';\n  $rows=nexus_rows($db,$sql,[$gw,$season,$gw,$season]);\n  $labels=[];foreach(nexus_rows($core,'SELECT competition_key,nexus_view FROM `IMC Competition Nexus Mapping` WHERE game_world_id=?',[$gw]) as $m)$labels[(string)$m['competition_key']]=$m['nexus_view'];\n  $names=['charityshield'=>'Charity Shield','leaguecup'=>'National Cup','nationalcup'=>'National Cup','leagueshield'=>'League Cup','smfacup'=>'SMFA Champions','smfashield'=>'SMFA Shield','supercup'=>'SMFA Super Cup','interqualifier'=>'World Cup Qualifiers','worldcup'=>'World Cup'];\n  $order=['league'=>0,'playoff'=>1,'charityshield'=>2,'leaguecup'=>3,'nationalcup'=>3,'leagueshield'=>4,'smfacup'=>5,'smfashield'=>6,'supercup'=>7,'interqualifier'=>8,'worldcup'=>9];\n  foreach($rows as &$r){\n    $key=(string)$r['competition_key'];$parts=explode('|',$key);$groupIndex=null;foreach($parts as $i=>$part)if(in_array($part,['DOMESTIC','INTERNATIONAL','NATIONS'],true)){$groupIndex=$i;break;}\n    $action=strtolower(trim((string)$r['sm_action']));$group=$groupIndex!==null?$parts[$groupIndex]:strtoupper((string)$r['competition_group']);\n    $country=$groupIndex===2?$parts[1]:null;$division=in_array($action,['league','playoff'],true)?($groupIndex!==null?($parts[$groupIndex+2]??$r['sm_division']):$r['sm_division']):null;\n    $fallback=in_array($action,['league','playoff'],true)?'Div '.$division.($action==='playoff'?' Playoff':''):($names[$action]??$action);\n    $r['game_world_id']=$gw;$r['imc_season']=$season;$r['world_type']=$country?'MULTI':'SINGLE';$r['sm_country']=$country;$r['sm_action']=$action;$r['competition_group']=$group;$r['sm_division']=$division;\n    $r['nexus_view']=$labels[$key]??(($country?$country.' ':'').$fallback);$r['result_count']=(int)$r['result_count'];$r['schedule_count']=(int)$r['schedule_count'];\n  }unset($r);\n  foreach(nexus_custom_cups($gw,$season) as $cup){\n    $found=false;\n    foreach($rows as &$r)if($r['competition_key']===$cup['competition_key']){\n      $r=array_merge($r,array_diff_key($cup,['groups'=>true]));$found=true;break;\n    }unset($r);\n    if(!$found)$rows[]=array_merge(array_diff_key($cup,['groups'=>true]),['result_count'=>0,'schedule_count'=>0]);\n  }\n  if($gw==='GW001')foreach(json_decode(file_get_contents(__DIR__.'/imc-cups.json'),true,512,JSON_THROW_ON_ERROR) as $cup){\n    if((int)$cup['season']!==$season)continue;\n    $played=count(array_filter($cup['matches'],fn($m)=>is_int($m['homeScore'])&&is_int($m['awayScore'])));\n    $rows[]=['competition_key'=>$cup['key'],'nexus_view'=>$cup['name'],'sm_action'=>'imc_custom','competition_group'=>'IMC','game_world_id'=>$gw,'imc_season'=>$season,'world_type'=>'SINGLE','sm_country'=>null,'sm_division'=>null,'result_count'=>$played,'schedule_count'=>count($cup['matches'])-$played,'imc_order'=>array_search($cup['key'],array_column(json_decode(file_get_contents(__DIR__.'/imc-cups.json'),true),'key'))];\n  }\n  usort($rows,fn($a,$b)=>[($order[$a['sm_action']]??99),$a['sm_country']??'',(int)$a['sm_division'],$a['competition_key']]<=>[($order[$b['sm_action']]??99),$b['sm_country']??'',(int)$b['sm_division'],$b['competition_key']]);\n  nexus_out(['ok'=>true,'game_world_id'=>$gw,'season'=>$season,'rows'=>$rows]);\n}catch(InvalidArgumentException $e){nexus_out(['ok'=>false,'error'=>$e->getMessage()],422);}catch(Throwable $e){nexus_out(['ok'=>false,'error'=>'competition_catalog_error'],500);}\n\n",'Catalog changed'
          pathlib.Path('/tmp/catalog.php').write_text(src);subprocess.run(['php','-l','/tmp/catalog.php'],check=True)
          f.storbinary('STOR competitions/catalog.php.backup-'+os.environ['GITHUB_SHA'][:12],io.BytesIO(before))
          f.storbinary('STOR competitions/catalog.php',io.BytesIO(src.encode()))
          try:
              d=json.load(urllib.request.urlopen('https://www.italianmastersclub.it/nexus/competitions/catalog.php?world=GW001&season=2',timeout=30))
              rows=[r for r in d['rows'] if r['competition_group']=='IMC']
              assert len(rows)==4 and len({r['competition_key'] for r in rows})==4,rows
              assert all(r['nexus_view'].startswith('RTH ') for r in rows)
              assert next(r for r in rows if r['competition_key'].endswith('CLUB_WORLD_CUP'))['result_count']==0
              print('PASS',json.dumps(rows))
          except:
              f.storbinary('STOR competitions/catalog.php',io.BytesIO(before));raise
          finally:f.quit()
          PY
