name: Deploy Nexus Build 1.0 to Aruba

on:
  push:
    branches:
      - main
    paths:
      - 'nexus/**'
      - '.github/workflows/deploy-aruba.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Build 1.0
        shell: bash
        run: |
          set -euo pipefail
          test -s nexus/index.html
          test -s nexus/v1/app.js
          test -s nexus/v1/modules/navigation/navigation.js
          test -s nexus/v1/modules/navigation/navigation.css
          test -s nexus/v1/modules/clubhouse/clubhouse.js
          test -s nexus/v1/modules/clubhouse/clubhouse.css
          grep -Fq 'v1/modules/navigation/navigation.js' nexus/index.html
          grep -Fq 'v1/modules/clubhouse/clubhouse.js' nexus/index.html
          node --check nexus/v1/app.js
          node --check nexus/v1/modules/navigation/navigation.js
          node --check nexus/v1/modules/clubhouse/clubhouse.js

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_FTP_REMOTE_DIR; do test -n "${!name:-}"; done

      - name: Upload Build 1.0 to Aruba
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/'); domain=host[4:] if host.startswith('ftp.') else host
          remote_root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          files=[
            Path('nexus/index.html'),Path('nexus/v1/app.js'),Path('nexus/assets/imc-logo.png'),
            Path('nexus/v1/modules/navigation/navigation.js'),Path('nexus/v1/modules/navigation/navigation.css'),
            Path('nexus/v1/modules/clubhouse/clubhouse.js'),Path('nexus/v1/modules/clubhouse/clubhouse.css')
          ]
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect(host,21,timeout=30); ftp.login(user,password); ftp.prot_p()
          def ensure_abs(path):
              ftp.cwd('/')
              for part in [x for x in path.split('/') if x]:
                  try: ftp.cwd(part)
                  except error_perm:
                      try: ftp.mkd(part)
                      except error_perm: pass
                      ftp.cwd(part)
          for local in files:
              rel=local.as_posix().removeprefix('nexus/'); parent=str(Path(rel).parent).replace('\\','/')
              ensure_abs(remote_root if parent=='.' else f'{remote_root}/{parent}')
              data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary(f'STOR {local.name}',fh,blocksize=65536)
              buf=io.BytesIO(); ftp.retrbinary(f'RETR {local.name}',buf.write,blocksize=65536)
              if buf.getvalue()!=data: raise SystemExit(f'Upload non verificato: {rel}')
              print(f'UPLOAD_OK {rel}')
          ftp.quit()
          PY

      - name: Verifica pubblica
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.italianmastersclub.it/nexus'
          TOKEN="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/index.html?verify=$TOKEN" -o /tmp/index.html
          grep -Fq 'v1/modules/navigation/navigation.js' /tmp/index.html
          grep -Fq 'v1/modules/clubhouse/clubhouse.js' /tmp/index.html
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/v1/modules/navigation/navigation.js?verify=$TOKEN" -o /tmp/navigation.js
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/v1/modules/navigation/navigation.css?verify=$TOKEN" -o /tmp/navigation.css
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/v1/modules/clubhouse/clubhouse.js?verify=$TOKEN" -o /tmp/clubhouse.js
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/v1/modules/clubhouse/clubhouse.css?verify=$TOKEN" -o /tmp/clubhouse.css
          grep -Fq 'window.IMC_NAVIGATION' /tmp/navigation.js
          grep -Fq 'window.IMC_CLUBHOUSE' /tmp/clubhouse.js
          node --check /tmp/navigation.js
          node --check /tmp/clubhouse.js
          test -s /tmp/navigation.css
          test -s /tmp/clubhouse.css
          echo 'NEXUS_MODULES_ONLINE=YES'
