name: Deploy Nexus to Aruba

on:
  push:
    branches:
      - main
    paths:
      - 'nexus/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bootstrap]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight Nexus build
        shell: bash
        run: |
          set -euo pipefail
          test -s nexus/index.html
          test -s nexus/js/app.js
          test -s nexus/js/app-core-56.js
          test -s nexus/js/imc-team-hub-gw008.js
          test -s nexus/js/imc-managers-gw008.js
          grep -Fq '</html>' nexus/index.html
          node --check nexus/js/app.js
          node --check nexus/js/app-core-56.js
          node --check nexus/js/imc-team-hub-gw008.js
          node --check nexus/js/imc-managers-gw008.js
          ! grep -Fq 'gw_season_matchdays' nexus/js/app-core-56.js

          BUILD="$(sed -n 's/.*const NEXUS_BUILD = "\([^"]*\)";.*/\1/p' nexus/js/app.js | head -n1)"
          test "$BUILD" = "56"
          grep -Fq '<title>IMC Nexus · Build 56</title>' nexus/index.html
          grep -Fq 'js/app.js?v=56.1' nexus/index.html
          grep -Fq 'js/app-core-56.js?v=56.0-core' nexus/js/app.js
          grep -Fq 'js/imc-team-hub-gw008.js?v=2.2.0' nexus/js/app.js
          grep -Fq 'js/imc-managers-gw008.js?v=1.5.0' nexus/js/app.js

          echo "PREFLIGHT_BUILD=$BUILD"
          echo "PREFLIGHT_INDEX_SIZE=$(wc -c < nexus/index.html)"
          echo "PREFLIGHT_APP_SIZE=$(wc -c < nexus/js/app.js)"
          echo "PREFLIGHT_CORE56_SIZE=$(wc -c < nexus/js/app-core-56.js)"
          echo "PREFLIGHT_TEAM_HUB_SIZE=$(wc -c < nexus/js/imc-team-hub-gw008.js)"
          echo "PREFLIGHT_MANAGERS_SIZE=$(wc -c < nexus/js/imc-managers-gw008.js)"

      - name: Deploy full Nexus snapshot
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          HOST="${ARUBA_FTP_HOST#ftp://}"
          HOST="${HOST#ftps://}"
          DOMAIN="${HOST#ftp.}"
          RAW_REMOTE="${ARUBA_FTP_REMOTE_DIR%/}"
          if [[ "$RAW_REMOTE" == /www.* ]]; then REMOTE="$RAW_REMOTE"; else REMOTE="/www.$DOMAIN$RAW_REMOTE"; fi
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set net:max-retries 2;
            open -u \"$ARUBA_FTP_USERNAME\",\"$ARUBA_FTP_PASSWORD\" ftp://$HOST;
            mirror -R --verbose --parallel=4 --no-perms \
              --exclude-glob .gitkeep \
              --exclude-glob .env \
              --exclude-glob '.env.*' \
              --exclude-glob '*.pem' \
              --exclude-glob '*.key' \
              --exclude-glob 'index.html' \
              --exclude-glob 'js/app.js' \
              --exclude-glob 'js/app-core-56.js' \
              --exclude-glob 'js/imc-team-hub-gw008.js' \
              --exclude-glob 'js/imc-managers-gw008.js' \
              nexus \"$REMOTE\";
            bye;
          "

      - name: Build minimal changed-file upload list
        if: ${{ github.event_name == 'push' }}
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files nexus > /tmp/nexus-files.txt
          else
            git diff --diff-filter=AMCR --name-only "$BEFORE" "$AFTER" -- nexus/ > /tmp/nexus-files.txt
          fi
          grep -vE '(^|/)\.gitkeep$|(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$' /tmp/nexus-files.txt > /tmp/nexus-upload.txt || true
          echo 'Files selected for deployment:'
          cat /tmp/nexus-upload.txt || true
          if [ -s /tmp/nexus-upload.txt ]; then echo 'has_files=true' >> "$GITHUB_OUTPUT"; else echo 'has_files=false' >> "$GITHUB_OUTPUT"; fi

      - name: Deploy changed non-critical files with verified FTPS
        if: ${{ github.event_name == 'push' && steps.changes.outputs.has_files == 'true' }}
        shell: bash
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm

          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/'); domain=host[4:] if host.startswith('ftp.') else host
          remote_root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          skip={'nexus/index.html','nexus/js/app.js','nexus/js/app-core-56.js','nexus/js/imc-team-hub-gw008.js','nexus/js/imc-managers-gw008.js'}
          changed=[]
          p=Path('/tmp/nexus-upload.txt')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  path=line.strip()
                  if path and path not in skip and Path(path).is_file(): changed.append(Path(path))
          if not changed:
              print('NO_NON_CRITICAL_FILES=YES'); raise SystemExit(0)

          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect(host,21,timeout=30); ftp.login(user,password); ftp.prot_p()
          def ensure_dir(rel):
              ftp.cwd(remote_root)
              if not rel:return
              for part in rel.split('/'):
                  if not part:continue
                  try: ftp.cwd(part)
                  except error_perm:
                      try: ftp.mkd(part)
                      except error_perm as exc:
                          if not str(exc).startswith('550'): raise
                      ftp.cwd(part)
          for local in changed:
              rel=local.as_posix().removeprefix('nexus/'); parent=str(Path(rel).parent).replace('\\','/')
              if parent=='.':parent=''
              ensure_dir(parent); data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary(f'STOR {local.name}',fh,blocksize=65536)
              buf=io.BytesIO(); ftp.retrbinary(f'RETR {local.name}',buf.write,blocksize=65536)
              if buf.getvalue()!=data: raise SystemExit(f'FTPS read-back mismatch for {rel}')
              print(f'UPLOAD_MATCH=YES {rel} {len(data)} bytes')
          ftp.quit()
          PY

      - name: Upload and verify critical runtime files
        shell: bash
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS

          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/'); domain=host[4:] if host.startswith('ftp.') else host
          remote_root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect(host,21,timeout=30); ftp.login(user,password); ftp.prot_p()
          critical=[
              (Path('nexus/js/app-core-56.js'),f'{remote_root}/js','app-core-56.js'),
              (Path('nexus/js/app.js'),f'{remote_root}/js','app.js'),
              (Path('nexus/js/imc-team-hub-gw008.js'),f'{remote_root}/js','imc-team-hub-gw008.js'),
              (Path('nexus/js/imc-managers-gw008.js'),f'{remote_root}/js','imc-managers-gw008.js'),
              (Path('nexus/index.html'),remote_root,'index.html'),
          ]
          for local,remote_dir,remote_name in critical:
              data=local.read_bytes(); ftp.cwd(remote_dir)
              with local.open('rb') as fh: ftp.storbinary(f'STOR {remote_name}',fh,blocksize=65536)
              size=ftp.size(remote_name); buf=io.BytesIO(); ftp.retrbinary(f'RETR {remote_name}',buf.write,blocksize=65536); remote=buf.getvalue()
              print(f'{remote_name}: LOCAL_SHA256={hashlib.sha256(data).hexdigest()}')
              print(f'{remote_name}: REMOTE_SHA256={hashlib.sha256(remote).hexdigest()}')
              if size!=len(data) or remote!=data: raise SystemExit(f'Critical FTPS read-back mismatch for {remote_name}')
              print(f'CRITICAL_MATCH=YES {remote_name}')
          ftp.quit()
          PY

      - name: Public production smoke test
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL='https://www.italianmastersclub.it/nexus'
          TOKEN="${GITHUB_SHA}-$(date +%s)"
          INDEX_URL="$BASE_URL/index.html?deploy_verify=$TOKEN"
          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' "$INDEX_URL" -o /tmp/nexus-public-index.html
          test "$(sha256sum nexus/index.html | awk '{print $1}')" = "$(sha256sum /tmp/nexus-public-index.html | awk '{print $1}')"
          grep -Fq '<title>IMC Nexus · Build 56</title>' /tmp/nexus-public-index.html
          grep -Fq 'js/app.js?v=56.1' /tmp/nexus-public-index.html

          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' "$BASE_URL/js/app.js?v=56.1&deploy_verify=$TOKEN" -o /tmp/nexus-public-app.js
          test "$(sha256sum nexus/js/app.js | awk '{print $1}')" = "$(sha256sum /tmp/nexus-public-app.js | awk '{print $1}')"
          node --check /tmp/nexus-public-app.js
          grep -Fq 'js/app-core-56.js?v=56.0-core' /tmp/nexus-public-app.js
          grep -Fq 'js/imc-team-hub-gw008.js?v=2.2.0' /tmp/nexus-public-app.js
          grep -Fq 'js/imc-managers-gw008.js?v=1.5.0' /tmp/nexus-public-app.js

          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' "$BASE_URL/js/app-core-56.js?v=56.0-core&deploy_verify=$TOKEN" -o /tmp/nexus-public-core56.js
          test "$(sha256sum nexus/js/app-core-56.js | awk '{print $1}')" = "$(sha256sum /tmp/nexus-public-core56.js | awk '{print $1}')"
          node --check /tmp/nexus-public-core56.js

          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' "$BASE_URL/js/imc-team-hub-gw008.js?v=2.2.0&deploy_verify=$TOKEN" -o /tmp/nexus-public-team-hub.js
          test "$(sha256sum nexus/js/imc-team-hub-gw008.js | awk '{print $1}')" = "$(sha256sum /tmp/nexus-public-team-hub.js | awk '{print $1}')"
          node --check /tmp/nexus-public-team-hub.js

          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store, must-revalidate' -H 'Pragma: no-cache' "$BASE_URL/js/imc-managers-gw008.js?v=1.5.0&deploy_verify=$TOKEN" -o /tmp/nexus-public-managers.js
          test "$(sha256sum nexus/js/imc-managers-gw008.js | awk '{print $1}')" = "$(sha256sum /tmp/nexus-public-managers.js | awk '{print $1}')"
          node --check /tmp/nexus-public-managers.js

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "$INDEX_URL" > /tmp/nexus-public-dom.html 2>/tmp/nexus-chrome.log
            grep -Fq 'id="loginForm"' /tmp/nexus-public-dom.html
            echo 'BROWSER_SMOKE=YES'
          fi
          echo 'NEXUS_RELEASE_VERIFIED=BUILD_56'

      - name: Deployment summary
        run: echo 'Nexus Build 56 deployed and verified on public production.'
