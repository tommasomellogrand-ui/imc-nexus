name: Deploy Nexus Build 1.0 to Aruba
on:
  push:
    branches: [main]
    paths: ['nexus/**','.github/workflows/deploy-aruba.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Build 1.0
        shell: bash
        run: |
          set -euo pipefail
          for f in nexus/index.html nexus/v1/app.js nexus/v1/modules/navigation/navigation.js nexus/v1/modules/navigation/navigation.css nexus/v1/modules/clubhouse/clubhouse.js nexus/v1/modules/clubhouse/clubhouse.css nexus/v1/modules/game-world-shell/game-world-shell.js nexus/v1/modules/game-world-shell/game-world-shell.css nexus/v1/modules/team-hub/team-hub.js nexus/v1/modules/team-hub/team-hub.css nexus/v1/modules/managers/managers.js nexus/v1/modules/managers/managers.css; do test -s "$f"; done
          node --check nexus/v1/app.js
          node --check nexus/v1/modules/navigation/navigation.js
          node --check nexus/v1/modules/clubhouse/clubhouse.js
          node --check nexus/v1/modules/game-world-shell/game-world-shell.js
          node --check nexus/v1/modules/team-hub/team-hub.js
          node --check nexus/v1/modules/managers/managers.js
      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          for name in ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_FTP_REMOTE_DIR; do test -n "${!name:-}"; done
      - name: Upload Build 1.0 to Aruba
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io,os,ssl
          from pathlib import Path
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://',''); user=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']; raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/'); domain=host[4:] if host.startswith('ftp.') else host; root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          files=[Path('nexus/index.html'),Path('nexus/v1/app.js'),Path('nexus/assets/imc-logo.png'),Path('nexus/v1/modules/navigation/navigation.js'),Path('nexus/v1/modules/navigation/navigation.css'),Path('nexus/v1/modules/clubhouse/clubhouse.js'),Path('nexus/v1/modules/clubhouse/clubhouse.css'),Path('nexus/v1/modules/game-world-shell/game-world-shell.js'),Path('nexus/v1/modules/game-world-shell/game-world-shell.css'),Path('nexus/v1/modules/team-hub/team-hub.js'),Path('nexus/v1/modules/team-hub/team-hub.css'),Path('nexus/v1/modules/managers/managers.js'),Path('nexus/v1/modules/managers/managers.css')]
          ctx=ssl.create_default_context();ctx.check_hostname=False;ftp=FTP_TLS(context=ctx);ftp.connect(host,21,timeout=30);ftp.login(user,password);ftp.prot_p()
          def ensure(path):
            ftp.cwd('/')
            for p in [x for x in path.split('/') if x]:
              try: ftp.cwd(p)
              except error_perm:
                try: ftp.mkd(p)
                except error_perm: pass
                ftp.cwd(p)
          for local in files:
            rel=local.as_posix().removeprefix('nexus/');parent=str(Path(rel).parent).replace('\\','/');ensure(root if parent=='.' else f'{root}/{parent}');data=local.read_bytes()
            with local.open('rb') as fh: ftp.storbinary(f'STOR {local.name}',fh)
            b=io.BytesIO();ftp.retrbinary(f'RETR {local.name}',b.write)
            if b.getvalue()!=data: raise SystemExit('Upload non verificato '+rel)
          ftp.quit()
          PY
      - name: Verifica pubblica
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.italianmastersclub.it/nexus'; TOKEN="${GITHUB_SHA}-$(date +%s)"
          for f in index.html v1/app.js v1/modules/navigation/navigation.js v1/modules/clubhouse/clubhouse.js v1/modules/game-world-shell/game-world-shell.js v1/modules/team-hub/team-hub.js v1/modules/team-hub/team-hub.css v1/modules/managers/managers.js v1/modules/managers/managers.css; do curl -fsSL -H 'Cache-Control: no-cache, no-store' "$BASE/$f?verify=$TOKEN" -o "/tmp/$(basename $f)"; done
          grep -Fq 'window.IMC_TEAM_HUB' /tmp/team-hub.js
          grep -Fq 'window.IMC_MANAGERS' /tmp/managers.js
          node --check /tmp/team-hub.js
          node --check /tmp/managers.js
          test -s /tmp/team-hub.css
          test -s /tmp/managers.css
          echo 'MANAGERS_ONLINE=YES'
