name: Deploy Nexus Build 1.0 to Aruba

on:
  push:
    branches:
      - main
    paths:
      - 'nexus/**'
      - '.github/workflows/deploy-aruba.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Build 1.0
        shell: bash
        run: |
          set -euo pipefail
          test -s nexus/index.html
          test -s nexus/v1/app.js
          grep -Fq '<title>IMC Nexus · Build 1.0</title>' nexus/index.html
          grep -Fq 'v1/app.js' nexus/index.html
          grep -Fq 'const BUILD="1.0"' nexus/v1/app.js
          node --check nexus/v1/app.js

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_FTP_REMOTE_DIR; do
            test -n "${!name:-}"
          done

      - name: Upload Build 1.0 to Aruba
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm

          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          remote_root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'

          files=[Path('nexus/index.html'),Path('nexus/v1/app.js'),Path('nexus/assets/imc-logo.png')]
          for p in files:
              if not p.is_file():
                  raise SystemExit(f'Missing required file: {p}')

          ctx=ssl.create_default_context()
          ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect(host,21,timeout=30)
          ftp.login(user,password)
          ftp.prot_p()

          def ensure_abs(path):
              parts=[x for x in path.split('/') if x]
              ftp.cwd('/')
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      try: ftp.mkd(part)
                      except error_perm: pass
                      ftp.cwd(part)

          for local in files:
              rel=local.as_posix().removeprefix('nexus/')
              parent=str(Path(rel).parent).replace('\\','/')
              remote_dir=remote_root if parent=='.' else f'{remote_root}/{parent}'
              ensure_abs(remote_dir)
              data=local.read_bytes()
              with local.open('rb') as fh:
                  ftp.storbinary(f'STOR {local.name}',fh,blocksize=65536)
              buf=io.BytesIO()
              ftp.retrbinary(f'RETR {local.name}',buf.write,blocksize=65536)
              remote=buf.getvalue()
              if remote != data:
                  raise SystemExit(f'FTPS read-back mismatch: {rel}')
              print(f'UPLOAD_MATCH=YES {rel} SHA256={hashlib.sha256(data).hexdigest()}')
          ftp.quit()
          PY

      - name: Public smoke test
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.italianmastersclub.it/nexus'
          TOKEN="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store' "$BASE/index.html?verify=$TOKEN" -o /tmp/index.html
          grep -Fq '<title>IMC Nexus · Build 1.0</title>' /tmp/index.html
          grep -Fq 'v1/app.js' /tmp/index.html
          curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache, no-store' "$BASE/v1/app.js?verify=$TOKEN" -o /tmp/app.js
          grep -Fq 'const BUILD="1.0"' /tmp/app.js
          node --check /tmp/app.js
          echo 'NEXUS_BUILD_1_0_ONLINE=YES'
