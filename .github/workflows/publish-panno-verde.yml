name: Publish Il Panno Verde
on:
  push:
    branches: [main]
    paths: ['panno-verde-release/**','.github/workflows/publish-panno-verde.yml']
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check panno-verde-release/site/news-v1.js
          npm install --prefix /tmp/sd-qa playwright@1.56.1
      - name: Publish GW011 presentation
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: python3 panno-verde-release/deploy.py
      - name: Verify public layout and world isolation
        run: NODE_PATH=/tmp/sd-qa/node_modules CHROME_BIN="$(command -v google-chrome)" node panno-verde-release/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panno-verde-layout
          path: /tmp/panno-verde-*.png
