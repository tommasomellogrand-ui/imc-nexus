# Source: https://lnd.it/seried/attivita-interregionale/i-gironi-del-campionato-2026-2027/
# Retrieved 2026-10-24. Names preserved as published; only columns 1, 7, 8 populated.
name: Seed Serie D 2026-27 club mapping
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seed-imc-serie-d-2026-27.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Load 162 clubs with name, competition and group
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          token=secrets.token_hex(32)
          name='imc-db-inspect-'+secrets.token_hex(16)+'.php'
          php='<?php\nini_set(\'display_errors\',\'0\');error_reporting(0);\nif($_SERVER[\'REQUEST_METHOD\']!==\'POST\'||time()>EXPIRES||!hash_equals(\'TOKENHASH\',hash(\'sha256\',$_SERVER[\'HTTP_X_IMC_INSPECT\']??\'\'))){http_response_code(404);exit;}\n@unlink(__FILE__);header(\'Content-Type: application/json\');header(\'Cache-Control: no-store\');\ntry{\n$c=require dirname(__DIR__).\'/__imc_private_gateway/config.php\';$a=$c[\'db\'];\n$p=new PDO(\'mysql:host=\'.$a[\'host\'].\';port=\'.($a[\'port\']??3306).\';dbname=Sql1956795_4;charset=utf8mb4\',$a[\'user\'],$a[\'pass\'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_TIMEOUT=>10]);\nif($p->query(\'SELECT DATABASE()\')->fetchColumn()!==\'Sql1956795_4\')throw new Exception(\'Wrong database\');\nif((int)$p->query("SELECT GET_LOCK(\'imc_manager_club_mapping_seed\',10)")->fetchColumn()!==1)throw new Exception(\'Lock unavailable\');\n$old=[\'nome_ufficiale_club\',\'nazione\',\'citta\',\'anno_fondazione\',\'nome_stadio\',\'capienza_stadio\',\'serie_girone_attuali\'];\n$expected=array_merge(array_slice($old,0,6),[\'serie_attuale\',\'girone\']);\n$cols=$p->query(\'SHOW COLUMNS FROM `IMC Manager Club Mapping`\')->fetchAll(PDO::FETCH_ASSOC);\n$count=(int)$p->query("SELECT COUNT(*) FROM `IMC Manager Club Mapping` WHERE serie_attuale=\'Serie D\'")->fetchColumn();\n\n$cols=$p->query(\'SHOW COLUMNS FROM `IMC Manager Club Mapping`\')->fetchAll(PDO::FETCH_ASSOC);\nif(array_column($cols,\'Field\')!==$expected)throw new Exception(\'Schema mismatch\');\n$rows=json_decode(base64_decode(\'\'),true,512,JSON_THROW_ON_ERROR);\n$p->beginTransaction();\n$before=$p->query("SELECT * FROM `IMC Manager Club Mapping` WHERE serie_attuale<>\'Serie D\' ORDER BY nome_ufficiale_club")->fetchAll(PDO::FETCH_ASSOC);\n$inserted=0;\nif($count===0){\n$check=$p->prepare(\'SELECT COUNT(*) FROM `IMC Manager Club Mapping` WHERE nome_ufficiale_club=?\');\nforeach($rows as $row){$check->execute([$row[0]]);if((int)$check->fetchColumn()>0)throw new Exception(\'Club already exists\');}\n\n$s=$p->prepare(\'INSERT INTO `IMC Manager Club Mapping` (`\'.implode(\'`,`\',$expected).\'`) VALUES (?,?,?,?,?,?,?,?)\');\nforeach($rows as $row){$s->execute($row);$inserted++;}\n}\n$actual=$p->query("SELECT * FROM `IMC Manager Club Mapping` WHERE serie_attuale=\'Serie D\'")->fetchAll(PDO::FETCH_NUM);\n$normalize=function($items){$out=[];foreach($items as $row){$out[]=array_map(function($v){return $v===null?null:(string)$v;},$row);}usort($out,function($a,$b){return strcmp($a[0],$b[0]);});return $out;};\nif($normalize($actual)!==$normalize($rows))throw new Exception(\'Readback mismatch\');\nif($before!==$p->query("SELECT * FROM `IMC Manager Club Mapping` WHERE serie_attuale<>\'Serie D\' ORDER BY nome_ufficiale_club")->fetchAll(PDO::FETCH_ASSOC))throw new Exception(\'Existing rows changed\');\n$groups=$p->query("SELECT girone,COUNT(*) AS n FROM `IMC Manager Club Mapping` WHERE serie_attuale=\'Serie D\' GROUP BY girone ORDER BY girone")->fetchAll(PDO::FETCH_KEY_PAIR);\nif(array_map(\'intval\',$groups)!==array_fill_keys(range(\'A\',\'I\'),18))throw new Exception(\'Group mismatch\');\n$p->commit();\n$actual=$p->query("SELECT * FROM `IMC Manager Club Mapping` WHERE serie_attuale=\'Serie D\' ORDER BY nome_ufficiale_club")->fetchAll(PDO::FETCH_ASSOC);\nif(count($actual)!==162)throw new Exception(\'Final count mismatch\');\n$p->query("SELECT RELEASE_LOCK(\'imc_manager_club_mapping_seed\')");\necho json_encode([\'ok\'=>true,\'database\'=>\'Sql1956795_4\',\'table\'=>\'IMC Manager Club Mapping\',\'season\'=>\'2026/27\',\'columns\'=>$expected,\'inserted\'=>$inserted,\'row_count\'=>count($actual),\'total_rows\'=>(int)$p->query(\'SELECT COUNT(*) FROM `IMC Manager Club Mapping`\')->fetchColumn(),\'groups\'=>$groups,\'records\'=>$actual]);\n}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();http_response_code(500);echo json_encode([\'ok\'=>false,\'error_code\'=>$e->getCode()]);}\n'
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token},data=b'',method='POST')
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok') is True and len(result['columns'])==8 and result['row_count']==162
              print(json.dumps(result,indent=2))
          finally:
              try: f.delete(name)
              except error_perm: pass
              assert name not in [x.rsplit('/',1)[-1] for x in f.nlst()], 'Temporary diagnostic cleanup failed'
              print('TEMPORARY_DIAGNOSTIC_REMOVED')
              f.quit()
          
          PY

