# Sources checked 2026-10-24: tuttoc.com/altre-news/serie-2026-2027-ufficializzata-composizione-gironi-442398
# Wikipedia individual club profiles and 2026-27 Serie C stadium table; official albinoleffe.com and cataniafc.it histories.
# Founding years follow historical sporting continuity; reserve teams use their own formation year.
# Conflicting capacities, uncertain founding years and disputed home grounds remain NULL, per user instructions.
name: Seed Serie C 2026-27 club mapping
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seed-imc-serie-c-2026-27.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Load sixty clubs and verify all eight columns
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
