===null?null:(string)$v;},$row);}usort($out,function($a,$b){return strcmp($a[0],$b[0]);});return $out;};\nif($normalize($actual)!==$normalize($rows))throw new Exception('Readback mismatch');\nif($before!==$p->query(\"SELECT * FROM `IMC Manager Club Mapping` WHERE serie_attuale<>'Serie C' ORDER BY nome_ufficiale_club\")->fetchAll(PDO::FETCH_ASSOC))throw new Exception('Existing rows changed');\n$groups=$p->query(\"SELECT girone,COUNT(*) AS n FROM `IMC Manager Club Mapping` WHERE serie_attuale='Serie C' GROUP BY girone ORDER BY girone\")->fetchAll(PDO::FETCH_KEY_PAIR);\nif(array_map('intval',$groups)!==['A'=>20,'B'=>20,'C'=>20])throw new Exception('Group mismatch');\n$p->commit();\n$actual=$p->query(\"SELECT * FROM `IMC Manager Club Mapping` WHERE serie_attuale='Serie C' ORDER BY nome_ufficiale_club\")->fetchAll(PDO::FETCH_ASSOC);\nif(count($actual)!==60)throw new Exception('Final count mismatch');\n$p->query(\"SELECT RELEASE_LOCK('imc_manager_club_mapping_seed')\");\necho json_encode(['ok'=>true,'database'=>'Sql1956795_4','table'=>'IMC Manager Club Mapping','season'=>'2026/27','columns'=>$expected,'inserted'=>$inserted,'row_count'=>count($actual),'total_rows'=>(int)$p->query('SELECT COUNT(*) FROM `IMC Manager Club Mapping`')->fetchColumn(),'groups'=>$groups,'records'=>$actual]);\n}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();http_response_code(500);echo json_encode(['ok'=>false,'error_code'=>$e->getCode()]);}\n"
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token},data=b'',method='POST')
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok') is True and len(result['columns'])==8 and result['row_count']==60
              print(json.dumps(result,indent=2))
