name: Run Codex Filter Build 51 Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/codex-filter-build51-pr-trigger'
  push:
    branches: [main]
    paths:
      - '.github/codex-filter-build51-trigger'

permissions:
  contents: write

jobs:
  run-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Execute prepared patch workflow steps
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          path=Path('.github/workflows/patch-codex-filter-build51.yml')
          if not path.exists():
              raise SystemExit('Prepared patch workflow not found')

          raw=path.read_text(encoding='utf-8')
          matches=list(re.finditer(r'(?ms)^        run: \|\n(.*?)(?=^      - (?:name|uses):|\Z)',raw))
          if not matches:
              raise SystemExit('No run blocks found in prepared patch')

          for index,match in enumerate(matches,1):
              lines=[]
              for line in match.group(1).splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              script='\n'.join(lines)+'\n'
              print(f'RUN BLOCK {index}/{len(matches)}')
              subprocess.run(script,shell=True,executable='/bin/bash',check=True)
          PY
