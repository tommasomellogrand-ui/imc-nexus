name: Build 56 Team Hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build56-team-hub.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build Nexus 56
        shell: bash
        run: |
          set -euo pipefail

          cp nexus/js/app-core-55.js nexus/js/app-core-56.js
          python3 - <<'PY'
          from pathlib import Path

          core=Path('nexus/js/app-core-56.js')
          text=core.read_text(encoding='utf-8')
          old='const NEXUS_BUILD = "55";'
          if text.count(old)!=1:
              raise SystemExit(f'Expected one core build marker, found {text.count(old)}')
          text=text.replace(old,'const NEXUS_BUILD = "56";',1)
          core.write_text(text,encoding='utf-8')

          app=Path('nexus/js/app.js')
          text=app.read_text(encoding='utf-8')
          if text.count('const NEXUS_BUILD = "55";')!=1:
              raise SystemExit('app.js build marker mismatch')
          text=text.replace('const NEXUS_BUILD = "55";','const NEXUS_BUILD = "56";',1)
          text=text.replace('js/app-core-55.js?v=55.0-core','js/app-core-56.js?v=56.0-core')
          text=text.replace('js/imc-team-hub-gw008.js?v=1.0.4','js/imc-team-hub-gw008.js?v=2.0.0')
          text='\n'.join(line for line in text.split('\n') if 'imc-entities-current-manager-gw008.js' not in line and 'imc-entity-season-results-gw008.js' not in line)
          app.write_text(text,encoding='utf-8')

          index=Path('nexus/index.html')
          text=index.read_text(encoding='utf-8')
          text=text.replace('<title>IMC Nexus · Build 55</title>','<title>IMC Nexus · Build 56</title>',1)
          import re
          text=re.sub(r'js/app\.js\?v=[^"<]+','js/app.js?v=56.0',text,count=1)
          text=re.sub(r'js/imc-world-features\.js\?v=[^"<]+','js/imc-world-features.js?v=1.5',text,count=1)
          index.write_text(text,encoding='utf-8')

          deploy=Path('.github/workflows/deploy-aruba.yml')
          text=deploy.read_text(encoding='utf-8')
          text=text.replace('app-core-55.js','app-core-56.js')
          text=text.replace('55.0-core','56.0-core')
          text=text.replace('js/app.js?v=$BUILD.3','js/app.js?v=$BUILD.0')
          text=text.replace('CORE55','CORE56')
          text=text.replace('core55','core56')
          deploy.write_text(text,encoding='utf-8')
          PY

          cat > nexus/js/imc-team-hub-gw008.js <<'JS'
          (function(){
          "use strict";
          if(window.__IMC_TEAM_HUB_GW008__)return;
          window.__IMC_TEAM_HUB_GW008__=true;

          const VERSION="2.0.0";
          const WORLD="GW008";
          const WORLD_NAME="Gold 1";
          const ROOT_FLAG="imc-team-hub-gw008";
          const STYLE_ID="imcTeamHubGw008Css";
          const RESULT_SELECT="raw_match_id,season_number,sm_fixture_id,source_page_date,home_name,away_name,home_score,away_score,home_penalties,away_penalties,decided_on_penalties,sm_action,sm_round_label,competition_key";
          const SCHEDULE_SELECT="schedule_id,sm_fixture_id,matchday_number,match_date,home_name,away_name,sm_action,sm_round_label,competition_key";
          let cache={clubs:null,nations:null,managers:null};
          const detailCache=new Map();
          let view={tab:"clubs",detail:null};
          let observer=null,timer=null;

          function clean(v){return String(v==null?"":v).replace(/\s+/g," ").trim();}
          function norm(v){return clean(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
          function esc(v){return clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
          function db(){return window.__IMC_NEXUS_CLIENT__||null;}
          function pageRoot(){return document.getElementById("pageRoot");}
          function navButton(section){return document.querySelector(`.nx-world-nav [data-world-section="${section}"]`);}
          function currentWorld(){const nodes=document.querySelectorAll("#openDrawerWorld strong,.nx-sport-world strong,.nx-world-header strong,.nx-world-header p");for(const node of nodes){const t=clean(node.textContent),m=t.match(/GW\d{3}/i);if(m)return m[0].toUpperCase();if(norm(t)===norm(WORLD_NAME))return WORLD;}return"";}
          function hubActive(){const club=navButton("clubs"),nat=navButton("national");return !!((club&&club.classList.contains("active"))||(nat&&nat.classList.contains("active")));}
          function isHubPage(){const r=pageRoot();return !!(r&&r.querySelector(`:scope > [data-imc-team-hub-world="${WORLD}"]`));}
          function worldData(row){return row&&row.worlds&&row.worlds[WORLD]?row.worlds[WORLD]:{};}
          function activeCodex(row){return worldData(row).active===true;}
          function managedCodex(row){return worldData(row).managed===true;}
          function todayIso(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
          function assignmentActive(a,today){const s=clean(a&&a.start_date),e=clean(a&&a.end_date);return (!s||s<=today)&&(!e||e>=today);}
          function formatDate(v){const s=clean(v);if(!s)return"-";const d=new Date(`${s}T12:00:00`);return Number.isNaN(d.getTime())?s:d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});}

          function syncNav(){
            const club=navButton("clubs"),nat=navButton("national"),inWorld=currentWorld()===WORLD;
            if(!club&&!nat)return;
            if(inWorld&&nat&&nat.classList.contains("active")&&club)club.classList.add("active");
            if(club){const span=club.querySelector("span");if(inWorld){if(span)span.textContent="TEAM HUB";club.setAttribute("aria-label","Team Hub");}else if(span&&span.textContent==="TEAM HUB"){span.textContent="CLUBS";club.removeAttribute("aria-label");}}
            if(inWorld&&nat)nat.remove();
          }

          function installStyles(){
            if(document.getElementById(STYLE_ID))return;
            const s=document.createElement("style");s.id=STYLE_ID;s.textContent=`
          #pageRoot:has(> .${ROOT_FLAG}){padding-top:0!important}.`+ROOT_FLAG+`{padding:0 0 30px;color:#0b1b3f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
          .th8-hero{position:relative;width:100%;aspect-ratio:800/203;margin:4px 0 14px;overflow:hidden;border:1px solid rgba(203,160,54,.72);border-radius:17px;background:linear-gradient(104deg,#041833 0%,#08234b 52%,#061a38 100%);box-shadow:0 8px 20px rgba(15,29,58,.09);color:#fff}.th8-hero-copy{position:absolute;left:28px;top:50%;transform:translateY(-50%)}.th8-hero-copy span{display:inline-flex;min-height:17px;align-items:center;padding:0 7px;border:1px solid #d7ad48;border-radius:6px;color:#e9c56d;font-size:7px;font-weight:950;letter-spacing:.08em}.th8-hero-copy strong{display:block;margin-top:7px;font-size:22px;line-height:1;font-weight:950;letter-spacing:-.03em}.th8-hero-copy small{display:block;margin-top:6px;color:#e2b855;font-size:8px;font-weight:850}
          .th8-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 12px;padding:4px;border:1px solid #dfe5ed;border-radius:14px;background:#f4f7fb}.th8-tab{min-height:38px;border:0;border-radius:10px;background:transparent;color:#68768a;font:900 9px/1 Inter,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}.th8-tab.is-active{background:#fff;color:#0a255d;box-shadow:0 3px 10px rgba(16,38,73,.09)}
          .th8-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 14px}.th8-summary div{padding:10px 8px;border:1px solid #dfe5ed;border-radius:13px;background:#fff;text-align:center}.th8-summary strong{display:block;font-size:17px;font-weight:950;color:#0a255d}.th8-summary span{display:block;margin-top:3px;font-size:7px;font-weight:900;color:#7b8799;text-transform:uppercase}
          .th8-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.th8-card{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;min-height:72px;padding:10px;border:1px solid #dfe5ed;border-radius:15px;background:#fff;box-shadow:0 7px 16px rgba(22,42,78,.055);cursor:pointer}.th8-logo{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:#f4f7fb;overflow:hidden}.th8-logo img{max-width:40px;max-height:40px;object-fit:contain}.th8-logo.nation{border-radius:50%;background:#fff}.th8-card strong{display:block;color:#091c46;font-size:10px;font-weight:950}.th8-card small{display:block;margin-top:4px;color:#7b8799;font-size:6.5px;font-weight:850}.th8-managed{display:inline-flex;width:max-content;margin-top:5px;padding:3px 6px;border-radius:999px;background:#eaf8ef;color:#16743b;font-size:6px;font-weight:950;text-transform:uppercase}
          .th8-back{display:inline-flex;margin:0 0 10px;padding:0;border:0;background:transparent;color:#245aa5;font:900 9px/1 Inter,system-ui,sans-serif}.th8-detail{padding:18px;border:1px solid #dfe5ed;border-radius:17px;background:#fff;box-shadow:0 8px 20px rgba(22,42,78,.055)}.th8-detail-top{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;align-items:center}.th8-detail-logo{width:74px;height:74px;display:grid;place-items:center;border-radius:18px;background:#f4f7fb;overflow:hidden}.th8-detail-logo img{max-width:64px;max-height:64px;object-fit:contain}.th8-detail-logo.nation{border-radius:50%;background:#fff}.th8-detail h2{margin:0;color:#091c46;font-size:20px;font-weight:950;letter-spacing:-.03em}.th8-detail p{margin:5px 0 0;color:#7b8799;font-size:8px;font-weight:850}.th8-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:16px}.th8-field{padding:10px;border:1px solid #edf1f5;border-radius:12px;background:#fafbfd}.th8-field span{display:block;color:#8b96a8;font-size:6px;font-weight:900;text-transform:uppercase}.th8-field strong{display:block;margin-top:4px;color:#0a255d;font-size:9px;font-weight:950;word-break:break-word}
          .th8-manager{position:relative;margin-top:14px;padding:13px 13px 13px 33px;border:1px solid #dfe5ed;border-radius:13px;background:#fafbfd}.th8-manager:before{content:"";position:absolute;left:16px;top:18px;bottom:18px;width:2px;background:#d7ad48}.th8-manager i{position:absolute;left:11px;top:18px;width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:#0a255d;box-shadow:0 0 0 2px #d7ad48}.th8-manager span{display:block;color:#8b96a8;font-size:6px;font-weight:950;text-transform:uppercase}.th8-manager strong{display:block;margin-top:4px;color:#0a255d;font-size:11px;font-weight:950}.th8-manager small{display:block;margin-top:5px;color:#66758a;font-size:7px;font-weight:850}
          .th8-season{margin-top:16px}.th8-season>h3{margin:0 0 5px;color:#091c46;font-size:13px;font-weight:950}.th8-note{margin:0 0 10px;color:#7b8799;font-size:7px;font-weight:850}.th8-comp{margin-top:10px;border:1px solid #dfe5ed;border-radius:14px;background:#fff;overflow:hidden}.th8-comp-head{padding:10px 11px;border-bottom:1px solid #edf1f5;background:#fafbfd}.th8-comp-head strong{display:block;color:#0a255d;font-size:9px;font-weight:950;word-break:break-word}.th8-comp-head span{display:block;margin-top:3px;color:#8b96a8;font-size:6px;font-weight:900;text-transform:uppercase}.th8-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#edf1f5;border-bottom:1px solid #edf1f5}.th8-stat{padding:8px 4px;background:#fff;text-align:center}.th8-stat strong{display:block;color:#0a255d;font-size:10px;font-weight:950}.th8-stat span{display:block;margin-top:2px;color:#8b96a8;font-size:5.5px;font-weight:900;text-transform:uppercase}.th8-subhead{padding:8px 10px;background:#f7f9fc;color:#64748b;font-size:6.5px;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.th8-row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid #edf1f5}.th8-date{color:#7b8799;font-size:6.5px;font-weight:900}.th8-main strong{display:block;color:#091c46;font-size:8px;font-weight:950}.th8-main span{display:block;margin-top:3px;color:#7b8799;font-size:6px;font-weight:850}.th8-score{text-align:right;color:#0a255d;font-size:10px;font-weight:950}.th8-report{display:block;margin-top:4px;padding:4px 6px;border:1px solid #d9a22c;border-radius:7px;background:#fffaf0;color:#956400;font:900 5.5px/1 Inter,system-ui,sans-serif}.th8-empty,.th8-loading,.th8-error{padding:14px;color:#7b8799;text-align:center;font-size:8px;font-weight:850}.th8-error{color:#9d3030}
          @media(max-width:430px){.th8-list{grid-template-columns:1fr}.th8-hero-copy{left:22px}.th8-row{grid-template-columns:52px minmax(0,1fr) auto}}
          `;document.head.appendChild(s);
          }

          async function allRows(table,select){const c=db();if(!c)throw new Error("Client Supabase non disponibile");const out=[];let from=0;while(true){const r=await c.from(table).select(select||"*").range(from,from+999);if(r.error)throw r.error;const rows=r.data||[];out.push(...rows);if(rows.length<1000)break;from+=1000;}return out;}
          async function filteredRows(table,select,column,value){const c=db();if(!c)throw new Error("Client Supabase non disponibile");const out=[];let from=0;while(true){const r=await c.from(table).select(select).eq(column,value).range(from,from+999);if(r.error)throw r.error;const rows=r.data||[];out.push(...rows);if(rows.length<1000)break;from+=1000;}return out;}

          async function loadBase(tab,force){
            const key=tab==="nations"?"nations":"clubs";if(cache[key]&&!force)return cache[key];
            const p=(async()=>{
              if(key==="clubs"){
                const [codex,master]=await Promise.all([allRows("club_codex_global","id,n,i,worlds"),allRows("sm_clubs_master","sm_club_id,club_name,nexus_display_name,image_url,short_name")]);
                const mm=new Map(master.map(r=>[String(r.sm_club_id),r]));
                return codex.filter(activeCodex).map(r=>{const m=mm.get(String(r.id))||null,w=worldData(r);return {type:"club",id:r.id,name:clean(m&&m.nexus_display_name)||clean(r.n)||clean(m&&m.club_name)||`Club ${r.id}`,image:clean(m&&m.image_url),managed:managedCodex(r),worldId:w.sm_world_club_id==null?"":w.sm_world_club_id};}).sort((a,b)=>a.name.localeCompare(b.name,"it"));
              }
              const [codex,nationGw,assignments]=await Promise.all([allRows("national_team_codex_global","id,n,i,worlds"),allRows("gw008_gw_national_teams","sm_world_national_club_id,nation_name"),allRows("gw_manager_assignments","game_world_id,nation_id,assignment_type,start_date,end_date")]);
              const today=todayIso(),managed=new Set(assignments.filter(a=>clean(a.game_world_id).toUpperCase()===WORLD&&clean(a.assignment_type)==="national_team"&&a.nation_id!=null&&assignmentActive(a,today)).map(a=>String(a.nation_id))),gm=new Map(nationGw.map(r=>[norm(r.nation_name),r]));
              return codex.filter(activeCodex).map(r=>{const g=gm.get(norm(r.n))||null;return {type:"nation",id:r.id,name:clean(r.n)||`Nazionale ${r.id}`,image:clean(r.i),managed:managed.has(String(r.id)),worldId:g&&g.sm_world_national_club_id!=null?g.sm_world_national_club_id:""};}).sort((a,b)=>a.name.localeCompare(b.name,"it"));
            })();cache[key]=p;try{return await p;}catch(e){cache[key]=null;throw e;}
          }

          async function loadManagers(force){
            if(cache.managers&&!force)return cache.managers;
            const p=(async()=>{const [assignments,teams,managers]=await Promise.all([allRows("gw_manager_assignments","game_world_id,manager_id,team_id,nation_id,assignment_type,start_date,end_date"),allRows("gw_teams","team_id,game_world_id,sm_club_id"),allRows("imc_managers","manager_id,full_name")]);const today=todayIso(),mm=new Map(managers.map(m=>[clean(m.manager_id),m])),tm=new Map(teams.filter(t=>clean(t.game_world_id).toUpperCase()===WORLD).map(t=>[String(t.team_id),t])),clubs=new Map(),nations=new Map();assignments.filter(a=>clean(a.game_world_id).toUpperCase()===WORLD&&assignmentActive(a,today)).forEach(a=>{const m=mm.get(clean(a.manager_id));if(!m)return;const info={name:clean(m.full_name)||clean(m.manager_id),startDate:clean(a.start_date)};if(clean(a.assignment_type)==="club"&&a.team_id!=null){const t=tm.get(String(a.team_id));if(t&&t.sm_club_id!=null)clubs.set(String(t.sm_club_id),info);}if(clean(a.assignment_type)==="national_team"&&a.nation_id!=null)nations.set(String(a.nation_id),info);});return {clubs,nations};})();cache.managers=p;try{return await p;}catch(e){cache.managers=null;throw e;}
          }

          async function loadReports(fixtureIds){const c=db(),set=new Set(),ids=[...new Set(fixtureIds.filter(v=>v!=null).map(Number).filter(Number.isFinite))];for(let i=0;i<ids.length;i+=150){const r=await c.from("gw008_match_reports").select("sm_fixture_id,parser_status").eq("parser_status","complete").in("sm_fixture_id",ids.slice(i,i+150));if(r.error)throw r.error;(r.data||[]).forEach(x=>set.add(String(x.sm_fixture_id)));}return set;}

          async function loadDetail(item,force){
            const key=`${item.type}:${item.id}`;if(detailCache.has(key)&&!force)return detailCache.get(key);
            const p=(async()=>{const managers=await loadManagers(false),manager=item.type==="nation"?managers.nations.get(String(item.id))||null:managers.clubs.get(String(item.id))||null;const [rh,ra,sh,sa]=await Promise.all([filteredRows("gw008_results",RESULT_SELECT,"home_name",item.name),filteredRows("gw008_results",RESULT_SELECT,"away_name",item.name),filteredRows("gw008_schedule",SCHEDULE_SELECT,"home_name",item.name),filteredRows("gw008_schedule",SCHEDULE_SELECT,"away_name",item.name)]);const dedupe=(rows,idKey)=>{const seen=new Set(),out=[];rows.forEach(r=>{const k=String(r[idKey]!=null?r[idKey]:`${r.competition_key}|${r.home_name}|${r.away_name}|${r.source_page_date||r.match_date}`);if(!seen.has(k)){seen.add(k);out.push(r);}});return out;};const results=dedupe([...rh,...ra],"raw_match_id").sort((a,b)=>clean(b.source_page_date).localeCompare(clean(a.source_page_date)));const schedule=dedupe([...sh,...sa],"schedule_id").sort((a,b)=>clean(a.match_date).localeCompare(clean(b.match_date)));const reports=await loadReports(results.map(r=>r.sm_fixture_id));return {manager,results,schedule,reports};})();detailCache.set(key,p);try{return await p;}catch(e){detailCache.delete(key);throw e;}
          }

          function hero(){return `<div class="th8-hero"><div class="th8-hero-copy"><span>GW008</span><strong>TEAM HUB</strong><small>Gold 1</small></div></div>`;}
          function tabs(){return `<div class="th8-tabs"><button class="th8-tab ${view.tab==="clubs"?"is-active":""}" data-th8-tab="clubs">Clubs</button><button class="th8-tab ${view.tab==="nations"?"is-active":""}" data-th8-tab="nations">Nazionali</button></div>`;}
          function logo(item,detail){const cls=item.type==="nation"?" nation":"",box=detail?"th8-detail-logo":"th8-logo";return `<span class="${box}${cls}">${item.image?`<img src="${esc(item.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}</span>`;}
          function card(item){return `<article class="th8-card" data-th8-open="${esc(item.type)}" data-th8-id="${esc(item.id)}">${logo(item,false)}<div><strong>${esc(item.name)}</strong><small>${item.type==="club"?`ID ${esc(item.id)} · World Club ID ${esc(item.worldId||"-")}`:`ID ${esc(item.id)} · World National ID ${esc(item.worldId||"-")}`}</small>${item.managed?'<span class="th8-managed">Gestita IMC</span>':""}</div></article>`;}
          function renderList(items){const r=pageRoot();if(!r)return;const managed=items.filter(x=>x.managed).length;r.innerHTML=`<section class="${ROOT_FLAG}" data-imc-team-hub-world="${WORLD}">${hero()}${tabs()}<div class="th8-summary"><div><strong>${items.length}</strong><span>${view.tab==="nations"?"Nazionali":"Club"}</span></div><div><strong>${managed}</strong><span>Gestiti IMC</span></div></div><div class="th8-list">${items.map(card).join("")}</div></section>`;}

          function matchView(m,name,dateField){const home=norm(m.home_name)===norm(name);return {home,opponent:clean(home?m.away_name:m.home_name),date:m[dateField],own:home?m.home_score:m.away_score,opp:home?m.away_score:m.home_score,ownPen:home?m.home_penalties:m.away_penalties,oppPen:home?m.away_penalties:m.home_penalties};}
          function summary(rows,name,key){let pg=0,w=0,d=0,l=0,gf=0,ga=0,pts=0;rows.forEach(m=>{const x=matchView(m,name,"source_page_date");pg++;gf+=Number(x.own||0);ga+=Number(x.opp||0);if(x.own>x.opp){w++;pts+=3;}else if(x.own<x.opp)l++;else{d++;pts+=1;}});return {pg,w,d,l,gf,ga,gd:gf-ga,pts,showPts:rows.some(m=>clean(m.sm_action).toLowerCase()==="league")&&!clean(key).toUpperCase().includes("PLAYOFF")};}
          function stat(k,v){return `<div class="th8-stat"><strong>${esc(v)}</strong><span>${esc(k)}</span></div>`;}
          function resultRow(m,item,reports){const x=matchView(m,item.name,"source_page_date"),pen=m.decided_on_penalties&&x.ownPen!=null&&x.oppPen!=null?` (${x.ownPen}-${x.oppPen} rig.)`:"",round=clean(m.sm_round_label),has=m.sm_fixture_id!=null&&reports.has(String(m.sm_fixture_id));return `<div class="th8-row"><div class="th8-date">${esc(formatDate(x.date))}</div><div class="th8-main"><strong>${esc(x.opponent)}</strong><span>${x.home?"Casa":"Trasferta"}${round?` · ${esc(round)}`:""}</span></div><div class="th8-score">${esc(`${Number(x.own||0)} - ${Number(x.opp||0)}${pen}`)}${has?`<button class="th8-report" data-th8-report="${esc(m.sm_fixture_id)}" data-th8-title="${esc(`${m.home_name} - ${m.away_name}`)}">MATCH REPORT</button>`:""}</div></div>`;}
          function scheduleRow(m,item){const x=matchView(m,item.name,"match_date"),round=clean(m.sm_round_label),md=m.matchday_number!=null?`Giornata ${m.matchday_number}`:"";return `<div class="th8-row"><div class="th8-date">${esc(formatDate(x.date))}</div><div class="th8-main"><strong>${esc(x.opponent)}</strong><span>${x.home?"Casa":"Trasferta"}${round?` · ${esc(round)}`:md?` · ${esc(md)}`:""}</span></div><div class="th8-score">-</div></div>`;}
          function competitionBlock(key,results,schedule,item,reports){const s=summary(results,item.name,key),stats=[stat("PG",s.pg),stat("V",s.w),stat("N",s.d),stat("P",s.l),stat("GF",s.gf),stat("GS",s.ga),stat("DR",s.gd>0?`+${s.gd}`:s.gd)];if(s.showPts)stats.push(stat("PTS",s.pts));return `<section class="th8-comp"><div class="th8-comp-head"><strong>${esc(key)}</strong><span>${results.length} risultati · ${schedule.length} schedule</span></div>${results.length?`<div class="th8-stats">${stats.join("")}</div>`:""}<div class="th8-subhead">RISULTATI</div>${results.length?results.map(m=>resultRow(m,item,reports)).join(""):'<div class="th8-empty">Nessun risultato importato.</div>'}<div class="th8-subhead">SCHEDULE</div>${schedule.length?schedule.map(m=>scheduleRow(m,item)).join(""):'<div class="th8-empty">Nessuna schedule importata.</div>'}</section>`;}

          function detailBody(item,data,error){const manager=data&&data.manager?`<div class="th8-manager"><i></i><span>Manager IMC attivo</span><strong>${esc(data.manager.name)}</strong><small>Dal ${esc(formatDate(data.manager.startDate))}</small></div>`:"";let season='<div class="th8-loading">Caricamento stagione…</div>';if(error)season=`<div class="th8-error">${esc(error.message||"Caricamento non riuscito")}</div>`;else if(data){const groups=new Map(),keys=new Set();data.results.forEach(m=>{const k=clean(m.competition_key)||"SENZA COMPETITION KEY";keys.add(k);if(!groups.has(k))groups.set(k,{results:[],schedule:[]});groups.get(k).results.push(m);});data.schedule.forEach(m=>{const k=clean(m.competition_key)||"SENZA COMPETITION KEY";keys.add(k);if(!groups.has(k))groups.set(k,{results:[],schedule:[]});groups.get(k).schedule.push(m);});const sorted=[...keys].sort((a,b)=>a.localeCompare(b,"it"));season=sorted.length?sorted.map(k=>competitionBlock(k,groups.get(k).results,groups.get(k).schedule,item,data.reports)).join(""):'<div class="th8-empty">Nessun dato stagionale importato.</div>';}return `${manager}<section class="th8-season"><h3>STAGIONE</h3><p class="th8-note">Results, Match Report e Schedule divisi per competition_key</p>${season}</section>`;}
          function renderDetail(item,data,error){const r=pageRoot();if(!r)return;const label=item.type==="club"?"Club":"Nazionale",worldLabel=item.type==="club"?"sm_world_club_id":"sm_world_national_club_id";r.innerHTML=`<section class="${ROOT_FLAG}" data-imc-team-hub-world="${WORLD}">${hero()}${tabs()}<button class="th8-back" data-th8-back>‹ Torna alla lista</button><article class="th8-detail"><div class="th8-detail-top">${logo(item,true)}<div><h2>${esc(item.name)}</h2><p>${label} · GW008 · Gold 1</p>${item.managed?'<span class="th8-managed">Gestita IMC</span>':""}</div></div><div class="th8-fields"><div class="th8-field"><span>ID globale</span><strong>${esc(item.id)}</strong></div><div class="th8-field"><span>${esc(worldLabel)}</span><strong>${esc(item.worldId||"-")}</strong></div></div>${detailBody(item,data,error)}</article></section>`;}

          async function renderCurrent(force){
            if(currentWorld()!==WORLD||!hubActive())return;installStyles();syncNav();
            try{const items=await loadBase(view.tab,!!force);if(!view.detail){renderList(items);return;}const item=items.find(x=>String(x.id)===String(view.detail.id));if(!item){view.detail=null;renderList(items);return;}renderDetail(item,null,null);const key=`${item.type}:${item.id}`;try{const data=await loadDetail(item,!!force);if(view.detail&&`${view.detail.type}:${view.detail.id}`===key)renderDetail(item,data,null);}catch(e){if(view.detail&&`${view.detail.type}:${view.detail.id}`===key)renderDetail(item,null,e);}}catch(e){const r=pageRoot();if(r)r.innerHTML=`<section class="${ROOT_FLAG}" data-imc-team-hub-world="${WORLD}">${hero()}${tabs()}<div class="th8-error">${esc(e&&e.message||"Caricamento Team Hub non riuscito")}</div></section>`;}
          }
          function schedule(){clearTimeout(timer);timer=setTimeout(()=>{syncNav();if(currentWorld()===WORLD&&hubActive()&&!isHubPage())renderCurrent(false);},60);}
          function start(){installStyles();syncNav();document.addEventListener("click",e=>{const t=e.target&&e.target.closest?e.target.closest('[data-world-section="clubs"],[data-world-section="national"],[data-th8-tab],[data-th8-open],[data-th8-back],[data-th8-report]'):null;if(!t)return;if(t.matches('[data-world-section="clubs"]')){if(currentWorld()===WORLD){view.tab="clubs";view.detail=null;setTimeout(()=>renderCurrent(false),0);}return;}if(t.matches('[data-world-section="national"]')){if(currentWorld()===WORLD){view.tab="nations";view.detail=null;setTimeout(()=>renderCurrent(false),0);}return;}if(currentWorld()!==WORLD||!hubActive())return;if(t.hasAttribute("data-th8-tab")){e.preventDefault();e.stopPropagation();view.tab=t.getAttribute("data-th8-tab")==="nations"?"nations":"clubs";view.detail=null;renderCurrent(false);return;}if(t.hasAttribute("data-th8-open")){e.preventDefault();e.stopPropagation();view.detail={type:t.getAttribute("data-th8-open")==="nation"?"nation":"club",id:t.getAttribute("data-th8-id")};renderCurrent(false);return;}if(t.hasAttribute("data-th8-back")){e.preventDefault();e.stopPropagation();view.detail=null;renderCurrent(false);return;}if(t.hasAttribute("data-th8-report")){e.preventDefault();e.stopPropagation();const api=window.IMC_MATCH_REPORTS;if(api&&typeof api.openFixture==="function")api.openFixture(WORLD,Number(t.getAttribute("data-th8-report")),{},t.getAttribute("data-th8-title")||"Match Report");}},true);observer=new MutationObserver(schedule);observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});schedule();}
          if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
          window.IMC_TEAM_HUB_GW008={version:VERSION,refresh:()=>{cache={clubs:null,nations:null,managers:null};detailCache.clear();renderCurrent(true);},openTab:t=>{view.tab=t==="nations"?"nations":"clubs";view.detail=null;renderCurrent(false);}};
          })();
