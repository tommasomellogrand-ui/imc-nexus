          grep -Fq 'js/app-core-56.js?v=56.0-core' nexus/js/app.js
          grep -Fq 'js/imc-team-hub-gw008.js?v=2.0.0' nexus/js/app.js
          ! grep -Fq 'imc-entities-current-manager-gw008.js' nexus/js/app.js
          ! grep -Fq 'imc-entity-season-results-gw008.js' nexus/js/app.js
          grep -Fq '<title>IMC Nexus · Build 56</title>' nexus/index.html
          grep -Fq 'js/app.js?v=56.0' nexus/index.html
          grep -Fq 'js/imc-world-features.js?v=1.5' nexus/index.html
