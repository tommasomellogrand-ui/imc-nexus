name: Deploy Restored Build 47 Python
on:
  push:
    paths: ['.github/workflows/deploy-restore-build47-python.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Nexus with Python FTPS
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm

          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          remote=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'

          ftp=FTP_TLS(context=ssl.create_default_context())
          ftp.connect(host,21,timeout=30)
          ftp.login(user,password)
          ftp.prot_p()

          def ensure_dir(path):
              parts=[p for p in path.split('/') if p]
              ftp.cwd('/')
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          root=Path('nexus')
          for local in root.rglob('*'):
              if not local.is_file():
                  continue
              rel=local.relative_to(root).as_posix()
              if rel.endswith('.gitkeep') or rel.startswith('.env') or rel.endswith(('.pem','.key','.p12','.pfx')):
                  continue
              dest_dir=(remote.rstrip('/')+'/'+str(Path(rel).parent).replace('\\','/')).rstrip('/.')
              ensure_dir(dest_dir)
              with local.open('rb') as f:
                  ftp.storbinary('STOR '+local.name,f)
              print('uploaded',rel)
          ftp.quit()
          PY
