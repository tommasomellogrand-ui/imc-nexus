name: Publish GW011 Player Photos
on:
  push:
    branches: [main]
    paths: ['subbuteo-photo-release/**','.github/workflows/publish-subbuteo-photo.yml']
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check subbuteo-photo-release/player-photo-v1.js
          npm install --prefix /tmp/sd-qa playwright@1.56.1
      - name: Publish GW011 presentation
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: python3 subbuteo-photo-release/deploy.py
      - name: Verify public layout and world isolation
        run: NODE_PATH=/tmp/sd-qa/node_modules CHROME_BIN="$(command -v google-chrome)" node subbuteo-photo-release/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subbuteo-photo-layout
          path: /tmp/subbuteo-photo-*.png
