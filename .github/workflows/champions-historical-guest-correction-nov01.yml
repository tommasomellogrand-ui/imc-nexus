name: Correct all historical Champions guest results
on:
  push:
    branches: [main]
    paths: ['.github/workflows/champions-historical-guest-correction-nov01.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import results and verify standings
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          token=secrets.token_hex(32)
          name='imc-db-inspect-'+secrets.token_hex(16)+'.php'
          php="<?php if(time()>EXPIRES||!hash_equals('TOKENHASH',hash('sha256',$_SERVER['HTTP_X_IMC_INSPECT']??''))){http_response_code(404);exit;} @unlink(__FILE__);require __DIR__.'/core/bootstrap.php';\ntry{$c=nexus_config();$p=nexus_db($c,nexus_target($c,'GW001'));$p->beginTransaction();$key='GW001_IMC_CHAMPIONS_LEAGUE';\n$rows=nexus_rows($p,'SELECT * FROM GW001_IMC_Results WHERE game_world_id=? AND competition_key=? AND imc_season=2 FOR UPDATE',['GW001',$key]);\n$checked=0;$changed=0;$audit=[];\nforeach($rows as $r){\n$hg=in_array(strtolower(trim($r['home_name'])),['fc porto','porto','newcastle united','newcastle'],true);\n$ag=in_array(strtolower(trim($r['away_name'])),['fc porto','porto','newcastle united','newcastle'],true);\nif(!($hg xor $ag))continue;\n$hs=$hg?0:3;$as=$ag?0:3;$checked++;\n$args=['GW001',$key,2,$r['match_date'],$r['home_name'],$r['away_name']];\n$where='game_world_id=? AND competition_key=? AND imc_season=? AND match_date=? AND home_name=? AND away_name=?';\n$match=nexus_rows($p,'SELECT * FROM GW001_IMC_Results WHERE '.$where,$args);\nif(count($match)!==1)throw new RuntimeException('duplicate_guest_match');\nif((int)$r['home_score']!==$hs||(int)$r['away_score']!==$as||$r['result_status']!=='AWARDED')$changed++;\n$q=$p->prepare(\"UPDATE GW001_IMC_Results SET home_score=?,away_score=?,result_status='AWARDED' WHERE \".$where);$q->execute(array_merge([$hs,$as],$args));\n$v=nexus_rows($p,'SELECT home_score,away_score,result_status FROM GW001_IMC_Results WHERE '.$where,$args)[0];\nif((int)$v['home_score']!==$hs||(int)$v['away_score']!==$as||$v['result_status']!=='AWARDED')throw new RuntimeException('write_verification_failed');\n$audit[]=['date'=>$r['match_date'],'home'=>$r['home_name'],'away'=>$r['away_name'],'score'=>[$hs,$as]];\n}\nif($checked<8)throw new RuntimeException('missing_historical_matches');\n$p->commit();nexus_out(['ok'=>true,'checked'=>$checked,'corrected'=>$changed,'matches'=>$audit]);\n}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();nexus_out(['ok'=>false,'error'=>$e->getMessage()]);}"
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok'),result
              print(json.dumps(result,indent=2))
          finally:
              try: f.delete(name)
              except error_perm: pass
              assert name not in [x.rsplit('/',1)[-1] for x in f.nlst()], 'Temporary diagnostic cleanup failed'
              print('TEMPORARY_DIAGNOSTIC_REMOVED')
              f.quit()
          
          base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_CHAMPIONS_LEAGUE'
          def get(mode):return json.load(urllib.request.urlopen(base+'&mode='+mode,timeout=30))
          r=get('results')['rows'];s=get('schedule')['rows'];t=get('standings')['rows']
          checked=0
          for row in r:
              for side,other in [('home','away'),('away','home')]:
                  if row[side+'_name'] in ['FC Porto','Newcastle United']:
                      assert row[side+'_score']==0 and row[other+'_score']==3
                      assert row[side+'_imc_manager_name']=='Guest' and row[side+'_imc_manager_id'] is None
                      checked+=1
          assert checked>=8
          for name in ['FC Porto','Newcastle United']:
              team=next(x for x in t if x['team_name']==name)
              assert team['manager_name']=='Guest' and team['points']==0 and team['gf']==0 and team['ga']==3*team['played']
          print('PASS historical database and public results, Guest names, standings')
          PY
