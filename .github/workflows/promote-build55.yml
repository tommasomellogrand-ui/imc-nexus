name: Promote Nexus Build 55

on:
  push:
    paths:
      - '.github/workflows/promote-build55.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Promote index to Build 55
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('nexus/index.html')
          s = p.read_text(encoding='utf-8')
          old_title = '<title>IMC Nexus · Build 54</title>'
          old_script = 'js/app.js?v=54.2'
          if old_title not in s:
              raise SystemExit('Build 54 title not found')
          if old_script not in s:
              raise SystemExit('app.js?v=54.2 not found')
          s = s.replace(old_title, '<title>IMC Nexus · Build 55</title>', 1)
          s = s.replace(old_script, 'js/app.js?v=55.1', 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/promote-build55.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/index.html .github/workflows/promote-build55.yml
          git commit -m "Nexus Build 55: promote production index"
          git push
