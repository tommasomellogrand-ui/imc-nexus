name: Import Conference November 2 results
on:
  push:
    branches: [main]
    paths: ['.github/workflows/conference-nov02-results.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import results and verify standings
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          token=secrets.token_hex(32)
          name='imc-db-inspect-'+secrets.token_hex(16)+'.php'
          php="<?php if(time()>EXPIRES||!hash_equals('TOKENHASH',hash('sha256',$_SERVER['HTTP_X_IMC_INSPECT']??''))){http_response_code(404);exit;} @unlink(__FILE__);require __DIR__.'/core/bootstrap.php';\ntry{$c=nexus_config();$p=nexus_db($c,nexus_target($c,'GW001'));$p->beginTransaction();\n$data=json_decode('[[\"GW001_IMC_CONFERENCE_LEAGUE\",8,[[\"FK Partizan\",\"FC Schalke 04\",0,2],[\"Palmeiras\",\"1. FC Kaiserslautern\",0,3],[\"Parma Calcio 1913\",\"Juventus\",3,0],[\"Guangzhou FC\",\"CR Flamengo\",1,2],[\"Campobasso Calcio\",\"Shakhtar Donetsk\",2,1],[\"River Plate\",\"São Paulo FC\",0,1],[\"Sunderland\",\"Académica de Coimbra\",1,1]]]]',true);$inserted=0;$existing=0;\nforeach($data as [$key,$round,$matches]){\n$teams=[];foreach(['GW001_IMC_Results','GW001_IMC_Schedule'] as $table)foreach(nexus_rows($p,\"SELECT * FROM $table WHERE competition_key=? AND imc_season=2\",[$key]) as $r)foreach(['home','away'] as $side){$id=$r[$side.'_sm_club_id']??$r[$side.'_sm_team_id']??null;if($id)$teams[strtolower($r[$side.'_name'])]=$id;}\nforeach($matches as [$h,$a,$hs,$as]){\n$args=['GW001',2,$key,'2026-11-02',$h,$a];$where='game_world_id=? AND imc_season=? AND competition_key=? AND match_date=? AND home_name=? AND away_name=?';\n$old=nexus_rows($p,'SELECT * FROM GW001_IMC_Results WHERE '.$where.' FOR UPDATE',$args);\nif(count($old)>1)throw new RuntimeException('duplicate');\nif($old){if((int)$old[0]['home_score']!==$hs||(int)$old[0]['away_score']!==$as)throw new RuntimeException('score_conflict');$existing++;continue;}\n$s=nexus_rows($p,'SELECT * FROM GW001_IMC_Schedule WHERE '.$where,$args);if(count($s)>1)throw new RuntimeException('duplicate_schedule');\n$fp=hash('sha256',implode('|',$args));$fixture=$s[0]['sm_fixture_id']??(900000000000000+hexdec(substr($fp,0,12)));\n$ids=[];$aw=false;foreach([$h,$a] as $name){if(in_array($name,['Juventus','FC Porto','Newcastle United'],true)){$ids[]=null;$aw=true;}else{if(!isset($teams[strtolower($name)]))throw new RuntimeException('unknown_team:'.$name);$ids[]=$teams[strtolower($name)];}}\n$q=$p->prepare(\"INSERT INTO GW001_IMC_Results (game_world_id,imc_season,competition_key,sm_fixture_id,sm_action,competition_group,competition_round,match_date,home_sm_club_id,home_name,away_sm_club_id,away_name,home_score,away_score,result_status,fingerprint,imported_at) VALUES ('GW001',2,?,?,'imc_custom','IMC',?,'2026-11-02',?,?,?,?,?,?,?,?,NOW())\");\n$q->execute([$key,$fixture,$round,$ids[0],$h,$ids[1],$a,$hs,$as,$aw?'AWARDED':'FINISHED',$fp]);$inserted++;\n}}\n$p->commit();nexus_out(['ok'=>true,'inserted'=>$inserted,'existing'=>$existing]);}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();nexus_out(['ok'=>false,'error'=>$e->getMessage()]);}"
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok'),result
              print(json.dumps(result,indent=2))
          finally:
              try: f.delete(name)
              except error_perm: pass
              assert name not in [x.rsplit('/',1)[-1] for x in f.nlst()], 'Temporary diagnostic cleanup failed'
              print('TEMPORARY_DIAGNOSTIC_REMOVED')
              f.quit()
          
          data=json.loads("[[\"GW001_IMC_CONFERENCE_LEAGUE\",8,[[\"FK Partizan\",\"FC Schalke 04\",0,2],[\"Palmeiras\",\"1. FC Kaiserslautern\",0,3],[\"Parma Calcio 1913\",\"Juventus\",3,0],[\"Guangzhou FC\",\"CR Flamengo\",1,2],[\"Campobasso Calcio\",\"Shakhtar Donetsk\",2,1],[\"River Plate\",\"São Paulo FC\",0,1],[\"Sunderland\",\"Académica de Coimbra\",1,1]]]]")
          for key,round_no,matches in data:
              base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition='+key
              rows=json.load(urllib.request.urlopen(base+'&mode=results',timeout=30))['rows']
              for h,a,hs,aws in matches:
                  rr=[x for x in rows if x['match_date']=='2026-11-02' and x['home_name'].lower()==h.lower() and x['away_name'].lower()==a.lower()]
                  assert len(rr)==1 and rr[0]['home_score']==hs and rr[0]['away_score']==aws,(h,a)
                  for side in ['home','away']:
                      if rr[0][side+'_name'].lower() in ['juventus','fc porto','newcastle united']:
                          assert rr[0][side+'_imc_manager_name']=='Guest'
              table=json.load(urllib.request.urlopen(base+'&mode=standings',timeout=30))['rows']
              assert all(x['played']==round_no for x in table)
              assert len(rows)==len(matches)*round_no
              print('PASS',key,len(rows),'results, standings round',round_no)
          PY
