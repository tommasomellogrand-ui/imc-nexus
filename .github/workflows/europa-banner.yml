name: Publish Europa banner and standings logos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/europa-banner.yml']
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node --check europa-banner-release/daytime-imc.js
      - name: Publish approved banner and adapter
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,hashlib,urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/');domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root+'/alltoplayfor')
          def read(n):
           b=io.BytesIO();f.retrbinary('RETR '+n,b.write);return b.getvalue()
          old=read('daytime-imc.js');new=Path('europa-banner-release/daytime-imc.js').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='b3d7a8140bfd82ca511af76655207c4789ebd855ed6e8e9d155c33dcb7636565' or old==new
          image=Path('europa-banner-release/imc-europa-banner.webp').read_bytes()
          f.storbinary('STOR assets/imc-europa-banner.webp',io.BytesIO(image));assert read('assets/imc-europa-banner.webp')==image
          f.storbinary('STOR daytime-imc.js.backup-'+os.environ['GITHUB_SHA'][:12],io.BytesIO(old))
          assert read('daytime-imc.js')==old
          f.storbinary('STOR daytime-imc.js.tmp',io.BytesIO(new));assert read('daytime-imc.js.tmp')==new
          f.rename('daytime-imc.js.tmp','daytime-imc.js');assert read('daytime-imc.js')==new;f.quit()
          for path,data in [('daytime-imc.js',new),('assets/imc-europa-banner.webp',image)]:
           assert urllib.request.urlopen('https://www.italianmastersclub.it/nexus/alltoplayfor/'+path+'?v='+os.environ['GITHUB_SHA'],timeout=30).read()==data
          PY
      - name: Verify Europa mobile page
        run: |
          npm install --prefix /tmp/qa playwright@1.56.1
          node <<'JS'
          const {chromium}=require('/tmp/qa/node_modules/playwright');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage({viewport:{width:390,height:844}});await p.goto('https://www.italianmastersclub.it/nexus/alltoplayfor/daytime/europa/');await p.locator('.imc-europa-banner').waitFor();await p.waitForTimeout(2000);await p.screenshot({path:'/tmp/europa-mobile.png',fullPage:true});const result=await p.evaluate(()=>{const banner=document.querySelector('.imc-europa-banner'),logos=[...document.querySelectorAll('.imc-standing-logo')];console.log('unused');return {ancestors:(()=>{let a=banner,l=[];while(a){l.push([a.tagName,a.className,a.getBoundingClientRect().top,getComputedStyle(a).paddingTop,getComputedStyle(a).marginTop]);a=a.parentElement}return l})(),before:[...document.querySelectorAll('body *')].filter(x=>x.getBoundingClientRect().height>0&&x.getBoundingClientRect().bottom<=banner.getBoundingClientRect().top).map(x=>[x.tagName,x.className,x.textContent.slice(0,100)]),banner:banner.complete&&banner.naturalWidth>0,top:banner.getBoundingClientRect().top,logos:logos.length,loaded:logos.filter(x=>x.complete&&x.naturalWidth>0).length,rows:document.querySelectorAll('.daytime-imc-table tbody tr').length,results:document.querySelectorAll('[data-status=result]').length,overflow:document.documentElement.scrollWidth>innerWidth,above:[...document.querySelectorAll('.series-breadcrumb,.programme-links,.programme-heading,.edition-heading,.daytime-tabs,.daytime-back')].filter(x=>x.getBoundingClientRect().height>0).length}});console.log(JSON.stringify(result));if(!result.banner||result.logos!==14||result.loaded!==14||result.rows!==14||result.results!==14||result.above||result.overflow||result.top>35)throw Error('Europa mobile mismatch');await p.screenshot({path:'/tmp/europa-mobile.png',fullPage:true});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europa-mobile
          path: /tmp/europa-mobile.png
