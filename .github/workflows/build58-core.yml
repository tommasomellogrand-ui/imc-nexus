name: Build 58 Core One Shot

# One-shot source migration for GW008 native ownership.
on:
  push:
    paths:
      - '.github/workflows/build58-core.yml'

permissions:
  contents: write

jobs:
  build58:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Build 58 core from Build 56
        shell: bash
        run: |
          set -euo pipefail
          cp nexus/js/app-core-56.js nexus/js/app-core-58.js
          python3 - <<'PY'
          from pathlib import Path

          path = Path('nexus/js/app-core-58.js')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'const NEXUS_BUILD = "56";',
              'const NEXUS_BUILD = "58";',
              'build marker'
          )

          replace_once(
              '<b>${nexusNavIcon("clubs")}</b><span>CLUBS</span>',
              '<b>${nexusNavIcon("clubs")}</b><span>${state.selectedWorld==="GW008"?"TEAM HUB":"CLUBS"}</span>',
              'GW008 Team Hub label'
          )

          national = '''            <button data-world-section="national" class="${state.worldSection==="national" ? "active" : ""}">
              <b>${nexusNavIcon("national")}</b><span>NAZIONALI</span>
            </button>'''
          national_new = '''            ${state.selectedWorld==="GW008"?"":`<button data-world-section="national" class="${state.worldSection==="national" ? "active" : ""}">
              <b>${nexusNavIcon("national")}</b><span>NAZIONALI</span>
            </button>`}'''
          replace_once(national, national_new, 'GW008 legacy national nav')

          managers_old = '''      }else{
        if(state.selectedManager){
          root.innerHTML = managerProfilePage();
          bindManagerProfile();
        }else{
          root.innerHTML = managerRegistryPage();
          bindManagerRegistry();
        }
      }
      return;'''
          managers_new = '''      }else{
        if(state.selectedWorld === "GW008"){
          root.innerHTML = "";
        }else if(state.selectedManager){
          root.innerHTML = managerProfilePage();
          bindManagerProfile();
        }else{
          root.innerHTML = managerRegistryPage();
          bindManagerRegistry();
        }
      }
      return;'''
          replace_once(managers_old, managers_new, 'GW008 legacy manager renderer')

          path.write_text(s, encoding='utf-8')
          PY

          node --check nexus/js/app-core-58.js
          grep -F 'const NEXUS_BUILD = "58";' nexus/js/app-core-58.js
          grep -F 'state.selectedWorld==="GW008"?"TEAM HUB":"CLUBS"' nexus/js/app-core-58.js
          grep -F 'state.selectedWorld==="GW008"?"":`<button data-world-section="national"' nexus/js/app-core-58.js
          grep -F 'if(state.selectedWorld === "GW008"){' nexus/js/app-core-58.js

      - name: Commit Build 58 core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/js/app-core-58.js
          git commit -m "Create Build 58 core with GW008 native ownership"
          git push origin HEAD:main
