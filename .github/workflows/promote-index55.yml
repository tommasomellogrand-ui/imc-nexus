name: Promote Nexus Index 55

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-index55.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Align index to Build 55
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nexus/index.html')
          s = p.read_text(encoding='utf-8')
          old_title = '<title>IMC Nexus · Build 54</title>'
          old_app = 'js/app.js?v=54.1'
          if s.count(old_title) != 1:
              raise SystemExit(f'Unexpected title count: {s.count(old_title)}')
          if s.count(old_app) != 1:
              raise SystemExit(f'Unexpected app ref count: {s.count(old_app)}')
          s = s.replace(old_title, '<title>IMC Nexus · Build 55</title>', 1)
          s = s.replace(old_app, 'js/app.js?v=55.1', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -Fq '<title>IMC Nexus · Build 55</title>' nexus/index.html
          grep -Fq 'js/app.js?v=55.1' nexus/index.html

      - name: Commit index 55
        run: |
          set -euo pipefail
          git config user.name 'tommasomellogrand-ui'
          git config user.email 'tommaso.mello.grand@gmail.com'
          git add nexus/index.html
          git commit -m 'Nexus Build 55: align index runtime'
          git push origin HEAD:main
