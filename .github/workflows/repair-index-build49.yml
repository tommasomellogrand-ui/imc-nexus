name: Hotfix Nexus Runtime

on:
  push:
    paths:
      - '.github/workflows/repair-index-build49.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime
        run: |
          set -euo pipefail
          node --check nexus/js/app.js
          grep -Fq 'const NEXUS_BUILD = "50";' nexus/js/app.js

      - name: Upload app.js to Aruba and verify
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS

          local = Path('nexus/js/app.js').read_bytes()
          local_sha = hashlib.sha256(local).hexdigest()
          host = os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user = os.environ['ARUBA_FTP_USERNAME']
          password = os.environ['ARUBA_FTP_PASSWORD']
          raw = os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain = host[4:] if host.startswith('ftp.') else host
          remote = raw if raw.startswith('/www.') else f'/www.{domain}{raw}'

          ctx = ssl.create_default_context(); ctx.check_hostname = False
          ftp = FTP_TLS(context=ctx)
          ftp.connect(host,21,timeout=30); ftp.login(user,password); ftp.prot_p(); ftp.cwd(remote)
          with io.BytesIO(local) as fh:
              ftp.storbinary('STOR js/app.js', fh, blocksize=65536)
          buf = io.BytesIO(); ftp.retrbinary('RETR js/app.js', buf.write, blocksize=65536)
          try: ftp.delete('js/app-core.js')
          except Exception: pass
          ftp.quit()
          remote_bytes = buf.getvalue()
          remote_sha = hashlib.sha256(remote_bytes).hexdigest()
          if remote_bytes != local:
              raise SystemExit('FTP app.js read-back mismatch')
          Path('nexus-hotfix-result.txt').write_text(
              f'FTP_APP_MATCH=YES\nLOCAL_SIZE={len(local)}\nLOCAL_SHA256={local_sha}\nREMOTE_SHA256={remote_sha}\n',
              encoding='utf-8')
          PY

      - name: Verify public runtime
        run: |
          set -euo pipefail
          LOCAL_SHA="$(sha256sum nexus/js/app.js | awk '{print $1}')"
          OK=0
          for attempt in 1 2 3 4 5 6; do
            URL="https://www.italianmastersclub.it/nexus/js/app.js?hotfix=$(date +%s)-$attempt"
            if curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$URL" -o /tmp/app.js; then
              HTTP_SHA="$(sha256sum /tmp/app.js | awk '{print $1}')"
              if [ "$HTTP_SHA" = "$LOCAL_SHA" ]; then
                printf 'HTTP_APP_MATCH=YES\n' >> nexus-hotfix-result.txt
                OK=1
                break
              fi
            fi
            sleep 3
          done
          if [ "$OK" -ne 1 ]; then
            printf 'HTTP_APP_MATCH=NO\n' >> nexus-hotfix-result.txt
            exit 1
          fi

      - name: Record result
        if: always()
        run: |
          set -euo pipefail
          test -f nexus-hotfix-result.txt || printf 'HOTFIX_FAILED_BEFORE_REPORT=YES\n' > nexus-hotfix-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add nexus-hotfix-result.txt
          git commit -m 'chore: record Nexus runtime hotfix result' || exit 0
          git push
