name: Deploy Nexus Hotfix Two Files
on:
  push:
    paths: ['.github/workflows/deploy-hotfix-two-files.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload index and app
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS, error_perm

          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          remote=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'

          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect(host,21,timeout=30); ftp.login(user,password); ftp.prot_p()

          def cwd_make(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part); ftp.cwd(part)

          files=[('nexus/index.html',remote,'index.html'),('nexus/js/app.js',remote+'/js','app.js')]
          for src,dst,name in files:
              cwd_make(dst)
              with open(src,'rb') as f: ftp.storbinary('STOR '+name,f)
              print('uploaded',src,'->',dst+'/'+name)
          ftp.quit()
          PY
