name: Publish Conference round 1 results and round 2 fixtures
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-conference-20261027.yml']
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update only Europa data and verify public results
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,urllib.request,copy
          from ftplib import FTP_TLS
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root+'/competitions')
          def read(name):
           b=io.BytesIO();f.retrbinary('RETR '+name,b.write);return b.getvalue()
          name='imc-cups.json';before=read(name);data=json.loads(before);original=copy.deepcopy(data)
          cups=[c for c in data if c['world']=='GW001' and c['season']==2 and c['key']=='GW001_IMC_CONFERENCE_LEAGUE']
          assert len(cups)==1
          cup=cups[0]
          pairs=[('94079148','94080273',0,2),('94082591','94078885',1,0),('94079049','94079067',1,0),('94078843','94079165',1,1),('94078981','94079172',1,0),('94079073','guest-juventus',3,0),('94079115','94079061',1,2)]
          nextpairs=[('94080273','94082591'),('94078885','94079049'),('94079067','94078843'),('94079165','94078981'),('94079172','94079073'),('guest-juventus','94079115'),('94079061','94079148')]
          teams={t['team_id']:t for t in cup['teams']}
          for i,(h,a,hs,aws) in enumerate(pairs,1):
           found=[m for m in cup['matches'] if m['id']==f'GW001-CO-20261026-{i}']
           assert len(found)==1
           m=found[0];assert (m['home_id'],m['away_id'],m['date'])==(h,a,'2026-10-26')
           assert (m['homeScore'],m['awayScore']) in [(None,None),(hs,aws)]
           m.update(homeScore=hs,awayScore=aws,source='9788c109-8837-4404-96ab-3734ba384ce1.jpeg; Juventus guest ruling')
          for i,(h,a) in enumerate(nextpairs,1):
           m=dict(id=f'GW001-CO-20261027-{i}',round=2,date='2026-10-27',time='20:00',home=teams[h]['name'],away=teams[a]['name'],home_id=h,away_id=a,homeScore=0 if h=='guest-juventus' else None,awayScore=3 if h=='guest-juventus' else None,source='43bad72b-81b8-49d1-a059-caacf8e8ddb8.jpeg')
           found=[x for x in cup['matches'] if x['id']==m['id']]
           if found: assert len(found)==1 and found[0]==m
           else:
            assert not any(x['date']==m['date'] and (x['home_id']==h or x['away_id']==h or x['home_id']==a or x['away_id']==a) for x in cup['matches'])
            cup['matches'].append(m)
          assert len({m['id'] for m in cup['matches']})==len(cup['matches'])
          for a,b in zip(original,data):
           if a['key']!=cup['key']:assert a==b
          out=(json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode()
          assert read(name)==before
          f.storbinary('STOR '+name+'.backup-'+os.environ['GITHUB_SHA'][:12],io.BytesIO(before))
          tmp=name+'.tmp-'+os.environ['GITHUB_SHA'][:12]
          f.storbinary('STOR '+tmp,io.BytesIO(out));assert read(tmp)==out
          assert read(name)==before
          f.rename(tmp,name);assert read(name)==out
          f.quit()
          base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_CONFERENCE_LEAGUE'
          def get(mode):
           return json.load(urllib.request.urlopen(base+'&mode='+mode+'&verify='+os.environ['GITHUB_SHA'],timeout=30))
          r=get('results');s=get('schedule');t=get('standings')
          assert r['ok'] and s['ok'] and t['ok']
          rows=[x for x in r['rows'] if x['match_date']=='2026-10-26'];assert len(rows)==7
          for i,(h,a,hs,aws) in enumerate(pairs,1):
           x=next(x for x in rows if x['sm_fixture_id']==f'GW001-CO-20261026-{i}')
           assert (x['home_sm_team_id'],x['away_sm_team_id'],x['home_score'],x['away_score'])==(h,a,hs,aws)
           assert x['home_imc_manager_name'] and x['away_imc_manager_name']
          rows=[x for x in s['rows']+r['rows'] if x['match_date']=='2026-10-27'];assert len(rows)==7
          for i,(h,a) in enumerate(nextpairs,1):
           x=next(x for x in rows if x['sm_fixture_id']==f'GW001-CO-20261027-{i}')
           assert (x['home_sm_team_id'],x['away_sm_team_id'],x['match_time'])==(h,a,'20:00')
           if h=='guest-juventus':assert (x['home_score'],x['away_score'],x['awarded'])==(0,3,True)
           else:assert x['home_score'] is None and x['away_score'] is None
           assert x['home_imc_manager_name'] and x['away_imc_manager_name']
          assert len(t['rows'])==14 and sum(x['points'] for x in t['rows'])==23 and sum(x['gf'] for x in t['rows'])==16
          assert sum(x['played'] for x in t['rows'])==16
          print('PASS: Conference round 1 results, round 2 fixtures, guest awards and standings verified')
          
          PY
      - name: Verify DayTime Conference
        run: |
          npm install --prefix /tmp/elqa playwright@1.56.1
          node <<'JS'
          const {chromium}=require('/tmp/elqa/node_modules/playwright');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});try{const p=await b.newPage({viewport:{width:390,height:844}});await p.goto('https://www.italianmastersclub.it/nexus/alltoplayfor/daytime/conference/');await p.waitForFunction(()=>document.querySelectorAll('[data-status=result]').length===8,{},{timeout:45000});if(await p.locator('[data-status=schedule]').count()!==6)throw Error('Schedule mismatch');if(await p.locator('tbody tr').count()!==14)throw Error('Standings mismatch');console.log('DayTime verified: 8 results including 2 guest awards, 6 fixtures, 14 teams');}finally{await b.close();}})().catch(e=>{console.error(e);process.exit(1)});
          JS
