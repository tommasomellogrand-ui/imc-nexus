name: Import Champions League opening schedule
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-champions-opening-schedule.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Count database objects without changing data
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          token=secrets.token_hex(32)
          name='imc-db-inspect-'+secrets.token_hex(16)+'.php'
          php="<?php if(time()>EXPIRES||!hash_equals('TOKENHASH',hash('sha256',$_SERVER['HTTP_X_IMC_INSPECT']??''))){http_response_code(404);exit;} @unlink(__FILE__);require __DIR__.'/core/bootstrap.php';\ntry{$c=nexus_config();$p=nexus_db($c,nexus_target($c,'GW001'));$p->beginTransaction();\n$sets=['CHAMPIONS'=>[['Dynamo Dresden','FC Porto'],['Atlético Madrid','Valencia CF'],['Celtic','Borussia Dortmund'],['Torino','Bologna FC'],['Sampdoria','SS Lazio'],['Newcastle United','Legia Warszawa']]];\nforeach($sets as $slug=>$pairs){$key='GW001_IMC_'.$slug.'_LEAGUE';$core=nexus_db($c,'core');$teams=['FC Porto'=>null,'Newcastle United'=>null];\nforeach(nexus_rows($core,'SELECT m.`SM World Club ID` wid,c.name FROM `IMC Game World Club Mapping` m JOIN `IMC Club Codex Global` c ON c.id=m.`Club ID` WHERE m.`Game World`=?',['GW001']) as $r)$teams[$r['name']]=$r['wid'];\n\nforeach($pairs as [$h,$a]){if(!array_key_exists($h,$teams)||!array_key_exists($a,$teams))throw new RuntimeException('unknown_team');\n$args=['GW001',2,$key,'2026-10-28',$h,$a];$where='game_world_id=? AND imc_season=? AND competition_key=? AND match_date=? AND home_name=? AND away_name=?';\n$rows=nexus_rows($p,'SELECT * FROM GW001_IMC_Schedule WHERE '.$where.' FOR UPDATE',$args);if(count($rows)>1)throw new RuntimeException('duplicate_schedule');\nif(!$rows){$q=$p->prepare(\"INSERT INTO GW001_IMC_Schedule (sm_fixture_id,game_world_id,imc_season,competition_key,sm_action,competition_group,competition_round,match_date,match_time,home_sm_team_id,home_name,away_sm_team_id,away_name,fingerprint) VALUES (?,'GW001',2,?,'imc_custom','IMC',?,'2026-10-28','20:00',?,?,?,?,?)\");$q->execute([900000000000000+hexdec(substr(hash('sha256',implode('|',$args)),0,12)),$key,'1',$teams[$h],$h,$teams[$a],$a,hash('sha256',implode('|',$args))]);}\n}}$p->commit();nexus_out(['ok'=>true]);}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();nexus_out(['ok'=>false,'error'=>$e->getMessage()]);}"
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok'),result
              print(json.dumps(result,indent=2))
          finally:
              try: f.delete(name)
              except error_perm: pass
              assert name not in [x.rsplit('/',1)[-1] for x in f.nlst()], 'Temporary diagnostic cleanup failed'
              print('TEMPORARY_DIAGNOSTIC_REMOVED')
              f.quit()
          
          base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_CHAMPIONS_LEAGUE'
          d=json.load(urllib.request.urlopen(base+'&mode=schedule',timeout=30))
          assert d['ok'] and len(d['rows'])==6,d
          assert all(r['home_score'] is None and r['away_score'] is None for r in d['rows'])
          print('PASS Champions: six scheduled fixtures, no premature results')
          PY
