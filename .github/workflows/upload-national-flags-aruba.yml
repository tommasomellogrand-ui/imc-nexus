name: Upload National Flags to Aruba

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-national-flags-aruba.yml'

permissions:
  contents: read

jobs:
  upload-flags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload 80 flags to Aruba
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find nexus/assets/flags/nations -maxdepth 1 -name '*.svg' | wc -l)" -eq 80
          HOST="${ARUBA_FTP_HOST#ftp://}"
          HOST="${HOST#ftps://}"
          DOMAIN="${HOST#ftp.}"
          RAW_REMOTE="${ARUBA_FTP_REMOTE_DIR%/}"
          if [[ "$RAW_REMOTE" == /www.* ]]; then
            REMOTE="$RAW_REMOTE"
          else
            REMOTE="/www.$DOMAIN$RAW_REMOTE"
          fi

          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set net:max-retries 2;
            open -u \"$ARUBA_FTP_USERNAME\",\"$ARUBA_FTP_PASSWORD\" ftp://$HOST;
            mkdir -p \"$REMOTE/assets/flags/nations\";
            mirror -R --verbose --parallel=4 --no-perms nexus/assets/flags/nations \"$REMOTE/assets/flags/nations\";
            bye;
          "

      - name: Verify all public flags
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.italianmastersclub.it/nexus/assets/flags/nations'
          for id in $(seq 1 80); do
            curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$BASE/$id.svg?verify=${GITHUB_SHA}" -o "/tmp/$id.svg"
            test -s "/tmp/$id.svg"
            grep -Fq '<svg' "/tmp/$id.svg"
          done
          echo 'NATIONAL_FLAGS_PUBLIC_VERIFIED=80/80'
