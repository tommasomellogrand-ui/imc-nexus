name: Publish programme entry and horizontal banners
on:
  push:
    branches: [main]
    paths: ["entry-release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 programmes-release/build.py
          node --check entry-release/home.js
          npm install --prefix /tmp/entry-qa playwright@1.56.1
      - name: Preview navigation and mobile
        run: NODE_PATH=/tmp/entry-qa/node_modules CHROME_BIN="$(command -v google-chrome)" PREVIEW=1 node entry-release/verify.cjs
      - name: Publish four reviewed files
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: python3 entry-release/deploy.py
      - name: Verify public navigation and images
        run: NODE_PATH=/tmp/entry-qa/node_modules CHROME_BIN="$(command -v google-chrome)" node entry-release/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-entry-review
          path: /tmp/entry-*.png
