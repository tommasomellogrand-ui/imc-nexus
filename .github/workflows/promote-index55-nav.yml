name: Promote Nexus Index 55 Navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-index55-nav.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Build 55 index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexus/index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('<title>IMC Nexus · Build 54</title>') != 1:
              raise SystemExit('Unexpected Build 54 title count')
          if s.count('js/app.js?v=54.1') != 1:
              raise SystemExit('Unexpected Build 54 app ref count')
          s=s.replace('<title>IMC Nexus · Build 54</title>','<title>IMC Nexus · Build 55</title>',1)
          s=s.replace('js/app.js?v=54.1','js/app.js?v=55.1',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Build 55 index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/index.html
          git commit -m 'Nexus Build 55: restore production index'
          git push origin HEAD:main
