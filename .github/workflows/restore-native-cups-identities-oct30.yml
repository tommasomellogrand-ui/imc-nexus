name: Restore native cup data source and verify Europa
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-native-cups-identities-oct30.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import results and verify standings
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          import pathlib,subprocess
          b=io.BytesIO();f.retrbinary('RETR competitions/imc-cups.php',b.write);before=b.getvalue()
          assert b"file_get_contents(__DIR__.'/imc-cups.json')" in before, 'Source changed; stop'
          api="<?php\ndeclare(strict_types=1);\nrequire dirname(__DIR__).'/core/bootstrap.php';\ntry {\n $gw=nexus_world($_GET['world']??'');$season=nexus_season($_GET['season']??null);$key=(string)($_GET['competition']??'');$mode=(string)($_GET['mode']??'schedule');\n $names=['GW001_IMC_CHAMPIONS_LEAGUE'=>'RTH Champions League','GW001_IMC_EUROPA_LEAGUE'=>'RTH Europa League','GW001_IMC_CONFERENCE_LEAGUE'=>'RTH Conference League','GW001_IMC_CLUB_WORLD_CUP'=>'RTH Club World Cup'];\n if($gw!=='GW001'||!isset($names[$key])||$season===null)throw new InvalidArgumentException('invalid_imc_competition');\n if(!in_array($mode,['results','schedule','standings'],true))throw new InvalidArgumentException('invalid_mode');\n $c=nexus_config();$core=nexus_db($c,'core');$db=nexus_db($c,nexus_target($c,$gw));\n require __DIR__.'/match-teams.php';\n $params=[$gw,$season,$key];\n $rs=nexus_enrich_match_teams($core,$gw,nexus_rows($db,'SELECT * FROM GW001_IMC_Results WHERE game_world_id=? AND imc_season=? AND competition_key=?',$params));\n $ss=nexus_enrich_match_teams($core,$gw,nexus_rows($db,'SELECT * FROM GW001_IMC_Schedule WHERE game_world_id=? AND imc_season=? AND competition_key=?',$params));\n $teamIds=[];foreach(array_merge($rs,$ss) as $tr)foreach(['home','away'] as $side){$nk=nexus_team_name_key($tr[$side.'_name']);$tid=(string)($tr[$side.'_sm_club_id']??$tr[$side.'_sm_team_id']??'');if($tid!==''&&$tid!=='0'&&!isset($teamIds[$nk]))$teamIds[$nk]=$tid;}\n $cup=['name'=>$names[$key],'format'=>str_contains($key,'WORLD_CUP')?'knockout':'league','teams'=>[],'matches'=>[]];$known=[];$fixtures=[];$details=[];\n foreach([[$rs,true],[$ss,false]] as [$rows,$finished])foreach($rows as $row){\n  if($finished&&($row['home_score']===null||$row['away_score']===null))continue;\n  $ids=[];foreach(['home','away'] as $side){$id=$teamIds[nexus_team_name_key($row[$side.'_name'])]??'';if(in_array(nexus_team_name_key($row[$side.'_name']),['juventus','fcporto','newcastleunited'],true))$id='guest-'.nexus_team_name_key($row[$side.'_name']);elseif($id===''||$id==='0')$id='guest-'.nexus_team_name_key($row[$side.'_name']);$ids[$side]=$id;\n   if(!isset($known[$id])){$cup['teams'][]=['team_id'=>$id,'team_name'=>$row[$side.'_name']];$known[$id]=true;}\n   $details[$id]=['logo'=>$row[$side.'_logo_url']??null,'manager'=>$row[$side.'_imc_manager_name']??null];\n  }\n  if($finished){$guestIds=['guest-juventus','guest-fcporto','guest-newcastleunited'];$hg=in_array($ids['home'],$guestIds,true);$ag=in_array($ids['away'],$guestIds,true);if($hg xor $ag){$row['home_score']=$hg?0:3;$row['away_score']=$ag?0:3;$row['result_status']='AWARDED';}}\n  $identity=implode('|',[$row['match_date'],$ids['home'],$ids['away']]);\n  if(isset($fixtures[$identity]))continue;$fixtures[$identity]=true;\n  $cup['matches'][]=['id'=>'IMC-'.hash('sha256',$key.'|'.$season.'|'.$identity),'date'=>$row['match_date'],'time'=>substr((string)($row['match_time']??'20:00'),0,5),'round'=>$row['competition_round'],'home_id'=>$ids['home'],'away_id'=>$ids['away'],'homeScore'=>$finished?(int)$row['home_score']:null,'awayScore'=>$finished?(int)$row['away_score']:null,'awarded'=>($row['result_status']??'')==='AWARDED'];\n }\n $assignments=nexus_rows($core,\"SELECT a.manager_id,a.team_id,a.start_date,a.end_date,m.full_name FROM `IMC Manager Assignment Global` a JOIN `IMC Manager Codex Global` m ON m.manager_id=a.manager_id WHERE a.game_world_id=? AND a.assignment_type='club' ORDER BY a.start_date DESC,a.id DESC\",[$gw]);\n $manager=function(string $id,string $date)use($assignments){$found=[];foreach($assignments as $a)if((string)$a['team_id']===$id&&(!$a['start_date']||$a['start_date']<=$date)&&(!$a['end_date']||$a['end_date']>=$date))$found[$a['manager_id']]=$a;return count($found)===1?array_values($found)[0]:null;};\n $logos=[];foreach(nexus_rows($core,'SELECT m.`SM World Club ID` world_id,c.image_url FROM `IMC Game World Club Mapping` m LEFT JOIN `IMC Club Codex Global` c ON c.id=m.`Club ID` WHERE m.`Game World`=?',[$gw]) as $t)$logos[(string)$t['world_id']]=$t['image_url'];\n foreach($details as $id=>$detail)if($detail['logo'])$logos[$id]=$detail['logo'];\n $today=(new DateTimeImmutable('now',new DateTimeZone('Europe/Rome')))->format('Y-m-d');$table=[];\n foreach($cup['teams'] as $t)$table[$t['team_id']]=['team_id'=>$t['team_id'],'team_name'=>$t['team_name'],'logo_url'=>$logos[$t['team_id']]??null,'manager_name'=>in_array($t['team_id'],['guest-juventus','guest-fcporto','guest-newcastleunited'],true)?'Guest':($manager($t['team_id'],$today)['full_name']??null),'points'=>0,'played'=>0,'won'=>0,'drawn'=>0,'lost'=>0,'gf'=>0,'ga'=>0,'gd'=>0];\n $results=[];$schedule=[];$seen=[];\n foreach($cup['matches'] as $m){\n  if(isset($seen[$m['id']]))throw new RuntimeException('duplicate_fixture');$seen[$m['id']]=true;\n  $played=is_int($m['homeScore'])&&is_int($m['awayScore'])&&$m['homeScore']>=0&&$m['awayScore']>=0;\n  $r=['sm_fixture_id'=>$m['id'],'match_date'=>$m['date'],'match_time'=>$m['time'],'competition_round'=>(string)$m['round'],'competition_stage'=>'','competition_group_name'=>'','sm_action'=>'league','home_score'=>$m['homeScore'],'away_score'=>$m['awayScore'],'competition_key'=>$key,'awarded'=>$m['awarded']];\n  foreach(['home','away'] as $side){$id=$m[$side.'_id'];if(!isset($table[$id]))throw new RuntimeException('unknown_team');$a=in_array($id,['guest-juventus','guest-fcporto','guest-newcastleunited'],true)?['full_name'=>'Guest']:$manager($id,$m['date']);$r[$side.'_name']=$table[$id]['team_name'];$r[$side.'_sm_club_id']=$id;$r[$side.'_sm_team_id']=$id;$r[$side.'_logo_url']=$logos[$id]??null;$r[$side.'_imc_manager_id']=$a['manager_id']??null;$r[$side.'_imc_manager_name']=$a['full_name']??null;}\n  if(!$played){$schedule[]=$r;continue;}$results[]=$r;\n  $h=&$table[$m['home_id']];$a=&$table[$m['away_id']];$hs=$m['homeScore'];$as=$m['awayScore'];$h['played']++;$a['played']++;$h['gf']+=$hs;$h['ga']+=$as;$a['gf']+=$as;$a['ga']+=$hs;\n  if($hs>$as){$h['won']++;$h['points']+=3;$a['lost']++;}elseif($hs<$as){$a['won']++;$a['points']+=3;$h['lost']++;}else{$h['drawn']++;$a['drawn']++;$h['points']++;$a['points']++;}unset($h,$a);\n }\n foreach($table as &$t)$t['gd']=$t['gf']-$t['ga'];unset($t);$table=array_values($table);\n usort($table,fn($a,$b)=>($b['points']<=>$a['points'])?:($b['gd']<=>$a['gd'])?:($b['gf']<=>$a['gf'])?:strcmp($a['team_name'],$b['team_name']));foreach($table as $i=>&$t)$t['position']=$i+1;unset($t);\n $rows=$mode==='standings'?($cup['format']==='league'?$table:[]):($mode==='results'?$results:$schedule);\n nexus_out(['ok'=>true,'game_world_id'=>$gw,'season'=>$season,'competition_key'=>$key,'rows'=>$rows,'groups'=>$mode==='standings'&&$cup['format']==='league'&&count($table)?[['group_name'=>$cup['name'],'rows'=>$table]]:[]]);\n}catch(InvalidArgumentException $e){nexus_out(['ok'=>false,'error'=>$e->getMessage()],422);}catch(Throwable $e){nexus_out(['ok'=>false,'error'=>'imc_competition_error'],500);}\n"
          pathlib.Path('/tmp/cups.php').write_text(api);subprocess.run(['php','-l','/tmp/cups.php'],check=True)
          f.storbinary('STOR competitions/imc-cups.php.backup-'+os.environ['GITHUB_SHA'][:12],io.BytesIO(before))
          f.storbinary('STOR competitions/imc-cups.php',io.BytesIO(api.encode()))
          try:
              base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_EUROPA_LEAGUE'
              def get(mode):return json.load(urllib.request.urlopen(base+'&mode='+mode,timeout=30))
              r=get('results')['rows'];s=get('schedule')['rows'];t=get('standings')['rows']
              print('COUNTS',len(r),len(s),len(t));print('TABLE',json.dumps(t,ensure_ascii=False))
              assert len(r)==56 and len({x['sm_fixture_id'] for x in r})==56
              assert len(s)==7 and all(x['match_date']=='2026-10-31' and x['home_score'] is None for x in s)
              assert len(t)==14 and all(x['played']==8 for x in t)
              assert sum(x['points'] for x in t)==156
              expected=[["Tottenham Hotspur","Palermo FC",3,0],["AS Roma","Dynamo Kyiv",1,0],["Feyenoord","Boca Juniors",2,2],["TSV 1860 München","Genoa CFC",4,0],["Hertha BSC","AS Reggina 1914",3,1],["SSC Napoli","AEK Athens",0,2],["Fenerbahçe SK","Olympique Marseille",0,0]]
              for h,a,hs,aws in expected:
                  matches=[x for x in r if x['match_date']=='2026-10-30' and x['home_name']==h and x['away_name']==a]
                  assert len(matches)==1 and matches[0]['home_score']==hs and matches[0]['away_score']==aws,(h,a)
              expected_pairs=[["Dynamo Kyiv","Palermo FC"],["Boca Juniors","AS Roma"],["Genoa CFC","Feyenoord"],["AS Reggina 1914","TSV 1860 München"],["AEK Athens","Hertha BSC"],["Olympique Marseille","SSC Napoli"],["Fenerbahçe SK","Tottenham Hotspur"]]
              assert sorted((x['home_name'],x['away_name']) for x in s)==sorted(tuple(x) for x in expected_pairs)
              print('PASS EUROPA: 56 unique results, seven future matches, standings verified')
          except:
              f.storbinary('STOR competitions/imc-cups.php',io.BytesIO(before));raise
          finally:f.quit()
          PY
