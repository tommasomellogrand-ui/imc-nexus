name: Align Index 55 Native Navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/align-index55-native-navigation.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Align Nexus index to Build 55
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexus/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>IMC Nexus · Build 54</title>','<title>IMC Nexus · Build 55</title>')
          s=s.replace('js/app.js?v=54.1','js/app.js?v=55.1')
          if '<title>IMC Nexus · Build 55</title>' not in s:
              raise SystemExit('Build 55 title missing')
          if 'js/app.js?v=55.1' not in s:
              raise SystemExit('Build 55 app ref missing')
          if 'js/imc-native-navigation.js?v=1.0.0' not in s:
              raise SystemExit('Native navigation loader missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit aligned index
        run: |
          set -euo pipefail
          git config user.name 'tommasomellogrand-ui'
          git config user.email 'tommaso.mello.grand@gmail.com'
          git add nexus/index.html
          git commit -m 'Nexus Build 55: align native navigation index'
          git push origin HEAD:main
