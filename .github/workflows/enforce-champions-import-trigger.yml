name: Correct all historical Champions guest results
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enforce-champions-import-trigger.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import results and verify standings
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,secrets,hashlib,time,urllib.request
          from ftplib import FTP_TLS,error_perm
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root)
          token=secrets.token_hex(32)
          name='imc-db-inspect-'+secrets.token_hex(16)+'.php'
          php="<?php if(time()>EXPIRES||!hash_equals('TOKENHASH',hash('sha256',$_SERVER['HTTP_X_IMC_INSPECT']??''))){http_response_code(404);exit;} @unlink(__FILE__);require __DIR__.'/core/bootstrap.php';\ntry{$c=nexus_config();$p=nexus_db($c,nexus_target($c,'GW001'));\n$body=\"BEGIN DECLARE hg BOOLEAN; DECLARE ag BOOLEAN; IF NEW.game_world_id='GW001' AND NEW.competition_key='GW001_IMC_CHAMPIONS_LEAGUE' THEN SET hg=LOWER(TRIM(NEW.home_name)) IN ('fc porto','porto','newcastle united','newcastle'); SET ag=LOWER(TRIM(NEW.away_name)) IN ('fc porto','porto','newcastle united','newcastle'); IF hg THEN SET NEW.home_sm_manager_id=NULL; END IF; IF ag THEN SET NEW.away_sm_manager_id=NULL; END IF; IF hg XOR ag THEN SET NEW.home_score=IF(hg,0,3),NEW.away_score=IF(ag,0,3),NEW.result_status='AWARDED'; END IF; END IF; END\";\nforeach(['INSERT'=>'bi','UPDATE'=>'bu'] as $event=>$suffix){$name='imc_champions_guests_'.$suffix;$found=nexus_rows($p,'SELECT TRIGGER_NAME FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA=DATABASE() AND TRIGGER_NAME=?',[$name]);if(!$found)$p->exec(\"CREATE TRIGGER $name BEFORE $event ON GW001_IMC_Results FOR EACH ROW \".$body);}\n$p->beginTransaction();\n$fp=hash('sha256',random_bytes(32));\n$q=$p->prepare(\"INSERT INTO GW001_IMC_Results (game_world_id,competition_key,home_name,away_name,home_score,away_score,home_sm_manager_id,away_sm_manager_id,fingerprint) VALUES ('GW001','GW001_IMC_CHAMPIONS_LEAGUE','FC PORTO','Test opponent',9,8,123,456,?)\");$q->execute([$fp]);\n$r=nexus_rows($p,'SELECT * FROM GW001_IMC_Results WHERE fingerprint=?',[$fp])[0];if((int)$r['home_score']!==0||(int)$r['away_score']!==3||$r['home_sm_manager_id']!==null)throw new RuntimeException('insert_test_failed');\n$q=$p->prepare(\"UPDATE GW001_IMC_Results SET home_name='Test opponent',away_name='Newcastle United',home_score=9,away_score=8,away_sm_manager_id=123 WHERE fingerprint=?\");$q->execute([$fp]);\n$r=nexus_rows($p,'SELECT * FROM GW001_IMC_Results WHERE fingerprint=?',[$fp])[0];if((int)$r['home_score']!==3||(int)$r['away_score']!==0||$r['away_sm_manager_id']!==null)throw new RuntimeException('update_test_failed');$p->rollBack();\n$p->beginTransaction();$p->exec(\"UPDATE GW001_IMC_Results SET home_score=home_score WHERE game_world_id='GW001' AND competition_key='GW001_IMC_CHAMPIONS_LEAGUE' AND (LOWER(TRIM(home_name)) IN ('fc porto','porto','newcastle united','newcastle') OR LOWER(TRIM(away_name)) IN ('fc porto','porto','newcastle united','newcastle'))\");$p->commit();\nnexus_out(['ok'=>true,'insert_update_tests'=>'passed','historical_rows'=>'normalized']);}catch(Throwable $e){if(isset($p)&&$p->inTransaction())$p->rollBack();nexus_out(['ok'=>false,'error'=>$e->getMessage()]);}"
          php=php.replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest()).replace('EXPIRES',str(int(time.time())+120))
          try:
              f.storbinary('STOR '+name,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/nexus/'+name,headers={'X-IMC-Inspect':token})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result.get('ok'),result
              print(json.dumps(result,indent=2))
          finally:
              try: f.delete(name)
              except error_perm: pass
              assert name not in [x.rsplit('/',1)[-1] for x in f.nlst()], 'Temporary diagnostic cleanup failed'
              print('TEMPORARY_DIAGNOSTIC_REMOVED')
              f.quit()
          
          url='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_CHAMPIONS_LEAGUE&mode=results'
          rows=json.load(urllib.request.urlopen(url,timeout=30))['rows']
          count=0
          for r in rows:
              for side,other in [('home','away'),('away','home')]:
                  if r[side+'_name'].lower() in ['fc porto','porto','newcastle united','newcastle']:
                      assert r[side+'_imc_manager_name'].lower()=='guest'
                      assert r[side+'_score']==0 and r[other+'_score']==3
                      count+=1
          assert count>=10
          print('PASS all historical guest labels and scores:',count)
          PY
