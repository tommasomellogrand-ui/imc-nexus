name: Fix future Juventus guest awards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-guest-future-awards.yml']
permissions:
  contents: read
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update only Europa data and verify public results
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PY'
          import os,ssl,io,json,urllib.request,subprocess,pathlib
          from ftplib import FTP_TLS
          host=os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          raw=os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain=host[4:] if host.startswith('ftp.') else host
          root=raw if raw.startswith('/www.') else f'/www.{domain}{raw}'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect(host,21,timeout=30);f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p();f.cwd(root+'/competitions')
          def read(n):
           b=io.BytesIO();f.retrbinary('RETR '+n,b.write);return b.getvalue()
          name='imc-cups.php';before=read(name);s=before.decode()
          needle="  $played=is_int($m['homeScore'])"
          assert s.count(needle)==1 and '$guestIds' in s
          patch="""  // Guest awards become results only at the fixture's scheduled kickoff in Rome.
            if($awarded && new DateTimeImmutable($m['date'].' '.($m['time']?:'20:00'),new DateTimeZone('Europe/Rome')) > new DateTimeImmutable('now',new DateTimeZone('Europe/Rome'))){$m['homeScore']=null;$m['awayScore']=null;$awarded=false;}
          """
          s=s.replace(needle,patch+needle)
          p=pathlib.Path('/tmp/cups.php');p.write_text(s);subprocess.run(['php','-l',str(p)],check=True)
          out=s.encode()
          def put(body):
           tmp=name+'.tmp-'+os.environ['GITHUB_SHA'][:12];f.storbinary('STOR '+tmp,io.BytesIO(body));assert read(tmp)==body;f.rename(tmp,name)
          assert read(name)==before
          f.storbinary('STOR '+name+'.backup-'+os.environ['GITHUB_SHA'][:12],io.BytesIO(before))
          put(out)
          try:
           base='https://www.italianmastersclub.it/nexus/competitions/imc-cups.php?world=GW001&season=2&competition=GW001_IMC_CONFERENCE_LEAGUE'
           def get(mode):return json.load(urllib.request.urlopen(base+'&mode='+mode+'&verify='+os.environ['GITHUB_SHA'],timeout=30))
           r=get('results');t=get('standings');s=get('schedule')
           assert r['ok'] and t['ok'] and s['ok']
           assert len(r['rows'])==7 and len(s['rows'])==7
           j=next(x for x in t['rows'] if x['team_id']=='guest-juventus')
           assert (j['played'],j['points'],j['ga'])==(1,0,3)
           sh=next(x for x in t['rows'] if x['team_id']=='94079115')
           assert (sh['played'],sh['points'])==(1,0)
           assert sum(x['points'] for x in t['rows'])==20 and all(x['played']==1 for x in t['rows'])
           m=next(x for x in s['rows'] if x['home_sm_team_id']=='guest-juventus')
           assert m['match_date']=='2026-10-27' and m['home_score'] is None and m['away_score'] is None
           print('PASS: 14 teams played once; Juventus 1 loss; Shakhtar 0 points; seven upcoming fixtures')
          except:
           put(before);raise
          finally:f.quit()
          PY
