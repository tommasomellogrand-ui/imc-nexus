name: Load Native Navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/load-native-navigation.yml'

permissions:
  contents: write

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Add navigation bridge to Nexus index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexus/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="js/imc-world-features.js?v=1.2"></script>'
          nav='<script src="js/imc-native-navigation.js?v=1.0.0"></script>'
          if nav in s:
              raise SystemExit('Native navigation script already present')
          if s.count(marker)!=1:
              raise SystemExit(f'Unexpected world-features marker count: {s.count(marker)}')
          s=s.replace(marker,marker+'\n  '+nav,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'js/imc-native-navigation.js?v=1.0.0' nexus/index.html

      - name: Commit index loader
        run: |
          set -euo pipefail
          git config user.name 'tommasomellogrand-ui'
          git config user.email 'tommaso.mello.grand@gmail.com'
          git add nexus/index.html
          git commit -m 'Nexus: load native navigation bridge'
          git push origin HEAD:main
