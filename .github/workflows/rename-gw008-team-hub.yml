name: Rename GW008 Team Hub

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rename-gw008-team-hub.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Rename module and UI
        shell: bash
        run: |
          set -euo pipefail

          test -f nexus/js/imc-entities-gw008.js
          test ! -e nexus/js/imc-team-hub-gw008.js
          mv nexus/js/imc-entities-gw008.js nexus/js/imc-team-hub-gw008.js

          python3 - <<'PY'
          from pathlib import Path

          hub=Path('nexus/js/imc-team-hub-gw008.js')
          text=hub.read_text(encoding='utf-8')
          required=[
              'span.textContent="ENTITIES"',
              'span.textContent==="ENTITIES"',
              'clubs.setAttribute("aria-label","Entities")',
              '<strong>ENTITIES</strong>'
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing expected token in Team Hub module: {token}')
          text=text.replace('span.textContent="ENTITIES"','span.textContent="TEAM HUB"')
          text=text.replace('span.textContent==="ENTITIES"','span.textContent==="TEAM HUB"')
          text=text.replace('clubs.setAttribute("aria-label","Entities")','clubs.setAttribute("aria-label","Team Hub")')
          text=text.replace('<strong>ENTITIES</strong>','<strong>TEAM HUB</strong>')
          hub.write_text(text,encoding='utf-8')

          app=Path('nexus/js/app.js')
          at=app.read_text(encoding='utf-8')
          count=at.count('js/imc-entities-gw008.js?v=1.0.4')
          if count != 2:
              raise SystemExit(f'Expected 2 old module loader refs, found {count}')
          at=at.replace('js/imc-entities-gw008.js?v=1.0.4','js/imc-team-hub-gw008.js?v=1.0.4')
          app.write_text(at,encoding='utf-8')

          index=Path('nexus/index.html')
          it=index.read_text(encoding='utf-8')
          if 'js/app.js?v=55.3.3' not in it:
              raise SystemExit('Expected app cache version 55.3.3 not found')
          it=it.replace('js/app.js?v=55.3.3','js/app.js?v=55.3.4',1)
          index.write_text(it,encoding='utf-8')
          PY

          node --check nexus/js/imc-team-hub-gw008.js
          node --check nexus/js/app.js
          grep -Fq 'TEAM HUB' nexus/js/imc-team-hub-gw008.js
          grep -Fq 'js/imc-team-hub-gw008.js?v=1.0.4' nexus/js/app.js
          grep -Fq 'js/app.js?v=55.3.4' nexus/index.html
          test ! -e nexus/js/imc-entities-gw008.js

      - name: Commit rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/js/imc-team-hub-gw008.js nexus/js/imc-entities-gw008.js nexus/js/app.js nexus/index.html
          git commit -m 'Rename GW008 Entities module to Team Hub'
          git push origin HEAD:main
