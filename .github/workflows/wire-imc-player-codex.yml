name: Wire IMC Player Codex

on:
  workflow_run:
    workflows:
      - Deploy Nexus to Aruba
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: nexus-player-codex-wire
  cancel-in-progress: false

jobs:
  wire:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Validate Codex addon
        shell: bash
        run: |
          set -euo pipefail
          test -s nexus/js/imc-player-codex.js
          node --check nexus/js/imc-player-codex.js

      - name: Wire addon into Nexus index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('nexus/index.html')
          text = path.read_text(encoding='utf-8')
          addon = '  <script src="js/imc-player-codex.js?v=1.0"></script>'

          if addon not in text:
              pattern = r'(^\s*<script\s+src="js/app\.js\?v=[^"]+"\s*></script>\s*$)'
              match = re.search(pattern, text, flags=re.MULTILINE)
              if not match:
                  raise SystemExit('Unable to find Nexus app.js script tag')
              text = text[:match.end()] + '\n' + addon + text[match.end():]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Persist wired index in repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- nexus/index.html; then
            echo 'INDEX_ALREADY_WIRED=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nexus/index.html
          git commit -m 'build: wire IMC Player Codex addon'
          git push origin HEAD:main

      - name: Upload wired Codex runtime to Aruba
        shell: bash
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_FTP_REMOTE_DIR: ${{ secrets.ARUBA_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm

          host = os.environ['ARUBA_FTP_HOST'].replace('ftp://','').replace('ftps://','')
          user = os.environ['ARUBA_FTP_USERNAME']
          password = os.environ['ARUBA_FTP_PASSWORD']
          raw = os.environ['ARUBA_FTP_REMOTE_DIR'].rstrip('/')
          domain = host[4:] if host.startswith('ftp.') else host
          remote_root = raw if raw.startswith('/www.') else f'/www.{domain}{raw}'

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ftp = FTP_TLS(context=ctx)
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)
          ftp.prot_p()

          def ensure_dir(path):
              ftp.cwd(remote_root)
              rel = path.removeprefix(remote_root).strip('/')
              for part in rel.split('/') if rel else []:
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          files = [
              (Path('nexus/js/imc-player-codex.js'), f'{remote_root}/js', 'imc-player-codex.js'),
              (Path('nexus/index.html'), remote_root, 'index.html'),
          ]

          for local, remote_dir, remote_name in files:
              data = local.read_bytes()
              ensure_dir(remote_dir)
              with local.open('rb') as fh:
                  ftp.storbinary(f'STOR {remote_name}', fh, blocksize=65536)
              buf = io.BytesIO()
              ftp.retrbinary(f'RETR {remote_name}', buf.write, blocksize=65536)
              remote = buf.getvalue()
              if remote != data:
                  raise SystemExit(f'FTPS read-back mismatch for {remote_name}')
              print(f'UPLOAD_MATCH=YES {remote_name} {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}')

          ftp.quit()
          PY
